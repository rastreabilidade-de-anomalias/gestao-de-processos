  <div class="card"><h3>Dicionário de dados<span class="sp"></span><input class="in act" placeholder="Buscar…" data-f="q" value="${esc(S.q)}" style="width:180px"><select class="in act" data-f="pilar"><option value="">Todos os pilares</option>${pil.map(p=>`<option ${S.pilar===p?'selected':''}>${esc(p)}</option>`).join('')}</select></h3>
  ${table('variaveis',f,['id','pilar','variavel','finalidade','fonte','responsavel','disponibilidade','natureza','tabela'],{limit:250})}<div class="hint">“Tabela no app” liga a variável ao cadastro ou evento onde ela é registrada. Não confunda dado ainda não levantado com zero.</div></div>`;

  <table class="t" style="margin-top:10px"><thead><tr><th>Tabela</th><th>Campo</th><th>Tipo</th><th></th></tr></thead><tbody>${Object.entries(cf).flatMap(([e,l])=>l.map(f=>`<tr><td>${esc(SCHEMA[e]?.l||e)}</td><td>${esc(f.l)}</td><td>${esc({t:'Texto',n:'Número',d:'Data',h:'Hora',s:'Lista',x:'Texto longo'}[f.t])}</td><td><button class="btn sm dg" data-a="delField" data-e="${e}" data-v="${esc(f.k)}">Remover</button></td></tr>`)).join('')||'<tr><td colspan=4 class="mu">Nenhum campo personalizado.</td></tr>'}</tbody></table></div></div>
  <div class="row c2"><div class="card"><h3>🗂️ Dados</h3><div class="mft" style="margin-top:0"><button class="btn pr" data-a="importAll">⬆ Importar planilha completa (todas as abas)</button><button class="btn" data-a="exportJSON">Copiar backup (JSON)</button><button class="btn" data-a="importJSON">Restaurar backup</button><button class="btn y" data-a="limparSim">Remover registros simulados</button><button class="btn pr" data-a="gravarBaseConf">Recarregar base inicial</button></div>
  <div class="hint">“Remover registros simulados” apaga só o que está marcado como SIMULADO e mantém cadastros reais, inventário e mapa de processo. “Recarregar base inicial” substitui todas as tabelas.</div>
  <table class="t" style="margin-top:10px"><thead><tr><th>Tabela</th><th class="n">Registros</th><th class="n">Simulados</th><th class="n">Tamanho</th></tr></thead><tbody>${Object.keys(SCHEMA).map(e=>{const sz=JSON.stringify(DATA[e]||{}).length;return `<tr><td>${esc(SCHEMA[e].l)}</td><td class="n">${rows(e).length}</td><td class="n">${rows(e).filter(isSim).length}</td><td class="n ${sz>200000?'r':''}">${fmt(sz/1024,1)} KB</td></tr>`}).join('')}</tbody></table><div class="hint">Cada tabela fica num documento de até 256 KB.</div></div>
  <div class="card"><h3>ℹ️ Como o app calcula</h3><div class="calc">Pessoas no intervalo = previsão × % da curva (ou catraca real)<br>Projeção = intervalos futuros × (real ÷ previsto até agora)<br>kg = pessoas × taxa de escolha × gramatura × repetição<br>Cubas = ⌈kg × (1 + margem) ÷ kg por cuba⌉<br>Duração da cuba = kg por cuba ÷ consumo (kg/min)<br>AUI = duração da cuba − tempo de reposição<br>Saldo na linha = leitura + reposições − consumo desde a leitura<br>Cobertura = saldo ÷ consumo atual<br>Cobertura de estoque = saldo dos lotes ÷ consumo médio diário<br>Degelo atrasado = não liberado após a liberação prevista</div>
  <div class="hint">Começa com regras verificáveis; modelos estatísticos entram depois de haver histórico confiável.</div></div></div>`;
};

/* ================= formulários e modal ================= */
function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#mbox').innerHTML=''}
function input(f,v){
  const val=v??'';
  if(f.t==='s'||f.t==='r'){const o=f.t==='r'?rows(f.e).sort(by('id')).map(x=>[x.id,(x.nome||x.variavel||x.subprocesso||x.descricao||x.id)+(x.nome?'':'')]):opts(f).map(x=>[x,x]);if(val&&!o.some(x=>x[0]===val))o.unshift([val,val]);return `<select class="in" name="${f.k}"><option value=""></option>${o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(val)?'selected':''}>${esc(f.t==='r'&&f.e==='anomalias'?a+' — '+(get('anomalias',a)||{}).tipo:b)}</option>`).join('')}</select>`}
  if(f.t==='x')return `<textarea class="in" name="${f.k}" rows="3">${esc(val)}</textarea>`;
  const ty={n:'number',d:'date',h:'time',dt:'datetime-local'}[f.t]||'text';
  return `<input class="in" name="${f.k}" type="${ty}" ${f.t==='n'?'step="any"':''} value="${esc(val)}">`}
function openForm(e,id,preset){
  const r=id?get(e,id):{...(preset||{})};if(id&&!r)return;
  const fs=fields(e);
  if(!id){if(!r.id)r.id=nextId(e);if(fs.some(f=>f.k==='data')&&!r.data)r.data=S.date;if(!r._origem)r._origem='Real'}
  modal(`<h2>${SCHEMA[e].ic} ${id?'Editar':'Novo'} — ${esc(SCHEMA[e].l)}<span class="sp" style="flex:1"></span><button class="btn sm" data-a="close">✕</button></h2>
  <form id="frm" data-e="${e}" data-id="${esc(id||'')}"><div class="fg">${fs.map(f=>`<label class="${f.t==='x'?'full':''}">${esc(f.l)}${f.custom?' <span class="tag">personalizado</span>':''}${input(f,r[f.k])}</label>`).join('')}</div>
  <div class="mft"><button class="btn pr" type="submit">Salvar</button><button class="btn" type="button" data-a="close">Cancelar</button><span style="flex:1"></span>${id?`<button class="btn dg" type="button" data-a="askdel" data-e="${e}" data-id="${esc(id)}">Excluir</button>`:''}</div>${r._atualizado?`<div class="hint">Última alteração: ${new Date(r._atualizado).toLocaleString('pt-BR')}</div>`:''}</form>`);
}
function nextId(e){const pre={unidades:'UN',preparacoes:'PR',insumos:'IN',fornecedores:'FO',camaras:'CM',equipamentos:'EQ',curvas:'CV',previsoes:'PV',catraca:'CT',leituras:'LL',reposicoes:'RP',pedidos:'PC',lotes:'LT',degelo:'DG',ordens:'OP',expedicoes:'EXP',anomalias:'AN',acoes:'AC',variaveis:'X',processo:'SP'}[e]||'R';
  const ns=rows(e).map(r=>{const m=String(r.id).match(new RegExp('^'+pre+'-(\\d+)$'));return m?+m[1]:0});const n=Math.max(0,...ns)+1;return pre+'-'+String(n).padStart(3,'0')}
document.addEventListener('submit',ev=>{
  if(ev.target.id!=='frm')return;ev.preventDefault();
  const fm=ev.target,e=fm.dataset.e,old=fm.dataset.id,fs=fields(e),r=old?{...get(e,old)}:{};
  fs.forEach(f=>{const el=fm.elements[f.k];if(!el)return;let v=el.value;if(f.t==='n')v=v===''?'':N(v);r[f.k]=v});
  r.id=String(r.id||'').trim();if(!r.id){toast('Informe o código',true);return}
  if(!old&&get(e,r.id)){toast('Já existe um registro com esse código',true);return}
  if(old&&old!==r.id){writeRow(e,{id:old},true)}
  if(e==='degelo'&&r.inicio&&r.janela_h&&!r.liberacao){const d=new Date(r.inicio);d.setMinutes(d.getMinutes()+N(r.janela_h)*60);r.liberacao=d.toISOString().slice(0,16)}
  planCache.clear();writeRow(e,r);closeModal();toast('Salvo');
});
function askDel(e,id){modal(`<h2>Excluir registro?</h2><p>${esc(SCHEMA[e].l)}: <b>${esc(id)}</b>. Esta ação não pode ser desfeita.</p><div class="mft"><button class="btn dg" data-a="del" data-e="${e}" data-id="${esc(id)}">Excluir</button><button class="btn" data-a="close">Cancelar</button></div>`)}

/* ================= importação ================= */
let IMP=null;
function openImport(e){
  modal(`<h2>⬆ Importar planilha — ${esc(SCHEMA[e].l)}<span class="sp" style="flex:1"></span><button class="btn sm" data-a="close">✕</button></h2>
  <p class="mu">Aceita .xlsx, .xls ou .csv. A primeira linha deve ter os nomes das colunas; o app reconhece nomes parecidos (ex.: “Unidade de medida”, “unidade_medida”). Você confere o mapeamento antes de salvar.</p>
  <input type="file" id="impFile" accept=".xlsx,.xls,.csv" class="in" data-e="${e}"><div id="impBody" style="margin-top:12px"></div>`);
}
function readFile(file,e){
  if(typeof XLSX==='undefined'){toast('Leitor de planilhas não carregou; use CSV.',true)}
  const rd=new FileReader();
  rd.onload=()=>{try{let data;
    if(typeof XLSX!=='undefined'){const wb=XLSX.read(rd.result,{type:'array',cellDates:false});
      const sh=wb.SheetNames.map(n=>({n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})}));
      IMP={e,sheets:sh,si:0};}
    else{const txt=new TextDecoder().decode(rd.result);const sep=txt.split('\n')[0].includes(';')?';':',';IMP={e,sheets:[{n:'CSV',rows:txt.split(/\r?\n/).filter(Boolean).map(l=>l.split(sep))}],si:0}}
    impRender()}catch(err){toast('Não consegui ler o arquivo: '+err.message,true)}};
  rd.readAsArrayBuffer(file);
}
function impRender(){
  const {e,sheets,si}=IMP,sh=sheets[si];let hr=0;for(let i=0;i<Math.min(10,sh.rows.length);i++){if(sh.rows[i].filter(x=>String(x).trim()).length>=2){hr=i;break}}
  IMP.hr=hr;const hd=(sh.rows[hr]||[]).map(String);const fs=fields(e);
  IMP.map=IMP.map&&IMP.mapSheet===si?IMP.map:hd.map(h=>{const n=norm(h);const f=fs.find(f=>norm(f.l)===n||norm(f.k)===n)||fs.find(f=>n&&(norm(f.l).startsWith(n)||n.startsWith(norm(f.l))||n.includes(norm(f.k))));return f?f.k:''});IMP.mapSheet=si;
  const body=sh.rows.slice(hr+1).filter(r=>r.some(x=>String(x).trim()));IMP.body=body;
  $('#impBody').innerHTML=`${sheets.length>1?`<label class="mu">Aba: <select class="in" id="impSheet">${sheets.map((s,i)=>`<option value="${i}" ${i===si?'selected':''}>${esc(s.n)}</option>`).join('')}</select></label>`:''}
  <div class="tw sm" style="margin-top:8px"><table class="t"><thead><tr><th>Coluna da planilha</th><th>Campo no app</th><th>Exemplo</th></tr></thead><tbody>${hd.map((h,i)=>`<tr><td>${esc(h)}</td><td><select class="in imap" data-i="${i}"><option value="">(ignorar)</option>${fs.map(f=>`<option value="${f.k}" ${IMP.map[i]===f.k?'selected':''}>${esc(f.l)}</option>`).join('')}</select></td><td class="mu">${esc(String((body[0]||[])[i]??'').slice(0,40))}</td></tr>`).join('')}</tbody></table></div>
  <p class="mu">${body.length} linha(s) encontradas.</p><div class="fg"><label>Modo<select class="in" id="impMode"><option value="upsert">Adicionar e atualizar pelo código</option><option value="replace">Substituir a tabela inteira</option></select></label><label>Origem dos dados<select class="in" id="impOrig"><option>Importado</option><option>Real</option><option>Simulado</option></select></label></div>
  <div class="mft"><button class="btn pr" data-a="impSave">Importar ${body.length} registro(s)</button><button class="btn" data-a="close">Cancelar</button></div>`;
}
function convVal(f,v){
  let s=String(v??'').trim();if(!f)return s;
  if(f.t==='n')return s===''?'':N(s.replace(/[^\d,.\-]/g,''));
  if(f.t==='d'){let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];if(/^\d{5}$/.test(s)){const d=new Date(Math.round((+s-25569)*864e5));return d.toISOString().slice(0,10)}return s}
  if(f.t==='h'){const m=s.match(/(\d{1,2}):(\d{2})/);if(m)return m[1].padStart(2,'0')+':'+m[2];if(/^0?\.\d+$/.test(s))return m2h(+s*1440);return s}
  if(f.t==='r'){const list=rows(f.e);const x=list.find(r=>r.id===s)||list.find(r=>norm(r.nome)===norm(s))||list.find(r=>norm(r.nome).includes(norm(s))&&norm(s).length>2);return x?x.id:s}
  return s}
async function impSave(){
  const {e,body,map}=IMP;const fs=fields(e);const mode=$('#impMode').value,orig=$('#impOrig').value;
  const out={};let n=0;
  body.forEach(rw=>{const r={};map.forEach((k,i)=>{if(k)r[k]=convVal(fs.find(f=>f.k===k),rw[i])});if(!r.id)r.id=nextId(e)+'-'+(++n);r.id=String(r.id);r._origem=r._origem||orig;r._atualizado=new Date().toISOString();out[r.id]=r});
  DATA[e]=mode==='replace'?out:{...(DATA[e]||{}),...out};planCache.clear();closeModal();render();
  await writeTable(e);toast(Object.keys(out).length+' registro(s) importado(s)');
}

let IMPALL=null;
function sheetEntity(n){const k=norm(n);return Object.keys(SCHEMA).find(e=>norm(e)===k||norm(SCHEMA[e].l)===k||(k.length>8&&(norm(SCHEMA[e].l).startsWith(k)||k.startsWith(norm(SCHEMA[e].l)))))}
function parseSheet(e,rowsX){const fs=fields(e);let hr=0;for(let i=0;i<Math.min(10,rowsX.length);i++){if(rowsX[i].filter(x=>String(x).trim()).length>=2){hr=i;break}}
  const hd=(rowsX[hr]||[]).map(String);const map=hd.map(h=>{const n=norm(h);const f=fs.find(f=>norm(f.l)===n||norm(f.k)===n);return f?f.k:''});
  const out={};rowsX.slice(hr+1).filter(r=>r.some(x=>String(x).trim())).forEach((rw,i)=>{const r={};map.forEach((k,j)=>{if(k)r[k]=convVal(fs.find(f=>f.k===k),rw[j])});if(!r.id)r.id=nextId(e)+'-'+(i+1);r.id=String(r.id);r._origem=r._origem||'Importado';r._atualizado=new Date().toISOString();out[r.id]=r});
  return {out,map,hd}}
function readAll(file){if(typeof XLSX==='undefined'){toast('Leitor de planilhas não carregou. Recarregue a página.',true);return}
  const rd=new FileReader();rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array'});IMPALL=wb.SheetNames.map(n=>({n,e:sheetEntity(n),rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})}));
    $('#impAllBody').innerHTML=`<table class="t"><thead><tr><th>Aba</th><th>Tabela do app</th><th class="n">Linhas</th><th>Colunas reconhecidas</th></tr></thead><tbody>${IMPALL.map(x=>{if(!x.e)return `<tr><td>${esc(x.n)}</td><td class="mu">ignorada</td><td></td><td></td></tr>`;const p=parseSheet(x.e,x.rows);x.p=p;return `<tr><td>${esc(x.n)}</td><td><b>${esc(SCHEMA[x.e].l)}</b></td><td class="n">${Object.keys(p.out).length}</td><td class="${p.map.filter(Boolean).length<p.hd.filter(Boolean).length?'y':'g'}">${p.map.filter(Boolean).length}/${p.hd.filter(Boolean).length}</td></tr>`}).join('')}</tbody></table>
    <div class="fg" style="margin-top:10px"><label>Modo<select class="in" id="impAllMode"><option value="replace">Substituir as tabelas presentes na planilha</option><option value="upsert">Adicionar e atualizar pelo código</option></select></label></div><div class="mft"><button class="btn pr" data-a="impAllSave">Importar ${IMPALL.filter(x=>x.e).length} tabela(s)</button><button class="btn" data-a="close">Cancelar</button></div>`}catch(err){toast('Não consegui ler o arquivo: '+err.message,true)}};rd.readAsArrayBuffer(file)}
async function impAllSave(){const mode=$('#impAllMode').value;const L=IMPALL.filter(x=>x.e&&x.p);
  L.forEach(x=>{DATA[x.e]=mode==='replace'?x.p.out:{...(DATA[x.e]||{}),...x.p.out}});
  if(dbEmpty)dbEmpty=false;planCache.clear();closeModal();render();toast('Gravando '+L.length+' tabela(s)…');
  for(const x of L)await writeTable(x.e);
  // dicas: ajusta data/hora de referência ao período importado
  const ds=rows('catraca').map(r=>r.data).filter(Boolean).sort();if(ds.length){S.date=ds[ds.length-1];syncHdr()}
  banner();render();toast(L.length+' tabela(s) importada(s)')}

/* ================= eventos ================= */
document.addEventListener('click',ev=>{
  if(ev.target.id==='modal'){closeModal();return}
  const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v,e=el.dataset.e,id=el.dataset.id;
  if(el.tagName==='BUTTON'&&el.type==='submit')return;
  switch(a){
    case 'nav':go(v);break;
    case 'edit':closeModal();openForm(e,id);break;
    case 'new':openForm(e,null,presetFor(e));break;
    case 'newleitura':openForm('leituras',null,{...presetFor('leituras'),preparacao:v});break;
    case 'newacao':openForm('acoes',null,{anomalia:v,status:'Programada',eficaz:'Não avaliada',prazo:addDays(S.date,7)});break;
    case 'askdel':askDel(e,id);break;
    case 'del':planCache.clear();writeRow(e,{id},true);closeModal();toast('Excluído');break;
    case 'close':closeModal();break;
    case 'investigar':closeModal();if(!get('anomalias',v)){go(v)}else openInvestigacao(v);break;
    case 'unitop':S.unitOp=v;S.unit=v;go('operacao');break;
    case 'setunit':S.unit=v;render();break;
    case 'setref':S.ref=v;render();break;
    case 'cad':S.cad=v;S.q='';render();break;
    case 'proc':S.proc=v;S.q='';render();break;
    case 'rel':S.rel=+v;render();break;
    case 'agora':S.modo='real';S.date=todayISO();syncHdr();planCache.clear();render();break;
    case 'gravarBase':gravarBase();break;
    case 'gravarBaseConf':modal(`<h2>Recarregar base inicial?</h2><p>Todas as tabelas serão substituídas pela base inicial (inventário, fluxo e dados simulados). Faça um backup antes, se precisar.</p><div class="mft"><button class="btn dg" data-a="gravarBaseOk">Substituir tudo</button><button class="btn" data-a="close">Cancelar</button></div>`);break;
    case 'gravarBaseOk':closeModal();if(dbState==='ok')gravarBase();else{useSeedLocal();toast('Base inicial carregada (demonstração)')}break;
    case 'limparSim':{Object.keys(DATA).forEach(k=>{const before=rows(k).length;Object.keys(DATA[k]).forEach(id=>{if(isSim(DATA[k][id]))delete DATA[k][id]});if(rows(k).length!==before)writeTable(k)});planCache.clear();render();toast('Registros simulados removidos');break}
    case 'saveParams':{document.querySelectorAll('[data-p]').forEach(i=>CFG.params[i.dataset.p]=N(i.value));planCache.clear();writeCfg();toast('Parâmetros salvos');break}
    case 'addField':{const te=$('#cfE').value,l=$('#cfL').value.trim(),t=$('#cfT').value,o=$('#cfO').value.split(';').map(x=>x.trim()).filter(Boolean);if(!l){toast('Dê um nome ao campo',true);break}
      const k='c_'+norm(l).slice(0,24);CFG.campos[te]=CFG.campos[te]||[];if(CFG.campos[te].some(f=>f.k===k)||SCHEMA[te].f.some(f=>f.k===k)){toast('Campo já existe',true);break}CFG.campos[te].push(t==='s'?{k,l,t,o}:{k,l,t});writeCfg();toast('Campo adicionado');break}
    case 'delField':CFG.campos[e]=(CFG.campos[e]||[]).filter(f=>f.k!==v);writeCfg();break;
    case 'import':openImport(v);break;
    case 'importAll':modal(`<h2>⬆ Importar planilha completa<span class="sp" style="flex:1"></span><button class="btn sm" data-a="close">✕</button></h2><p class="mu">Cada aba cujo nome é o nome de uma tabela do app (ex.: “Unidades”, “Entradas na catraca”) é importada para essa tabela. Abas com outros nomes (guia, cálculos) são ignoradas.</p><input type="file" id="impAllFile" accept=".xlsx,.xls" class="in"><div id="impAllBody" style="margin-top:12px"></div>`);break;
    case 'impAllSave':impAllSave();break;
    case 'impSave':impSave();break;
    case 'copy':{let txt=v;if(v.startsWith('__csv__')){const t=v.slice(7),fs=fields(t);txt=[fs.map(f=>f.l).join(';'),...rows(t).map(r=>fs.map(f=>String(r[f.k]??'').replace(/[;\n]/g,' ')).join(';'))].join('\n')}copy(txt);break}
    case 'exportJSON':copy(JSON.stringify({versao:1,data:DATA,config:CFG}));break;
    case 'importJSON':modal(`<h2>Restaurar backup</h2><p class="mu">Cole o JSON copiado em “Copiar backup”. Todas as tabelas do backup serão substituídas.</p><textarea class="in" id="bk" rows="10" style="width:100%"></textarea><div class="mft"><button class="btn pr" data-a="restore">Restaurar</button><button class="btn" data-a="close">Cancelar</button></div>`);break;
    case 'restore':{try{const x=JSON.parse($('#bk').value);if(!x.data)throw new Error('JSON sem "data"');DATA=x.data;if(x.config)CFG={params:{...DEF_PARAMS,...x.config.params},campos:x.config.campos||{}};closeModal();planCache.clear();render();(async()=>{for(const k of Object.keys(DATA))await writeTable(k);await writeCfg();toast('Backup restaurado')})()}catch(err){toast('Backup inválido: '+err.message,true)}break}
  }
});
function presetFor(e){const r=S.ref||refAtual(),u=S.unit||S.unitOp||'';const p={};if(['previsoes','catraca','leituras','reposicoes','anomalias'].includes(e)){p.unidade=u;p.refeicao=r}
