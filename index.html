<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre de Controle Operacional — Alimentação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--p:#ffffff;--p2:#f7f9fc;--ln:#e4eaf2;--ln2:#d3dde9;--tx:#0f1e33;--mu:#5c6b80;--mu2:#97a6b8;
--pr:#1d4ed8;--pr2:#2563eb;--prl:#eaf1ff;--nav:#0b2d63;
--g:#16a34a;--y:#d97706;--r:#dc2626;--b:#2563eb;--c:#0891b2;--pu:#7c3aed;--o:#ea580c;--rad:14px;--sh:0 1px 2px rgba(15,30,51,.05),0 4px 14px rgba(15,30,51,.05)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13.5px}
a{color:var(--pr)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#0a2a5e,#123f8f 60%,#1d4ed8);color:#fff;box-shadow:0 2px 12px rgba(10,42,94,.25)}
.hdr{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)}
.ttl{font-weight:800;font-size:18px;letter-spacing:-.2px;white-space:nowrap}
.ttl small{font-weight:500;opacity:.75;font-size:13px;margin-left:6px}
.sp{flex:1}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.top .pill input{color:#fff;color-scheme:dark}
.top .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.top .btn.on{background:#fff;color:var(--pr)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--ln2);background:var(--p);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.dot.y{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.2)}.dot.r{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.2)}.dot.gray{background:#94a3b8;box-shadow:none}
input.in,select.in,textarea.in{background:#fff;border:1px solid var(--ln2);border-radius:9px;padding:7px 10px;outline:none;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--pr2);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
nav.tabs{display:flex;gap:2px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:none;border-bottom:3px solid transparent;color:rgba(255,255,255,.82);padding:9px 14px 10px;cursor:pointer;white-space:nowrap;font-weight:600}
nav.tabs button:hover{color:#fff}
nav.tabs button.on{color:#fff;border-bottom-color:#fff}
nav.sub{display:flex;gap:6px;padding:10px 18px 0;overflow-x:auto;background:var(--bg)}
nav.sub button{background:#fff;border:1px solid var(--ln2);color:var(--mu);padding:6px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:12.5px}
nav.sub button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.banner{margin:12px 18px 0;padding:10px 14px;border-radius:12px;border:1px solid #f5d38a;background:#fff8e6;color:#7a4b00;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{border-color:#c9dbff;background:#f0f5ff;color:#1e3a8a}
.banner.err{border-color:#fecaca;background:#fef2f2;color:#991b1b}
main{padding:16px 18px 50px;max-width:1640px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-weight:800;color:var(--nav)}
.ph p{margin:3px 0 0;color:var(--mu)}
.grid{display:grid;gap:10px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));margin-bottom:14px}
.kpi{background:var(--p);border:1px solid var(--ln);border-radius:var(--rad);padding:13px 14px;display:flex;gap:11px;align-items:center;min-width:0;box-shadow:var(--sh)}
.kpi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px}
.kpi .v{font-size:22px;font-weight:800;line-height:1.15;white-space:nowrap;color:var(--tx)}
.kpi .l{color:var(--mu);font-size:12px;font-weight:600}
.kpi .s{color:var(--mu);font-size:11.5px;margin-top:2px}
.kpi.big{padding:18px}.kpi.big .v{font-size:30px}.kpi.big .ic{width:48px;height:48px;font-size:22px}
.ic.g{background:#e7f6ec}.ic.b{background:#eaf1ff}.ic.y{background:#fff3df}.ic.r{background:#fdecec}.ic.c{background:#e3f6fa}.ic.pu{background:#f1eaff}.ic.o{background:#ffefe4}
.row{display:grid;gap:14px;margin-bottom:14px}
.c2{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.c4{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
@media(max-width:900px){.c2,.c3,.opg{grid-template-columns:1fr!important}}
@media(max-width:600px){.ttl{white-space:normal;font-size:15px}.ttl small{display:none}main{padding:12px 10px 30px}.kpi .v{font-size:19px}.hdr{padding:8px 10px}}
.card{background:var(--p);border:1px solid var(--ln);border-radius:var(--rad);padding:14px 16px;min-width:0;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--nav)}
.card h3 .sp{flex:1}
.card h3 .act{font-weight:500;font-size:12px}
.card.alert{border-color:#f3d2d2;background:linear-gradient(180deg,#fff,#fffafa)}
.card.hl{border-color:#bcd2ff;background:linear-gradient(180deg,#f7faff,#fff)}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sec h2{margin:0;font-size:16px;color:var(--nav)}
.sec .lv{background:var(--pr);color:#fff;border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:700}
.sec .ln{flex:1;height:1px;background:var(--ln2)}
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
table.t th{color:var(--mu);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap;font-size:11.5px;background:var(--p2);position:sticky;top:0}
table.t td{padding:8px;border-bottom:1px solid #eef2f7;vertical-align:middle}
table.t tr.cl{cursor:pointer}
table.t tr.cl:hover td{background:#f3f7ff}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-height:540px;border-radius:10px}
.tw.sm{max-height:310px}
.b{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b.ok{background:#e7f6ec;color:#166534}
.b.at{background:#fff3df;color:#9a5b00}
.b.cr{background:#fdecec;color:#b91c1c}
.b.in{background:#eaf1ff;color:#1d4ed8}
.b.ne{background:#eef2f7;color:#5c6b80}
.b.pu{background:#f1eaff;color:#6d28d9}
.tag{font-size:10px;padding:1px 7px;border-radius:5px;background:#eef2f7;color:#5c6b80;margin-left:4px;font-weight:700;vertical-align:middle}
.tag.sim{background:#fff1e3;color:#b45309}
.btn{background:#fff;border:1px solid var(--ln2);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap;color:var(--tx)}
.btn:hover{border-color:var(--pr2);color:var(--pr)}
.btn.pr{background:var(--pr);border-color:var(--pr);color:#fff}
.btn.pr:hover{background:#1e40af;color:#fff}
.btn.dg{background:#fff;border-color:#fecaca;color:#b91c1c}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn.y{background:#fff8e6;border-color:#f5d38a;color:#8a5300}
.btn.r{background:#fdecec;border-color:#fecaca;color:#b91c1c}
.btn.bl{background:#eaf1ff;border-color:#c9dbff;color:#1d4ed8}
.btn.ok{background:#e7f6ec;border-color:#bfe5cb;color:#166534}
.mu{color:var(--mu)}.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}.bl{color:var(--pr2)}
.flow{display:flex;gap:6px;overflow-x:auto;padding:2px}
.fs{flex:1;min-width:120px;padding:10px 12px;border-radius:12px;background:#f2fbf5;border:1px solid #cdeedb;cursor:pointer;position:relative}
.fs:not(:last-child):after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--mu2);font-size:18px;z-index:1}
.fs.at{background:#fff8e6;border-color:#f5d38a}.fs.cr{background:#fef2f2;border-color:#fecaca}.fs.ne{background:#f5f7fa;border-color:var(--ln)}
.fs b{display:block;font-size:12.5px}
.fs span{font-size:11.5px;color:#166534}
.fs.at span{color:#9a5b00}.fs.cr span{color:#b91c1c}.fs.ne span{color:var(--mu)}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:#fff;border:1px solid var(--ln);border-left:4px solid var(--b);margin-bottom:8px}
.al .ai{font-size:15px;line-height:1.2}
.al .at{flex:1;min-width:0}
.al .at b{display:block;font-size:12.8px;font-weight:600}
.al .at span{font-size:11.5px;color:var(--mu)}
.al.cr{border-left-color:var(--r)}.al.at2{border-left-color:#f59e0b}.al.in2{border-left-color:var(--b)}.al.ok2{border-left-color:var(--g)}
.units{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.uc{border:1px solid var(--ln);border-radius:12px;padding:11px 12px;background:#fff;cursor:pointer;border-top:4px solid #22c55e}
.uc:hover{box-shadow:var(--sh)}
.uc.cr{border-top-color:#ef4444;background:#fffafa}.uc.at{border-top-color:#f59e0b}.uc.ne{border-top-color:#cbd5e1}
.uc h4{margin:0 0 5px;font-size:13.5px}
.bar{height:7px;background:#edf1f7;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#22c55e;border-radius:5px}
.bar.y i{background:#f59e0b}.bar.r i{background:#ef4444}.bar.b i{background:var(--pr2)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:#64748b;font-size:10px;font-family:Inter,sans-serif}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);margin:-4px 0 6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.modal{position:fixed;inset:0;background:rgba(15,30,51,.45);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;backdrop-filter:blur(2px)}
.modal.on{display:flex}
.mbox{background:#fff;border:1px solid var(--ln);border-radius:16px;width:min(900px,100%);padding:18px 20px;box-shadow:0 24px 60px rgba(15,30,51,.25)}
.mbox h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px;color:var(--nav)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px 13px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--mu);font-weight:600}
.fg label.full{grid-column:1/-1}
.fg .in{width:100%}
.mft{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.side{display:grid;grid-template-columns:240px 1fr;gap:14px}
@media(max-width:820px){.side{grid-template-columns:1fr}}
.elist button{display:flex;width:100%;justify-content:space-between;background:none;border:1px solid transparent;border-radius:9px;padding:7px 9px;cursor:pointer;text-align:left}
.elist button:hover{background:var(--p2)}
.elist button.on{background:var(--prl);border-color:#c9dbff;color:var(--pr);font-weight:600}
.elist .gh{color:var(--mu2);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;margin:10px 0 4px 6px;font-weight:700}
.macro{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.mc{min-width:220px;max-width:240px;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:9px}
.mc h4{margin:0 0 8px;font-size:12.5px;display:flex;justify-content:space-between;gap:6px;color:var(--nav)}
.sc{border:1px solid var(--ln);border-left:4px solid #22c55e;border-radius:9px;padding:7px 8px;margin-bottom:6px;background:#fff;cursor:pointer;font-size:12px}
.sc.nao{border-left-color:#ef4444}.sc.na{border-left-color:#cbd5e1}.sc.ver{border-left-color:#f59e0b}
.sc small{display:block;color:var(--mu);font-size:10.5px;margin-top:3px}
.why{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center}
.why .q{background:var(--prl);color:var(--pr);border-radius:7px;padding:4px 9px;font-weight:700;font-size:11px;white-space:nowrap}
.ev{display:flex;gap:10px;padding:9px 11px;border-radius:10px;border:1px solid var(--ln);border-left:4px solid #22c55e;margin-bottom:6px;background:#fff}
.ev.forte{border-left-color:#ef4444;background:#fffafa}.ev.fraco{border-left-color:#f59e0b}
.ev b{font-size:12px}.ev div{font-size:12.3px}
.heat td{text-align:center;font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f1e33;color:#fff;padding:10px 18px;border-radius:12px;z-index:80;display:none;font-weight:600;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.on{display:block}.toast.err{background:#b91c1c}
.empty{padding:20px;text-align:center;color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--ln2);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--mu)}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
.cub{display:inline-flex;gap:2px;vertical-align:middle}
.cub i{width:7px;height:11px;border-radius:2px;background:#93b4f5;display:block}
.timeline{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 0}
.tl{flex:1;min-width:100px;text-align:center;position:relative;font-size:11.5px}
.tl:before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--ln2);z-index:0}
.tl:first-child:before{display:none}
.tl.done:before{background:#22c55e}
.tl .o{width:22px;height:22px;border-radius:50%;margin:0 auto 5px;border:3px solid var(--ln2);background:#fff;position:relative;z-index:1}
.tl.done .o{border-color:#22c55e;background:#e7f6ec}.tl.now .o{border-color:#f59e0b;background:#fff3df;box-shadow:0 0 0 4px rgba(245,158,11,.2)}
.hint{font-size:11.8px;color:var(--mu);margin-top:8px;line-height:1.5}
.sub{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.calc{font-family:ui-monospace,Menlo,monospace;font-size:11.8px;background:#f7f9fc;border:1px solid var(--ln);border-radius:10px;padding:9px 11px;color:#334155;line-height:1.65}
.big{font-size:28px;font-weight:800;color:var(--nav)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:11px;margin-bottom:7px;background:#fff}
.chk.feito{border-left:4px solid #22c55e}.chk.pend{border-left:4px solid #93b4f5}.chk.atr{border-left:4px solid #ef4444;background:#fffafa}
.chk .tx{flex:1;min-width:0}.chk .tx b{display:block;font-size:12.8px}.chk .tx span{font-size:11.5px;color:var(--mu)}
.gi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid var(--ln);border-radius:11px;margin-bottom:7px;background:#fff}
.gi.on{border-left:4px solid #ef4444;background:#fffafa}.gi.off{border-left:4px solid #22c55e}
.drag{cursor:move}
.ca{position:relative}
.ca .tools{position:absolute;top:10px;right:12px;display:flex;gap:4px;opacity:.55}
.ca:hover .tools{opacity:1}
.grid-ed td{padding:3px 4px}.grid-ed select{min-width:140px}.grid-ed input,.grid-ed select{width:100%;min-width:70px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px}
.grid-ed input:hover,.grid-ed select:hover{border-color:var(--ln2);background:#fff}
.grid-ed input:focus{border-color:var(--pr2);background:#fff;outline:none}
.simbar{display:flex;align-items:center;gap:8px}
details.hint{margin-top:8px}details.hint summary{cursor:pointer;color:var(--pr2);font-size:11.5px;list-style:none;display:inline-flex;align-items:center;gap:4px;user-select:none}
details.hint summary::-webkit-details-marker{display:none}details.hint[open] summary{margin-bottom:4px}
.kpi .spk{margin-top:4px;display:block}
.alertpill{display:none;cursor:pointer;background:#ef4444!important;border-color:#fecaca!important;color:#fff!important;font-weight:700;animation:pulse 1.4s infinite}
.alertpill.on{display:inline-flex}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{box-shadow:0 0 0 10px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.gbtn{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.legx{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);margin-top:6px}.legx i{display:inline-block;width:12px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
</style>
</head>
<body>
<div class="top">
  <div class="hdr">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.9A4 4 0 0 1 7.5 6.3a5 5 0 0 1 9 0A4 4 0 0 1 18 13.9V20H6z"/><path d="M6 17h12"/></svg></div>
    <div class="ttl">Torre de Controle Operacional — Alimentação <small>(SLS | EFC)</small></div>
    <div class="sp"></div>
    <div class="ctl">
      <span class="pill">📅 <input id="hDate" type="date" class="in" style="border:none;background:none;padding:0;width:122px"></span>
      <span class="pill">🕒 <input id="hTime" type="time" class="in" style="border:none;background:none;padding:0;width:78px"><button class="btn sm" data-a="agora" title="Usar a hora atual">Agora</button></span>
      <span class="pill" id="dbPill"><span class="dot gray"></span> Conectando…</span>
      <span class="pill" id="livePill"><span class="dot"></span><span id="liveTxt">Operação</span></span><span class="pill alertpill" id="alertPill" data-a="alertgo"></span><span class="simbar"><button class="btn sm" data-a="play" id="playBtn" title="Simular o serviço em tempo real">▶ Simular</button></span>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<nav class="sub" id="subtabs"></nav>
<div id="banners"></div>
<main id="view"></main>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

function enqueue(path,fn){const p=(qchain[path]||Promise.resolve()).then(fn,fn);qchain[path]=p.catch(()=>{});return p}
async function persist(e){
  if(dbState!=='ok')return;
  const rowsE=DATA[e]||{};
  return enqueue('t:'+e,async()=>{try{
    if(backend==='artifact'){await db.doc('tabelas/'+e).set({rows:rowsE,atualizado:Date.now()});existing.add(e)}
    else if(backend==='supabase'){const {error}=await sb.from('torre_tabelas').upsert({nome:e,rows:rowsE,atualizado:new Date().toISOString()});if(error)throw error}
    else if(backend==='local'){await IDB.set('t:'+e,rowsE);await IDB.set('tabelas',Object.keys(DATA))}
  }catch(err){handleErr(err)}});
}
async function writeRow(e,row,isDel){
  row._atualizado=new Date().toISOString();
  if(!isDel){DATA[e]=DATA[e]||{};DATA[e][row.id]=row}else{delete (DATA[e]||{})[row.id]}
  render();
  if(dbState!=='ok'){toast(dbEmpty?'Grave a base inicial para salvar as alterações':'Modo demonstração: alteração não será salva',true);return}
  if(dbEmpty){dbEmpty=false;banner();for(const k of Object.keys(DATA))await persist(k);await writeCfg();return}
  if(backend==='artifact'&&!isDel&&existing.has(e)){return enqueue('t:'+e,async()=>{try{await db.doc('tabelas/'+e).update({rows:{[row.id]:row},atualizado:Date.now()})}catch(err){handleErr(err)}})}
  return persist(e);
}

function handleErr(err){

  else if(c==='quota_exceeded'||(err&&err.name==='QuotaExceededError'))toast('Limite de armazenamento atingido: '+(err.message||''),true);
  else toast('Falha ao salvar: '+(err&&err.message||c||'erro'),true);
}

async function initDB(){
  dbState='wait';setPill();
  const C=window.TORRE_CONFIG||{};
  // 1) banco do artefato (quando aberto no claude.ai)
  let api=null;
  if(window.claude&&typeof window.claude.use==='function'){try{api=await window.claude.use('db')}catch(e){api=null}}
  if(api){backend='artifact';db=api;
    const timer=setTimeout(()=>{if(!loaded.tabelas){dbState='off';setPill();banner()}},10000);
    db.collection('tabelas').onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer);dbState='ok';loaded.tabelas=true}
      if(snap.empty){if(!snap.metadata.fromCache){dbEmpty=true;if(!Object.keys(DATA).length)useSeedLocal()}}
      else{dbEmpty=false;existing=new Set();const nd={};snap.docs.forEach(d=>{const x=d.data()||{};nd[d.id]=JSON.parse(JSON.stringify(x.rows||{}));existing.add(d.id)});DATA=nd}
      setPill();banner();render();
    },()=>{clearTimeout(timer);dbState='off';setPill();banner();if(!Object.keys(DATA).length)useSeedLocal()});
    db.doc('config/geral').onSnapshot(s=>{if(s.exists){const x=JSON.parse(JSON.stringify(s.data()));CFG={params:{...DEF_PARAMS,...(x.params||{})},campos:x.campos||{},analises:x.analises||[],calc:x.calc||[]}}loaded.config=true;render()},()=>{});
    return}
  // 2) Supabase (GitHub Pages com config.js preenchido)
  if(C.supabaseUrl&&C.supabaseAnonKey&&window.supabase&&window.supabase.createClient){
    backend='supabase';
    try{sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey);
      const [t,c]=await Promise.all([sb.from('torre_tabelas').select('nome,rows'),sb.from('torre_config').select('dados').eq('id','geral').maybeSingle()]);
      if(t.error)throw t.error;
      const nd={};(t.data||[]).forEach(r=>{nd[r.nome]=r.rows||{}});
      applyLoaded(nd,c&&c.data?c.data.dados:null);
      try{sb.channel('torre').on('postgres_changes',{event:'*',schema:'public',table:'torre_tabelas'},p=>{const r=p.new;if(r&&r.nome){DATA[r.nome]=r.rows||{};dbEmpty=false;planCache.clear();if(!$('#modal').classList.contains('on'))render()}}).subscribe()}catch(e){}
    }catch(err){dbState='off';setPill();banner();toast('Supabase: '+(err.message||err),true);if(!Object.keys(DATA).length)useSeedLocal()}
    return}
  // 3) navegador (IndexedDB; migra do localStorage antigo se houver)
  try{await IDB.open();backend='local';
    let ks=await IDB.get('tabelas');const nd={};
    if(!ks){const old=JSON.parse(localStorage.getItem(LSK+'tabelas')||'null');if(old){for(const k of old){const v=localStorage.getItem(LSK+'t:'+k);if(v){nd[k]=JSON.parse(v);await IDB.set('t:'+k,nd[k])}}await IDB.set('tabelas',old);const c=localStorage.getItem(LSK+'config');if(c)await IDB.set('config',JSON.parse(c));ks=old}}
    for(const k of (ks||[])){if(!nd[k]){const v=await IDB.get('t:'+k);if(v)nd[k]=v}}
    applyLoaded(nd,await IDB.get('config'));
  }catch(e){backend='demo';dbState='local';setPill();useSeedLocal()}
}

  else if(dbState==='off')h=`<div class="banner err">⚠️ <span>Não foi possível alcançar o banco agora. Confira a conexão${backend==='supabase'?' e o config.js':''}.</span></div>`;

  $('#banners').innerHTML=h;
}

/* ================= motores de cálculo ================= */
const INT=()=>P('intervalo_min')||15;
function nowMin(){if(S.modo==='real'){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}return h2m(S.hora)??735}
function curva(r){return rows('curvas').filter(c=>c.refeicao===r).sort((a,b)=>h2m(a.inicio)-h2m(b.inicio))}
function janela(r){const c=curva(r);if(!c.length)return null;return [h2m(c[0].inicio),h2m(c[c.length-1].inicio)+INT()]}
function refAtual(){const n=nowMin();let best=null,bd=1e9;REF.forEach(r=>{const j=janela(r);if(!j)return;if(n>=j[0]&&n<j[1]){best=r;bd=-1}else if(bd>=0){const d=n<j[0]?j[0]-n:n-j[1]+600;if(d<bd){bd=d;best=r}}});return best||'Almoço'}
function catVis(){const n=nowMin();return rows('catraca').filter(x=>x.data<S.date||(x.data===S.date&&h2m(x.inicio)+INT()<=n))}
function prevPessoas(d,u,r){return sum(rows('previsoes').filter(x=>x.data===d&&x.unidade===u&&x.refeicao===r),x=>N(x.pessoas))}
function prepsAtivas(){return rows('preparacoes').filter(p=>p.ativo!=='Não').sort(by('id'))}
function gram(p){if(p.gramatura_g!==''&&p.gramatura_g!=null&&N(p.gramatura_g)>0)return N(p.gramatura_g);return N(p.cru_g)*(N(p.rend_coccao)||100)/100}
function kgCuba(p){if(p.kg_cuba!==''&&p.kg_cuba!=null&&N(p.kg_cuba)>0)return N(p.kg_cuba);const t=get('cubas_tipos',p.tipo_cuba);const v=t?N(t.volume_l):14;return Math.max(0.1,v*(N(p.densidade)||0.7)*(N(p.enchimento)||85)/100)}
function kPorPessoa(p){return N(p.aceitacao)/100*gram(p)/1000*(N(p.fator_rep)||1)}
const planCache=new Map();
function plan(d,u,r){
  const key=d+'|'+u+'|'+r+'|'+Math.floor(nowMin());if(planCache.has(key))return planCache.get(key);
  const Pp=prevPessoas(d,u,r),cv=curva(r),now=d===S.date?nowMin():(d<S.date?1e9:-1e9);
  const cat=rows('catraca').filter(x=>x.data===d&&x.unidade===u&&x.refeicao===r);
  const iv=cv.map(c=>{const t=h2m(c.inicio);const m=(t+INT()<=now)?cat.filter(x=>h2m(x.inicio)===t):[];return {t,prev:Pp*N(c.pct)/100,real:m.length?sum(m,x=>N(x.entradas)):null,band:m.length?sum(m,x=>N(x.bandejas)):null}});
  const done=iv.filter(i=>i.real!=null),sp=sum(done,i=>i.prev),sr=sum(done,i=>i.real);
  const fator=sp>0?sr/sp:1;
  iv.forEach(i=>i.proj=i.real!=null?i.real:i.prev*fator);
  const tr=P('tempo_reposicao_min'),mg=P('margem_pct')/100;
  const preps=prepsAtivas().map(p=>{const k=kPorPessoa(p),kc=kgCuba(p);
    const per=iv.map(i=>{const kg=i.proj*k,kgmin=kg/INT(),cubas=kg>0?Math.ceil(kg*(1+mg)/kc):0,dur=kgmin>0?kc/kgmin:Infinity;return {t:i.t,kg,kgmin,cubas,dur,aui:dur-tr}});
    const pico=per.reduce((a,b)=>b.kgmin>a.kgmin?b:a,per[0]||{kgmin:0,dur:Infinity,aui:Infinity,t:null});
    const proj=sum(iv,i=>i.proj);
    return {p,k,kc,per,pico,kg:sum(per,x=>x.kg),kgPrev:Pp*k,cubas:sum(per,x=>x.cubas),porcoes:proj*N(p.aceitacao)/100*(N(p.fator_rep)||1),porcoesPrev:Pp*N(p.aceitacao)/100*(N(p.fator_rep)||1)}});
  const out={d,u,r,P:Pp,iv,fator,real:sr,prevAte:sp,proj:sum(iv,i=>i.proj),preps,now,temReal:done.length>0};
  planCache.set(key,out);return out;
}
function linha(d,u,r){
  const pl=plan(d,u,r),now=nowMin(),j=janela(r);
  const emServ=j&&now>=j[0]&&now<j[1];
  const cur=pl.iv.find(i=>now>=i.t&&now<i.t+INT());
  const lt=rows('leituras').filter(x=>x.data===d&&x.unidade===u&&x.refeicao===r&&h2m(x.hora)<=now);
  const rp=rows('reposicoes').filter(x=>x.data===d&&x.unidade===u&&x.refeicao===r);
  return pl.preps.map(pp=>{
    const l=lt.filter(x=>x.preparacao===pp.p.id).sort((a,b)=>h2m(b.hora)-h2m(a.hora))[0];
    const per=cur?pp.per.find(x=>x.t===cur.t):null;
    const kgmin=per?per.kgmin:0;
    const pend=rp.filter(x=>x.preparacao===pp.p.id&&h2m(x.solicitacao)<=now&&(!x.chegada||h2m(x.chegada)>now)&&x.status!=='Cancelada');
    const repos=rp.filter(x=>x.preparacao===pp.p.id&&x.chegada&&h2m(x.chegada)<=now);
    let saldo=null,cob=null,esg=null,st='Sem leitura',cls='ne';
    if(l){const add=sum(repos.filter(x=>h2m(x.chegada)>h2m(l.hora)),x=>N(x.qtd_kg));saldo=Math.max(0,N(l.saldo_kg)+add-kgmin*Math.max(0,now-h2m(l.hora)));
      if(!emServ){st='Fora do serviço';cls='ne'}
      else if(kgmin<=0){st='OK';cls='ok';cob=Infinity}
      else{cob=saldo/kgmin;esg=now+cob;
        if(saldo<=0.05){st='Ruptura';cls='cr'}
        else if(cob<P('tempo_reposicao_min')){st=pend.length?'Risco — reposição a caminho':'Risco de ruptura';cls='cr'}
        else if(cob<P('cobertura_alvo_min')){st='Atenção';cls='at'}
        else{st='OK';cls='ok'}}}
    return {...pp,l,saldo,cob,esg,st,cls,kgmin,pend,porcMin:kgmin/(gram(pp.p)/1000||1),buffer:l?N(l.buffer_kg):0};
  });
}
function statusUnidade(d,u,r){const L=linha(d,u,r);if(L.some(x=>x.cls==='cr'))return 'cr';if(L.some(x=>x.cls==='at'))return 'at';return L.some(x=>x.l)?'ok':'ne'}
function saldoInsumo(id){return sum(rows('lotes').filter(l=>l.insumo===id&&l.status!=='Bloqueado'),l=>N(l.qtd))}
function estoque(){
  return rows('insumos').sort(by('id')).map(i=>{const s=saldoInsumo(i.id),c=N(i.consumo_dia),cob=c>0?s/c:Infinity,seg=N(i.seg_dias)||3;
    const futuros=rows('pedidos').filter(p=>p.insumo===i.id&&!['Recebido','Cancelado'].includes(p.status));
    const proj=[];let sal=s;for(let k=0;k<=14;k++){const dd=addDays(S.date,k);if(k>0)sal-=c;sal+=sum(futuros.filter(p=>p.data_prevista===dd),p=>N(p.qtd));proj.push(Math.max(0,c>0?sal/c:0))}
    const st=cob<seg/2?'cr':cob<seg?'at':'ok';
    return {i,s,c,cob,seg,st,futuros,proj,emPedido:sum(futuros,p=>N(p.qtd))}});
}
function pedidoAtrasado(p){return !['Recebido','Cancelado'].includes(p.status)&&p.data_prevista&&p.data_prevista<S.date}
function otifPedido(p){return p.status==='Recebido'&&p.data_entrega&&p.data_entrega<=p.data_prevista&&N(p.qtd_recebida)>=0.95*N(p.qtd)&&p.conforme!=='Não'}
function degeloStatus(x){if(x.status==='Liberado'||x.status==='Bloqueado')return x.status;const l=dtMin(x.liberacao),n=nowMin();if(l!=null&&l<n)return 'Atrasado';const i=dtMin(x.inicio);if(x.status==='Programado'&&i!=null&&i<=n)return 'Em andamento';return x.status}
function ordemStatus(o){if(o.status==='Concluída'||o.status==='Cancelada')return o.status;if(o.data===S.date&&o.fim_prev&&h2m(o.fim_prev)<nowMin())return 'Atrasada';if(o.data<S.date)return 'Atrasada';if(o.status==='Programada'&&o.data===S.date&&h2m(o.inicio)<=nowMin())return 'Deveria ter iniciado';return o.status}
function expStatus(x){if(x.chegada_real){const a=h2m(x.chegada_real)-h2m(x.chegada_prev);return a>10?'Entregue com atraso':'Entregue'}if(x.data===S.date&&x.chegada_prev&&h2m(x.chegada_prev)<nowMin())return 'Atrasada';if(x.data<S.date)return 'Sem registro de chegada';return x.status||'Programada'}
function demandaPrep(d,pid,r){return sum(unidadesServico(),u=>{const pl=plan(d,u.id,r);const pp=pl.preps.find(x=>x.p.id===pid);return pp?pp.porcoes:0})}
function demandaPrepPrev(d,pid,r){return sum(unidadesServico(),u=>{const pl=plan(d,u.id,r);const pp=pl.preps.find(x=>x.p.id===pid);return pp?pp.porcoesPrev:0})}
const B=(cls,t)=>`<span class="b ${cls}">${esc(t)}</span>`;
const stCls=s=>({'OK':'ok','Concluída':'ok','Liberado':'ok','Entregue':'ok','Recebido':'ok','Tratada':'ok','Encerrada':'ok','Sim':'ok','Disponível':'ok','Em andamento':'at','Em produção':'at','Em trânsito':'at','Em conferência':'at','Em investigação':'at','Em tratamento':'at','Pendente':'at','Atenção':'at','Em separação':'at','Programado':'in','Programada':'in','Aberta':'cr','Atrasado':'cr','Atrasada':'cr','Bloqueado':'cr','Falha':'cr','Não':'cr','Ruptura':'cr','Entregue com atraso':'at','Deveria ter iniciado':'cr','Em manutenção':'at','Sem registro de chegada':'at','NA':'ne','A verificar':'at','Alta':'cr','Média':'at','Baixa':'ok','Cancelada':'ne','Cancelado':'ne','Feito':'ok','Não feito':'cr','Não conforme':'cr','Disparado':'cr','Normal':'ok','Garantido':'ok','Parcial':'at','Necessita pedido':'cr','Uso imediato':'cr','Utilizar prioritário':'at','Programar uso':'in','Déficit':'cr','Folga curta':'at'}[s]||'ne');
const SB=s=>B(stCls(s),s||'—');

/* ---------- antecipação (próximos N minutos) ---------- */
function prox(d,u,r,H){H=H||P('horizonte_min');const pl=plan(d,u,r),now=nowMin(),L=linha(d,u,r);
  const pes=sum(pl.iv,i=>{const a=Math.max(i.t,now),b=Math.min(i.t+INT(),now+H);return b>a?i.proj*(b-a)/INT():0});
  const mg=P('margem_pct')/100;
  const preps=L.map(x=>{const kg=pes*x.k;const need=kg*(1+mg);const cub=kg>0?Math.ceil(need/x.kc):0;const linhaKg=x.saldo==null?0:x.saldo;const pend=sum(x.pend,q=>N(q.qtd_kg));const disp=linhaKg+x.buffer+pend;const folga=disp-need;
    return {...x,pes,kgNec:kg,need,cubNec:cub,linhaKg,disp,folga,cubLinha:x.kc?linhaKg/x.kc:0,stp:x.l?(folga<0?'Déficit':folga<need*0.2?'Folga curta':'OK'):'Sem leitura'}});
  const need=sum(preps,x=>x.need),disp=sum(preps,x=>x.disp);
  return {u,r,H,pes,preps,need,kg:sum(preps,x=>x.kgNec),cub:sum(preps,x=>x.cubNec),disp,linhaKg:sum(preps,x=>x.linhaKg),buffer:sum(preps,x=>x.buffer),cubLinha:sum(preps,x=>x.cubLinha),deficit:sum(preps.filter(x=>x.folga<0),x=>-x.folga),nDef:preps.filter(x=>x.stp==='Déficit').length,st:preps.some(x=>x.stp==='Déficit')?'cr':preps.some(x=>x.stp==='Folga curta')?'at':preps.some(x=>x.l)?'ok':'ne'};
}
/* ---------- conferência do dia: demanda × produção × disponibilidade ---------- */
function conferencia(d,r){const us=unidadesServico();const ops=rows('ordens').filter(o=>o.data===d&&(o.refeicao||r)===r);
  return prepsAtivas().map(p=>{const dem=sum(us,u=>{const pp=plan(d,u.id,r).preps.find(x=>x.p.id===p.id);return pp?pp.kg:0});const demPrev=sum(us,u=>{const pp=plan(d,u.id,r).preps.find(x=>x.p.id===p.id);return pp?pp.kgPrev:0});
    const o=ops.filter(x=>x.preparacao===p.id);const plan_=sum(o,x=>N(x.planejado))*gram(p)/1000;const prod=sum(o,x=>N(x.produzido))*gram(p)/1000;
    const consumido=sum(us,u=>{const pp=plan(d,u.id,r).preps.find(x=>x.p.id===p.id);if(!pp)return 0;const pl=plan(d,u.id,r);return sum(pl.iv.filter(i=>i.real!=null),i=>i.real)*pp.k});
    const linhaKg=sum(us,u=>{const x=linha(d,u.id,r).find(y=>y.p.id===p.id);return x&&x.saldo!=null?x.saldo+x.buffer:0});
    const cob=dem?Math.max(prod,plan_)/dem:1;
    return {p,dem,demPrev,plan:plan_,prod,consumido,linhaKg,restante:Math.max(0,dem-consumido),cob,st:cob<0.97?'cr':cob<1.03?'at':'ok'}})}
/* ---------- dimensionamento cru → cuba ---------- */
function dimensionar(p,pessoas){const g=gram(p),kc=kgCuba(p),porc=pessoas*N(p.aceitacao)/100*(N(p.fator_rep)||1),kgP=porc*g/1000,kgC=porc*N(p.cru_g)/1000;
  return {p,g,kc,porcCuba:g?kc*1000/g:0,porc,kgP,kgC,cubas:kc?kgP/kc:0,repos:kc?Math.max(0,Math.ceil(kgP/kc)-1):0}}
function mediaDiaria(u,dias){dias=dias||7;const ds=[...Array(dias)].map((_,k)=>addDays(S.date,-k-1));const cat=rows('catraca').filter(x=>x.unidade===u&&ds.includes(x.data));const pd=ds.map(dd=>sum(cat.filter(x=>x.data===dd),x=>N(x.entradas))).filter(v=>v>0);return pd.length?sum(pd)/pd.length:0}

function barreirasDia(d,uFiltro){const now=d===S.date?nowMin():(d<S.date?1e9:-1e9);const out=[];
  rows('barreiras').filter(b=>b.ativo!=='Não').sort(by('limite')).forEach(b=>{const us=b.escopo==='Cozinha Central'?[cozinha()]:unidadesServico().map(u=>u.id);
    us.forEach(u=>{if(uFiltro&&u!==uFiltro)return;const ck=rows('checks').filter(c=>c.barreira===b.id&&c.data===d&&(c.unidade===u||(!c.unidade&&b.escopo==='Cozinha Central'))&&(d!==S.date||!c.hora||h2m(c.hora)<=now)).sort((a,c)=>(c.hora||'').localeCompare(a.hora||''))[0];
      let st;if(ck)st=ck.status;else if(now>h2m(b.limite))st='Atrasada';else st='Pendente';
      out.push({b,u,ck,st,cls:st==='Feito'?'ok':st==='Pendente'?'in':'cr'})})});return out}
function cumprimento(ds){const L=ds.flatMap(d=>barreirasDia(d).filter(x=>x.st!=='Pendente'));return L.length?L.filter(x=>x.st==='Feito').length/L.length:null}

/* ================= alertas centrais ================= */
function alertas(){
  const A=[],d=S.date,now=nowMin();
  const add=(nv,etapa,txt,acao,tab,sub)=>A.push({nv,etapa,txt,acao,tab,sub});
  // distribuição em tempo real
  REF.forEach(r=>{const j=janela(r);if(!j||now<j[0]-60||now>j[1])return;
    unidadesServico().forEach(u=>{const pl=plan(d,u.id,r);if(!pl.P)return;
      linha(d,u.id,r).forEach(x=>{if(x.cls==='cr')add(3,'Distribuição',`${x.p.nome} em ${u.nome}: ${x.st.toLowerCase()} (${x.cob!=null&&isFinite(x.cob)?fmt(x.cob,0)+' min de cobertura':'sem saldo'})`,x.pend.length?'Acompanhar reposição':'Repor agora','operacao')});
      if(pl.temReal&&Math.abs(pl.fator-1)*100>P('tolerancia_prev_pct'))add(pl.fator>1?3:1,'Demanda',`${u.nome} (${r}): demanda ${pl.fator>1?'+':''}${fmt((pl.fator-1)*100,0)}% vs previsão — projeção ${fmt(pl.proj)} pessoas (previsto ${fmt(pl.P)})`,pl.fator>1?'Replanejar produção e reposição':'Reduzir produção restante','planejamento');
    });
    if(r===refAtual())prepsAtivas().forEach(p=>{const us=unidadesServico().map(u=>({u,pp:plan(d,u.id,r).preps.find(x=>x.p.id===p.id)})).filter(x=>x.pp&&x.pp.pico.kg>0&&x.pp.pico.aui<0);
      if(us.length){const w=us.reduce((a,b)=>b.pp.pico.dur<a.pp.pico.dur?b:a);add(2,'Distribuição',`${p.nome}: no pico a cuba dura menos que a reposição (${fmt(P('tempo_reposicao_min'))} min) em ${us.length} unidade(s) — pior: ${w.u.nome}, ${fmt(w.pp.pico.dur,1)} min`,'Manter 2 cubas ou buffer pronto','planejamento')}});
  });
  // produção x demanda
  rows('ordens').filter(o=>o.data===d).forEach(o=>{const st=ordemStatus(o);if(st==='Atrasada'||st==='Deveria ter iniciado')add(2,'Produção',`${o.id} (${nm('preparacoes',o.preparacao)}): ${st.toLowerCase()} — término previsto ${o.fim_prev||'—'}`,'Acompanhar produção','producao');
    const dem=demandaPrep(d,o.preparacao,o.refeicao);if(N(o.planejado)>0&&dem>N(o.planejado)*(1+P('tolerancia_prev_pct')/100)&&o.status!=='Cancelada'){const p=get('preparacoes',o.preparacao)||{};add(3,'Produção',`${nm('preparacoes',o.preparacao)}: demanda projetada ${fmt(dem)} porções vs ordem ${fmt(N(o.planejado))} — faltam ${fmt(dem-N(o.planejado))}`,`Liberar reforço (mín. ${fmt(N(p.tempo_prod))} min)`,'producao')}});
  REF.forEach(r=>unidadesServico().forEach(u=>{const pl=plan(d,u.id,r);if(!pl.temReal||pl.fator<=1+P('tolerancia_prev_pct')/100)return;const gaps=pl.preps.map(pp=>({pp,g:pp.porcoes-pp.porcoesPrev})).filter(x=>x.g>=1).sort((a,b)=>b.g-a.g);
    if(gaps.length)add(3,'Produção',`Reforço para ${u.nome} (${r}): ${gaps.slice(0,3).map(x=>`${x.pp.p.nome} +${fmt(x.g)} porç. (${fmt(x.g*N(x.pp.p.gramatura_g)/1000,1)} kg)`).join(', ')}${gaps.length>3?'…':''}`,'Liberar reforço','producao')}));
  rows('expedicoes').filter(x=>x.data===d).forEach(x=>{const s=expStatus(x);if(s==='Atrasada')add(2,'Logística',`${x.id} → ${nm('unidades',x.destino)}: chegada prevista ${x.chegada_prev}, ainda sem registro`,'Acompanhar rota','logistica');if(x.romaneio==='Não'&&x.chegada_real)add(1,'Logística',`${x.id} → ${nm('unidades',x.destino)} sem romaneio conferido (quebra de rastreabilidade)`,'Registrar romaneio','logistica')});
  rows('degelo').forEach(x=>{const s=degeloStatus(x);if(s==='Atrasado')add(2,'Degelo',`${x.lote||x.id} ${nm('insumos',x.insumo)} (${fmt(N(x.qtd))} kg): liberação prevista ${dtBR(x.liberacao)} não confirmada`,'Verificar degelo / liberação sanitária','degelo')});
  estoque().forEach(e=>{if(e.st!=='ok')add(e.st==='cr'?3:2,'Estoque',`${e.i.nome}: cobertura de ${fmt(e.cob,1)} dias (segurança ${fmt(e.seg)} dias)${e.emPedido?' — '+fmt(e.emPedido)+' '+(e.i.um||'kg')+' em pedido':''}`,e.emPedido?'Confirmar entrega':'Antecipar compra','estoque')});
  rows('lotes').forEach(l=>{const dv=daysBetween(d,l.validade||'2999-01-01');if(l.validade&&dv<=2&&l.status!=='Bloqueado'&&N(l.qtd)>0)add(dv<0?3:2,'Estoque',`Lote ${l.id} (${nm('insumos',l.insumo)}) ${dv<0?'vencido':'vence em '+dv+' dia(s)'}`,dv<0?'Bloquear lote':'Uso prioritário (PVPS)','estoque')});
  rows('pedidos').filter(pedidoAtrasado).forEach(p=>add(2,'Suprimentos',`Pedido ${p.id} (${nm('fornecedores',p.fornecedor)}) atrasado desde ${dBR(p.data_prevista)}`,'Cobrar fornecedor','suprimentos'));
  rows('anomalias').filter(a=>a.data===d&&!['Tratada','Encerrada'].includes(a.status)).forEach(a=>add(3,'Anomalia',`${a.tipo} — ${nm('unidades',a.unidade)}${a.preparacao?' ('+nm('preparacoes',a.preparacao)+')':''} ${a.inicio||''}${a.fim?'–'+a.fim:''}`,'Investigar','anomalias',a.id));
  barreirasDia(d).filter(x=>x.cls==='cr').forEach(x=>add(x.b.criticidade==='Alta'?3:2,'Barreira',`${x.b.nome} — ${nm('unidades',x.u)}: ${x.st==='Atrasada'?'não feita até '+x.b.limite:x.st.toLowerCase()}. ${x.b.consequencia||''}`,x.b.acao||'Executar a barreira','barreiras'));
  return A.sort((a,b)=>b.nv-a.nv);
}

const COL=['#2563eb','#16a34a','#f59e0b','#7c3aed','#0891b2','#ea580c','#dc2626','#db2777'];
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function chart({labels,bars=[],lines=[],h=200,ref=null,yfmt=v=>fmt(v),y2fmt=v=>fmt(v),stacked=false,marker=null,xf=null,W=640}){
  const pl=44,pr=lines.some(l=>l.y2)?44:10,pt=12,pb=26,iw=W-pl-pr,ih=h-pt-pb,n=labels.length||1;
  const bvals=stacked?labels.map((_,i)=>sum(bars,b=>b.v[i]||0)):bars.flatMap(b=>b.v);
  const lv1=lines.filter(l=>!l.y2).flatMap(l=>l.v.filter(x=>x!=null));
  const mx=niceMax(Math.max(1,...bvals,...lv1,ref?ref.v:0));
  const lv2=lines.filter(l=>l.y2).flatMap(l=>l.v.filter(x=>x!=null));const mx2=niceMax(Math.max(1,...lv2));
  const X=i=>pl+iw*(i+.5)/n,Y=v=>pt+ih-ih*v/mx,Y2=v=>pt+ih-ih*v/mx2;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid meet">`;
  for(let k=0;k<=4;k++){const v=mx*k/4,y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e6ecf3" stroke-dasharray="${k?'3 3':''}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${yfmt(v)}</text>`;if(lv2.length)s+=`<text x="${W-pr+6}" y="${Y2(mx2*k/4)+3}">${y2fmt(mx2*k/4)}</text>`}
  const step=Math.ceil(n/12);labels.forEach((l,i)=>{if(i%step===0)s+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`});
  const bw=Math.min(34,iw/n*.72),gb=stacked?1:Math.max(1,bars.length);
  labels.forEach((_,i)=>{let acc=0;bars.forEach((b,j)=>{const v=b.v[i]||0;if(stacked){const y=Y(acc+v),hh=Y(acc)-y;s+=`<rect x="${X(i)-bw/2}" y="${y}" width="${bw}" height="${Math.max(0,hh)}" fill="${b.c}" rx="2"><title>${esc(b.n)}: ${yfmt(v)}</title></rect>`;acc+=v}else{const w=bw/gb,x=X(i)-bw/2+j*w;s+=`<rect ${xf?`data-a="xf" data-k="${esc(xf.k)}" data-v="${esc(labels[i])}" data-src="${esc(xf.src||'')}" style="cursor:pointer" `:''}x="${x+1}" y="${Y(v)}" width="${Math.max(1,w-2)}" height="${Math.max(0,pt+ih-Y(v))}" fill="${b.c}" rx="3"><title>${esc(labels[i])} · ${esc(b.n)}: ${yfmt(v)}</title></rect>`}})});
  if(ref)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(ref.v)}" y2="${Y(ref.v)}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-pr-4}" y="${Y(ref.v)-4}" text-anchor="end" style="fill:#dc2626">${esc(ref.l)}</text>`;
  if(marker!=null&&marker>=0&&marker<n)s+=`<line x1="${X(marker)}" x2="${X(marker)}" y1="${pt}" y2="${pt+ih}" stroke="#f59e0b" stroke-dasharray="4 3"/><text x="${X(marker)+4}" y="${pt+9}" style="fill:#d97706">agora</text>`;
  lines.forEach(l=>{const yy=l.y2?Y2:Y;const pts=l.v.map((v,i)=>v==null?null:[X(i),yy(v)]);let d='';pts.forEach((p,i)=>{if(!p)return;d+=(d&&pts[i-1]?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)});
    s+=`<path d="${d}" fill="none" stroke="${l.c}" stroke-width="2.2" ${l.dash?'stroke-dasharray="5 4"':''}/>`;pts.forEach((p,i)=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="${l.c}"><title>${esc(labels[i])} · ${esc(l.n)}: ${(l.y2?y2fmt:yfmt)(l.v[i])}</title></circle>`})});
  return s+'</svg>';
}
function legend(items){return `<div class="leg">${items.map(i=>`<span><i style="background:${i.c}"></i>${esc(i.n)}</span>`).join('')}</div>`}
function donut(parts,center,sub){const W=180,r=62,c=2*Math.PI*r;let off=0;const tot=sum(parts,p=>p.v)||1;
  let s=`<svg viewBox="0 0 ${W} ${W}" style="width:160px;height:160px;flex:none"><circle cx="90" cy="90" r="${r}" fill="none" stroke="#edf1f7" stroke-width="18"/>`;
  parts.forEach(p=>{const L=c*p.v/tot;s+=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${L} ${c-L}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(p.n)}: ${fmt(p.v)}</title></circle>`;off+=L});
  return s+`<text x="90" y="92" text-anchor="middle" style="fill:#0f1e33;font-size:26px;font-weight:800">${esc(center)}</text><text x="90" y="112" text-anchor="middle" style="fill:#64748b;font-size:11px">${esc(sub||'')}</text></svg>`}
function meter(v,cls){return `<div class="bar ${cls||''}"><i style="width:${Math.max(0,Math.min(100,v*100))}%"></i></div>`}
function gantt(items,from,to,lanes){/* items:{lane,a,b,label,cls} em minutos */
  const W=640,lw=96,rowH=26,h=lanes.length*rowH+30,iw=W-lw-10,X=m=>lw+iw*(m-from)/(to-from);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}">`;
  for(let m=Math.ceil(from/120)*120;m<=to;m+=120){s+=`<line x1="${X(m)}" x2="${X(m)}" y1="4" y2="${h-22}" stroke="#e6ecf3"/><text x="${X(m)}" y="${h-8}" text-anchor="middle">${m2h(m)}${m>=1440?'+1':''}</text>`}
  lanes.forEach((l,i)=>{s+=`<text x="4" y="${i*rowH+20}" style="fill:#334155">${esc(String(l).slice(0,15))}</text>`});
  const C={ok:'#22c55e',at:'#f59e0b',cr:'#ef4444',in:'#3b82f6',ne:'#94a3b8'};
  items.forEach(it=>{const i=lanes.indexOf(it.lane);if(i<0)return;const a=Math.max(from,it.a),b=Math.min(to,it.b);if(b<=a)return;s+=`<rect x="${X(a)}" y="${i*rowH+7}" width="${X(b)-X(a)}" height="18" rx="4" fill="${C[it.cls]||C.in}"><title>${esc(it.label)}</title></rect><text x="${X(a)+4}" y="${i*rowH+20}" style="fill:#fff;font-size:9.5px">${esc(it.label.slice(0,Math.max(0,Math.floor((X(b)-X(a))/5.6))))}</text>`});
  const n=nowMin();if(n>=from&&n<=to)s+=`<line x1="${X(n)}" x2="${X(n)}" y1="2" y2="${h-22}" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${X(n)+3}" y="${h-24}" style="fill:#d97706">agora ${m2h(n)}</text>`;
  return s+'</svg>'}

  <div class="row opg" style="grid-template-columns:minmax(180px,230px) 1fr"><div class="card"><h3>Selecione a unidade</h3><div class="grid">${sel}</div></div>
  <div class="card"><h3>${esc(u.nome)} — linhas de serviço (${r})<span class="sp"></span><span class="mu act">Atualizado ${m2h(now)}</span>${addBtn('leituras','+ Leitura de linha')}${addBtn('reposicoes','+ Reposição')}</h3>
  <div class="tw"><table class="t"><thead><tr><th>Preparação</th><th class="n">Cubas</th><th class="n">Saldo pronto</th><th class="n">Consumo agora</th><th class="n">Cobertura</th><th>Esgota às</th><th>Reposição</th><th>Status</th></tr></thead><tbody>${rowsL}</tbody></table></div>
  <div class="hint">Saldo = última leitura + reposições recebidas − consumo desde a leitura. Consumo = pessoas no intervalo (catraca) × taxa de escolha × gramatura × repetição. Clique numa linha para registrar nova leitura.</div></div></div>
  <div class="row c3"><div class="card"><h3>Previsão de cobertura${crit?' — '+esc(crit.p.nome):''}</h3>${proj}</div>
  <div class="card"><h3>Demanda x atendimento — ${esc(u.nome)}</h3>${legend([{n:'Previsto',c:'#3b82f6'},{n:'Real',c:'#22c55e'}])}${chart({labels,bars:[{n:'Previsto',v:pl.iv.map(i=>i.prev),c:'#3b82f6'},{n:'Real',v:pl.iv.map(i=>i.real||0),c:'#22c55e'}],marker:mk})}</div>
  <div class="card alert"><h3>⚡ Ações recomendadas (tempo real)</h3>${acts.map((a,i)=>`<div class="al ${a[2]==='r'?'cr':a[2]==='y'?'at2':'in2'}"><div class="ai"><b>${i+1}</b></div><div class="at"><b>${esc(a[0])}</b></div>${B(a[2]==='r'?'cr':a[2]==='y'?'at':'in',a[1])}</div>`).join('')}</div></div>
  <div class="row c3"><div class="card"><h3>Linha do tempo da operação</h3><div class="timeline">${steps}</div></div>
  <div class="card"><h3>Reposições — ${esc(u.nome)}</h3>${table('reposicoes',rp.filter(x=>h2m(x.solicitacao)<=nowMin()).sort(by('solicitacao')).reverse(),['preparacao','solicitacao','chegada','qtd_kg'],{sm:true,noOrig:true})}</div>

V['planejamento']=()=>{
  const d=S.date,us=unidadesServico(),r=S.ref||refAtual();const u=get('unidades',S.unit)||null;
  const target=u?[u]:us;
  const pls=target.map(x=>plan(d,x.id,r));
  const P0=sum(pls,p=>p.P),proj=sum(pls,p=>p.proj);
  const preps=prepsAtivas();
  const agg=preps.map(p=>{const list=pls.map(pl=>pl.preps.find(x=>x.p.id===p.id)).filter(Boolean);return {p,kg:sum(list,x=>x.kg),kgPrev:sum(list,x=>x.kgPrev),cubas:sum(list,x=>x.cubas),porc:sum(list,x=>x.porcoes),minDur:Math.min(...list.map(x=>x.pico.dur)),picoT:(list[0]||{}).pico?.t}});
  const ivs=(pls[0]||{iv:[]}).iv;
  const cubTab=`<div class="tw"><table class="t"><thead><tr><th>Preparação</th>${ivs.map(i=>`<th class="n">${m2h(i.t)}</th>`).join('')}<th class="n">Total kg</th><th class="n">Cubas</th><th class="n">Cuba dura (pico)</th><th class="n">AUI</th></tr></thead><tbody>${agg.map(a=>{const list=pls.map(pl=>pl.preps.find(x=>x.p.id===a.p.id));const aui=a.minDur-P('tempo_reposicao_min');
    return `<tr class="cl" data-a="edit" data-e="preparacoes" data-id="${a.p.id}"><td><b>${esc(a.p.nome)}</b><br><span class="mu">${fmt(N(a.p.gramatura_g))} g · ${fmt(N(a.p.aceitacao))}% · cuba ${fmt(N(a.p.kg_cuba),1)} kg</span></td>${ivs.map((_,k)=>{const kg=sum(list,x=>x?x.per[k].kg:0),cb=sum(list,x=>x?x.per[k].cubas:0);return `<td class="n">${fmt(kg,1)}<br><span class="mu">${cb} cuba${cb!==1?'s':''}</span></td>`}).join('')}<td class="n"><b>${fmt(a.kg,1)}</b></td><td class="n"><b>${fmt(a.cubas)}</b></td><td class="n">${isFinite(a.minDur)?fmt(a.minDur,1)+' min':'—'}</td><td class="n">${isFinite(aui)?B(aui<0?'cr':aui<3?'at':'ok',(aui>=0?'+':'')+fmt(aui,1)+' min'):'—'}</td></tr>`}).join('')}</tbody></table></div>`;
  const ex=agg.find(a=>a.p.grupo==='Proteína')||agg[0];const exPl=pls[0]&&ex?pls[0].preps.find(x=>x.p.id===ex.p.id):null;
  const calc=exPl?(()=>{const pk=exPl.pico,ivk=pls[0].iv.find(i=>i.t===pk.t);return `<div class="calc">Exemplo — ${esc(ex.p.nome)} em ${esc(target[0].nome)}, intervalo ${m2h(pk.t)}:<br>
  pessoas = ${fmt(ivk?ivk.proj:0)} · escolha ${fmt(N(ex.p.aceitacao))}% · porção ${fmt(N(ex.p.gramatura_g))} g · repetição ×${fmt(N(ex.p.fator_rep)||1,2)}<br>
  kg = ${fmt(ivk?ivk.proj:0)} × ${fmt(N(ex.p.aceitacao)/100,2)} × ${fmt(N(ex.p.gramatura_g)/1000,3)} × ${fmt(N(ex.p.fator_rep)||1,2)} = <b>${fmt(pk.kg,1)} kg</b> em ${INT()} min → ${fmt(pk.kgmin,2)} kg/min<br>
  cubas = ⌈${fmt(pk.kg,1)} × (1 + ${fmt(P('margem_pct'))}%) ÷ ${fmt(N(ex.p.kg_cuba),1)} kg⌉ = <b>${pk.cubas}</b> · cada cuba dura ${fmt(pk.dur,1)} min<br>
  AUI = ${fmt(pk.dur,1)} − ${fmt(P('tempo_reposicao_min'))} min de reposição = <b class="${pk.aui<0?'r':'g'}">${fmt(pk.aui,1)} min</b> ${pk.aui<0?'→ manter 2 cubas na linha ou buffer pronto':''}</div>`})():'';
  const labels=ivs.map(i=>m2h(i.t));
  const prevRows=rows('previsoes').filter(x=>x.data>=d&&x.data<=addDays(d,7)&&(!u||x.unidade===u.id)).sort((a,b)=>(a.data+a.unidade+a.refeicao).localeCompare(b.data+b.unidade+b.refeicao));
  const days=[...Array(8)].map((_,k)=>addDays(d,k-1));
  const capDia=days.map(dd=>sum(rows('previsoes').filter(x=>x.data===dd),x=>N(x.pessoas)));
  return head('Planejamento','Previsão de demanda → quantidade de cubas e quilos por cuba, por intervalo de entrada',`<div class="ctl">${unitSel()}${refSel()}</div>`)+
  `<div class="kpis">${K('👥','b','Pessoas previstas',fmt(P0),`${r} · ${u?esc(u.nome):'todas as unidades'}`)}${K('📈','g','Projeção corrigida',fmt(proj),pls.some(p=>p.temReal)?`fator real/previsto ${fmt(proj/(P0||1),2)}`:'sem consumo real ainda')}${K('⚖️','c','Alimento necessário',fmt(sum(agg,a=>a.kg),0)+' kg',`previsto ${fmt(sum(agg,a=>a.kgPrev),0)} kg`)}${K('🥘','pu','Cubas no serviço',fmt(sum(agg,a=>a.cubas)),`margem ${fmt(P('margem_pct'))}%`)}${K('⚠️','r','Preparações com AUI < 0',fmt(agg.filter(a=>a.minDur-P('tempo_reposicao_min')<0).length),'cuba esgota antes da reposição')}</div>
  <div class="card" style="margin-bottom:12px"><h3>🥘 Plano de cubas e quilos por intervalo (${r})<span class="sp"></span><span class="mu act">kg necessários · cubas por intervalo</span></h3>${cubTab}${calc}<div class="hint">Os intervalos já passados usam a catraca real; os futuros usam a previsão × curva de entrada, corrigida pelo desvio real/previsto do serviço. Edite gramatura, taxa de escolha e capacidade da cuba em Cadastros → Preparações; a curva em Cadastros → Curva de entrada.</div></div>
  <div class="row c2"><div class="card"><h3>Curva de entrada × projeção (pessoas por intervalo)</h3>${legend([{n:'Previsto',c:'#3b82f6'},{n:'Real (catraca)',c:'#22c55e'},{n:'Projeção',c:'#eab308'}])}${chart({labels,bars:[{n:'Previsto',v:ivs.map((_,k)=>sum(pls,p=>p.iv[k].prev)),c:'#3b82f6'},{n:'Real',v:ivs.map((_,k)=>sum(pls,p=>p.iv[k].real||0)),c:'#22c55e'}],lines:[{n:'Projeção',v:ivs.map((_,k)=>sum(pls,p=>p.iv[k].proj)),c:'#eab308'}],marker:ivs.findIndex(i=>nowMin()>=i.t&&nowMin()<i.t+INT())})}</div>
  <div class="card"><h3>Demanda prevista — próximos dias (todas as refeições)</h3>${chart({labels:days.map(dBR),bars:[{n:'Pessoas previstas',v:capDia,c:'#22c55e'}]})}</div></div>
  ${cardT('🗓️ Previsões de demanda (próximos 7 dias)',table('previsoes',prevRows,['data','unidade','refeicao','pessoas','obs']),addBtn('previsoes','+ Previsão'))}`;
};

V['suprimentos']=()=>{
  const d=S.date,pe=rows('pedidos');const aberto=pe.filter(p=>!['Recebido','Cancelado'].includes(p.status));
  const prox=aberto.filter(p=>p.data_prevista>=d&&p.data_prevista<=addDays(d,7));
  const rec=pe.filter(p=>p.status==='Recebido'&&p.data_entrega>=addDays(d,-30));const otif=rec.length?rec.filter(otifPedido).length/rec.length:null;
  const atr=pe.filter(pedidoAtrasado);
  const fs=rows('fornecedores').sort(by('nome')).map(f=>{const r=rec.filter(p=>p.fornecedor===f.id);return {f,n:r.length,otif:r.length?r.filter(otifPedido).length/r.length:null,qual:r.length?r.filter(p=>p.conforme!=='Não').length/r.length:null}});
  const days=[...Array(7)].map((_,k)=>addDays(d,k));
  const cal=days.map(dd=>({dd,kg:sum(aberto.filter(p=>p.data_prevista===dd),p=>N(p.qtd))}));
  const est=estoque();

  <div class="row c3">${cardT('🛒 Pedidos em andamento',table('pedidos',aberto.sort(by('data_prevista')),['id','fornecedor','insumo','qtd','valor','data_prevista','status'],{sm:true}),addBtn('pedidos','+ Pedido'))}
  <div class="card"><h3>Entregas e recebimento (últimos 7 dias)</h3>${legend([{n:'Previsto (kg)',c:'#3b82f6'},{n:'Entregue (kg)',c:'#22c55e'}])}${chart({labels:past.map(dBR),bars:[{n:'Previsto',v:past.map(dd=>sum(pe.filter(p=>p.data_prevista===dd),p=>N(p.qtd))),c:'#3b82f6'},{n:'Entregue',v:past.map(dd=>sum(pe.filter(p=>p.data_entrega===dd),p=>N(p.qtd_recebida))),c:'#22c55e'}]})}</div>
  <div class="card"><h3>Nível de serviço por fornecedor (OTIF)</h3><table class="t"><thead><tr><th>Fornecedor</th><th>OTIF</th><th class="n">Qualidade</th><th>Status</th></tr></thead><tbody>${fs.map(x=>`<tr class="cl" data-a="edit" data-e="fornecedores" data-id="${x.f.id}"><td>${esc(x.f.nome)}</td><td style="min-width:110px">${x.otif==null?'<span class="mu">sem entregas</span>':meter(x.otif,x.otif<P('meta_otif')/100?'y':'')+' '+pct(x.otif,0)}</td><td class="n">${x.qual==null?'—':pct(x.qual,0)}</td><td>${x.otif==null?B('ne','—'):x.otif>=P('meta_otif')/100?B('ok','Dentro da meta'):B('at','Atenção')}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="row c3"><div class="card"><h3>Necessidade × cobertura (principais insumos)</h3><table class="t"><thead><tr><th>Insumo</th><th class="n">Necessidade 7d</th><th class="n">Em pedido</th><th class="n">Cobertura</th><th>Status</th></tr></thead><tbody>${est.map(e=>`<tr class="cl" data-a="edit" data-e="insumos" data-id="${e.i.id}"><td>${esc(e.i.nome)}</td><td class="n">${fmt(e.c*7)}</td><td class="n">${fmt(e.emPedido)}</td><td class="n ${e.st==='cr'?'r':e.st==='at'?'y':'g'}"><b>${fmt(e.cob,1)} d</b></td><td>${B(e.st,e.st==='ok'?'OK':e.st==='at'?'Atenção':'Crítico')}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h3>Calendário de entregas (7 dias)</h3><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${cal.map((c,k)=>`<div class="uc" style="text-align:center;padding:8px 4px;${k===0?'border-color:#22c55e':''}"><b>${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date(c.dd+'T12:00').getDay()]}</b><div class="mu">${dBR(c.dd)}</div><div style="font-size:18px;margin:4px 0">🚚</div><b>${c.kg?fmt(c.kg)+' kg':'—'}</b></div>`).join('')}</div></div>
  ${cardT('⚠️ Riscos de abastecimento',alertList(alertas(),6,a=>['Suprimentos','Estoque'].includes(a.etapa)),'','alert')}</div>`;

  const venc=lt.filter(l=>l.validade&&daysBetween(d,l.validade)<=P('validade_alerta_dias')&&N(l.qtd)>0).sort(by('validade'));
  const valor=sum(est,e=>e.s*N(e.i.custo));
  const days=[...Array(15)].map((_,k)=>dBR(addDays(d,k)));
  const top=est.slice(0,6);
  const cen=[0,10,20];

  `<div class="kpis">${K('💰','g','Valor em estoque',brl(valor),'saldo × custo unitário')}${K('📦','b','Volume total',fmt(sum(est,e=>e.s))+' kg',fmt(lt.length)+' lotes')}${K('📅','c','Cobertura média',fmt(sum(est.filter(e=>isFinite(e.cob)),e=>e.cob)/(est.filter(e=>isFinite(e.cob)).length||1),1)+' dias','')}${K('⚠️','y','Itens em atenção',fmt(est.filter(e=>e.st==='at').length),'cobertura < segurança')}${K('🚨','r','Itens críticos',fmt(est.filter(e=>e.st==='cr').length),'cobertura < metade da segurança')}${K('🗓️','pu','Lotes a vencer',fmt(venc.length),`≤ ${fmt(P('validade_alerta_dias'))} dias`)}</div>
  <div class="row c3"><div class="card"><h3>Posição de estoque por insumo</h3><table class="t"><thead><tr><th>Insumo</th><th>Tipo</th><th class="n">Saldo</th><th class="n">Consumo/dia</th><th class="n">Cobertura</th><th>Status</th></tr></thead><tbody>${est.map(e=>`<tr class="cl" data-a="edit" data-e="insumos" data-id="${e.i.id}"><td><b>${esc(e.i.nome)}</b></td><td class="mu">${esc(e.i.tipo||'')}</td><td class="n">${fmt(e.s)} ${esc(e.i.um||'')}</td><td class="n">${fmt(e.c)}</td><td class="n ${e.st==='cr'?'r':e.st==='at'?'y':'g'}"><b>${fmt(e.cob,1)} d</b></td><td>${B(e.st,e.st==='ok'?'OK':e.st==='at'?'Atenção':'Crítico')}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h3>Curva de cobertura projetada (dias, com entregas)</h3>${legend(top.map((e,i)=>({n:e.i.nome,c:COL[i]})))}${chart({labels:days,lines:top.map((e,i)=>({n:e.i.nome,v:e.proj,c:COL[i]})),ref:{v:3,l:'Limite de segurança (3 dias)'},yfmt:v=>fmt(v,0)})}</div>
  <div class="card"><h3>Estoque por câmara / armazenagem</h3><table class="t"><thead><tr><th>Câmara</th><th class="n">Capacidade</th><th>Ocupação</th><th>Status</th></tr></thead><tbody>${cams.map(x=>`<tr class="cl" data-a="edit" data-e="camaras" data-id="${x.c.id}"><td>${esc(x.c.nome)}</td><td class="n">${fmt(N(x.c.capacidade))} kg</td><td style="min-width:120px">${meter(x.p,x.p>.9?'r':x.p>.8?'y':'')}<span class="mu">${fmt(x.oc)} kg · ${pct(x.p,0)}</span></td><td>${B(x.p>.9?'cr':x.p>.8?'at':'ok',x.p>.9?'Lotada':x.p>.8?'Atenção':'OK')}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="row c3">${cardT('🏷️ Lotes e validades',table('lotes',lt.sort(by('validade')),['id','insumo','qtd','validade','camara','status'],{sm:true}),addBtn('lotes','+ Lote'))}
  <div class="card"><h3>Projeção de cobertura (cenários de demanda)</h3><table class="t"><thead><tr><th>Insumo</th>${cen.map(c=>`<th class="n">${c?'+'+c+'%':'Base'}</th>`).join('')}</tr></thead><tbody>${est.map(e=>`<tr><td>${esc(e.i.nome)}</td>${cen.map(c=>{const v=e.c>0?e.s/(e.c*(1+c/100)):Infinity;return `<td class="n ${v<e.seg/2?'r':v<e.seg?'y':'g'}">${fmt(v,1)} d</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
  ${cardT('🚨 Alertas e recomendações de estoque',alertList(alertas(),6,a=>a.etapa==='Estoque'),'','alert')}</div>`;
};

V['degelo']=()=>{
  const d=S.date,dg=rows('degelo');const sts=dg.map(x=>({x,s:degeloStatus(x)}));
  const hoje=sts.filter(o=>(o.x.inicio||'').slice(0,10)<=d&&(o.x.liberacao||'').slice(0,10)>=addDays(d,-1));
  const camD=rows('camaras').filter(c=>c.tipo==='Degelo'||dg.some(x=>x.camara===c.id)).sort(by('id'));
  const items=hoje.map(o=>({lane:String(nm('camaras',o.x.camara)).replace(/^Câmara (de )?/,''),a:dtMin(o.x.inicio),b:dtMin(o.x.liberacao),label:`${o.x.lote||o.x.id} ${nm('insumos',o.x.insumo)} ${fmt(N(o.x.qtd))}kg`,cls:{Liberado:'ok','Em andamento':'at',Programado:'in',Atrasado:'cr',Bloqueado:'cr'}[o.s]}));
  const ins=[...new Set(rows('preparacoes').map(p=>p.insumo).filter(Boolean))].filter(i=>(get('insumos',i)||{}).tipo==='Congelado');

V['producao']=()=>{

  <div class="row c2">${cardT('📋 Ordens de produção — '+dBR(d),`<div class="tw"><table class="t"><thead><tr><th>OP</th><th>Preparação</th><th class="n">Planejado</th><th class="n">Produzido</th><th class="n">Demanda projetada</th><th>Início</th><th>Término</th><th>Status</th></tr></thead><tbody>${rep.map(r=>`<tr class="cl" data-a="edit" data-e="ordens" data-id="${r.o.id}"><td>${esc(r.o.id)}</td><td><b>${esc(r.p.nome||r.o.preparacao)}</b></td><td class="n">${fmt(N(r.o.planejado))}</td><td class="n">${r.o.produzido===''||r.o.produzido==null?'—':fmt(N(r.o.produzido))}</td><td class="n ${r.gap>0.5?'y':''}"><b>${fmt(r.dem)}</b>${r.gap>0.5?`<br><span class="y">+${fmt(r.gap)}</span>`:''}</td><td>${esc(r.o.inicio||'')}</td><td>${esc(r.o.fim_real||r.o.fim_prev||'')}</td><td>${SB(r.s)}</td></tr>`).join('')||'<tr><td colspan=8 class="empty">Sem ordens hoje.</td></tr>'}</tbody></table></div><div class="hint">Demanda projetada = soma, nas unidades, de pessoas projetadas × taxa de escolha × repetição. Quando passa da ordem, a ordem não foi replanejada.</div>`,addBtn('ordens','+ Ordem'))}
  <div class="card"><h3>Cronograma de produção — linha do tempo</h3>${lanes.length?gantt(items,6*60,16*60,lanes):'<div class="empty">Sem ordens.</div>'}${legend([{n:'Concluída',c:'#16a34a'},{n:'Em produção',c:'#ca8a04'},{n:'Programada',c:'#2563eb'},{n:'Atrasada',c:'#dc2626'}])}</div></div>
  <div class="row c3"><div class="card"><h3>Planejado × produzido (porções)</h3>${legend([{n:'Planejado',c:'#3b82f6'},{n:'Produzido',c:'#22c55e'},{n:'Demanda projetada',c:'#eab308'}])}${chart({labels:rep.map(r=>(r.p.nome||'').split(' ')[0]),bars:[{n:'Planejado',v:rep.map(r=>N(r.o.planejado)),c:'#3b82f6'},{n:'Produzido',v:rep.map(r=>N(r.o.produzido)),c:'#22c55e'}],lines:[{n:'Demanda projetada',v:rep.map(r=>r.dem),c:'#eab308'}]})}</div>

V['logistica']=()=>{

  const all=rows('expedicoes').filter(x=>x.data>=addDays(d,-6)&&x.data<=d);
  const ent=all.filter(x=>x.chegada_real);const otif=ent.length?ent.filter(x=>h2m(x.chegada_real)-h2m(x.chegada_prev)<=10).length/ent.length:null;
  const tm=ent.length?sum(ent,x=>h2m(x.chegada_real)-h2m(x.saida_real||x.saida_prev))/ent.length:null;

  const us=unidadesServico();
  return head('Logística','Transporte, expedição e entrega de preparações entre a cozinha central e as unidades')+

  <div class="row c2">${cardT('🚛 Programação de expedição — '+dBR(d),`<div class="tw"><table class="t"><thead><tr><th>ID</th><th>Destino</th><th class="n">Porções</th><th>Saída prev.</th><th>Chegada prev.</th><th>Chegada real</th><th>Romaneio</th><th>Status</th></tr></thead><tbody>${st.map(o=>`<tr class="cl" data-a="edit" data-e="expedicoes" data-id="${o.x.id}"><td>${esc(o.x.id)}</td><td>${esc(nm('unidades',o.x.destino))}</td><td class="n">${fmt(N(o.x.porcoes))}</td><td>${o.x.saida_prev||'—'}</td><td>${o.x.chegada_prev||'—'}</td><td>${o.x.chegada_real||'—'}</td><td>${SB(o.x.romaneio)}</td><td>${SB(o.s)}</td></tr>`).join('')||'<tr><td colspan=8 class="empty">Sem expedições.</td></tr>'}</tbody></table></div>`,addBtn('expedicoes','+ Expedição'))}

  <div class="row c3"><div class="card"><h3>Pontualidade das entregas (7 dias)</h3>${legend([{n:'Tempo médio (min)',c:'#22c55e'},{n:'OTIF (%)',c:'#eab308'}])}${chart({labels:days.map(dBR),bars:[{n:'Tempo médio',v:ds.map(x=>x.tm),c:'#16a34a'}],lines:[{n:'OTIF',v:ds.map(x=>x.ot),c:'#eab308',y2:true}],y2fmt:v=>fmt(v,0)+'%'})}</div>
  <div class="card"><h3>Temperatura na chegada</h3><div style="display:flex;gap:14px;align-items:center">${donut([{v:tOk||0,c:'#22c55e',n:'≥ 60 °C'},{v:1-(tOk||0),c:'#ef4444',n:'< 60 °C'}],tOk==null?'—':pct(tOk,0),'conformidade')}<div class="mu">Preparações quentes devem chegar ≥ 60 °C (ajuste conforme MBPF).<br><br>Registros com temperatura: <b style="color:var(--tx)">${temps.length}</b></div></div></div>
  ${cardT('⚠️ Alertas e ações recomendadas',alertList(alertas(),6,a=>a.etapa==='Logística'),'','alert')}</div>`;

V['distribuicao']=()=>{

  const pl=plan(d,u.id,r),L=linha(d,u.id,r);

  const sla=P('sla_reposicao_min');const tt=rpc.map(x=>h2m(x.chegada)-h2m(x.solicitacao));
  const grp=[...new Set(L.map(x=>x.p.grupo))].map(g=>{const xs=L.filter(x=>x.p.grupo===g&&x.cob!=null&&isFinite(x.cob));return {g,cob:xs.length?Math.min(...xs.map(x=>x.cob)):null}});
  const resumo=us.map(x=>{const p=plan(d,x.id,r),l=linha(d,x.id,r),rr=rpc.filter(y=>y.unidade===x.id);return {x,p,risco:l.filter(y=>y.cls==='cr').length,sla:rr.length?sum(rr,y=>h2m(y.chegada)-h2m(y.solicitacao))/rr.length:null,st:statusUnidade(d,x.id,r)}});
  const now=nowMin(),nx=pl.iv.filter(i=>i.t>=now-INT()+0.01&&i.t<now+30);

  <div class="row c2"><div class="card"><h3>Monitoramento por preparação / cuba — ${esc(u.nome)}</h3><div class="tw"><table class="t"><thead><tr><th>Preparação</th><th class="n">Cubas (plano)</th><th class="n">Saldo</th><th class="n">Consumo</th><th class="n">Cobertura</th><th>Esgota às</th><th>Status</th></tr></thead><tbody>${L.map(x=>`<tr class="cl" data-a="newleitura" data-v="${x.p.id}"><td><b>${esc(x.p.nome)}</b></td><td class="n">${fmt(x.cubas)} <span class="cub">${'<i></i>'.repeat(Math.min(8,x.pico.cubas||0))}</span></td><td class="n">${x.saldo==null?'—':fmt(x.saldo,1)+' kg'}</td><td class="n">${fmt(x.porcMin,1)} porç/min</td><td class="n ${x.cls==='cr'?'r':x.cls==='at'?'y':'g'}"><b>${x.cob==null?'—':isFinite(x.cob)?fmt(x.cob,0)+' min':'∞'}</b></td><td>${x.esg&&isFinite(x.esg)?m2h(x.esg):'—'}</td><td>${B(x.cls,x.st)}</td></tr>`).join('')}</tbody></table></div><div class="hint">Cubas desenhadas = cubas necessárias no intervalo de pico.</div></div>

function investigar(a){
  const E=[],d=a.data,u=a.unidade,p=get('preparacoes',a.preparacao),r=a.refeicao||'Almoço',h=h2m(a.inicio)??nowMin();
  const add=(etapa,achado,sinal)=>E.push({etapa,achado,sinal});
  // (a) consumo e reposição
  const cat=rows('catraca').filter(x=>x.data===d&&x.unidade===u&&x.refeicao===r&&h2m(x.inicio)+INT()<=h);
  const Pp=prevPessoas(d,u,r),cv=curva(r);const prevAte=sum(cv.filter(c=>h2m(c.inicio)+INT()<=h),c=>Pp*N(c.pct)/100);const real=sum(cat,x=>N(x.entradas));
  if(Pp&&cat.length){const dv=real/(prevAte||1)-1;add('Demanda',`Até ${a.inicio}: ${fmt(real)} pessoas na catraca vs ${fmt(prevAte)} previstas (${dv>=0?'+':''}${pct(dv,0)}). Previsão do dia: ${fmt(Pp)}.`,Math.abs(dv)*100>P('tolerancia_prev_pct')?'forte':'ok')}else add('Demanda','Sem catraca ou previsão para comparar no horário.','fraco');
  if(p){const rp=rows('reposicoes').filter(x=>x.data===d&&x.unidade===u&&x.preparacao===p.id&&h2m(x.solicitacao)<=h+5);
    const lentas=rp.filter(x=>x.chegada&&h2m(x.chegada)-h2m(x.solicitacao)>P('sla_reposicao_min'));const pend=rp.filter(x=>!x.chegada||h2m(x.chegada)>h);
    add('Reposição',rp.length?`${rp.length} reposição(ões) de ${p.nome}; ${lentas.length} acima do SLA de ${fmt(P('sla_reposicao_min'))} min; ${pend.length} sem chegada antes da parada.`:`Nenhuma reposição de ${p.nome} registrada antes da parada.`,lentas.length||pend.length?'forte':rp.length?'ok':'fraco');
    const pl=plan(d,u,r),pp=pl.preps.find(x=>x.p.id===p.id);if(pp)add('Buffer / cubas',`No pico (${m2h(pp.pico.t)}) uma cuba de ${p.nome} dura ${fmt(pp.pico.dur,1)} min; reposição ${fmt(P('tempo_reposicao_min'))} min → AUI ${fmt(pp.pico.aui,1)} min.`,pp.pico.aui<0?'forte':'ok');
    const lt=rows('leituras').filter(x=>x.data===d&&x.unidade===u&&x.preparacao===p.id&&h2m(x.hora)<=h).sort((a,b)=>h2m(b.hora)-h2m(a.hora))[0];if(lt)add('Saldo na linha',`Última leitura às ${lt.hora}: ${fmt(N(lt.saldo_kg),1)} kg (${fmt(N(lt.cubas))} cuba(s)).`,N(lt.saldo_kg)<N(p.kg_cuba)?'fraco':'ok');
    // (b) produção / expedição
    const op=rows('ordens').filter(o=>o.data===d&&o.preparacao===p.id&&(o.refeicao||r)===r);
    if(op.length){const pl2=sum(op,o=>N(o.planejado)),dem=demandaPrep(d,p.id,r),prevD=demandaPrepPrev(d,p.id,r);add('Produção',`Ordem(ns) ${op.map(o=>o.id).join(', ')}: ${fmt(pl2)} porções planejadas; demanda prevista ${fmt(prevD)} e projetada ${fmt(dem)}. ${dem>pl2*1.03?'Ordem não foi replanejada.':''}`,dem>pl2*1.03?'forte':'ok');
      op.forEach(o=>{const s=ordemStatus(o);if(o.fim_real&&o.fim_prev&&h2m(o.fim_real)>h2m(o.fim_prev))add('Produção',`${o.id} terminou ${o.fim_real} (previsto ${o.fim_prev}).`,'fraco');if(['Atrasada','Deveria ter iniciado'].includes(s))add('Produção',`${o.id}: ${s}.`,'forte')})}
    else add('Produção',`Sem ordem de produção de ${p.nome} na data.`,'fraco');
    const ex=rows('expedicoes').filter(x=>x.data===d&&x.destino===u&&(x.refeicao||r)===r);
    ex.forEach(x=>{const at=x.chegada_real?h2m(x.chegada_real)-h2m(x.chegada_prev):null;add('Logística',`${x.id}: chegada ${x.chegada_real||'não registrada'} (prevista ${x.chegada_prev||'—'})${x.romaneio==='Não'?'; sem romaneio conferido':''}.`,at!=null&&at>10?'forte':x.romaneio==='Não'||!x.chegada_real?'fraco':'ok')});
    // (c) degelo e insumos
    if(p.insumo){const dg=rows('degelo').filter(x=>x.insumo===p.insumo&&(x.liberacao||'').slice(0,10)>=addDays(d,-1)&&(x.liberacao||'').slice(0,10)<=d);
      const atr=dg.filter(x=>{const s=degeloStatus(x);return s==='Atrasado'||s==='Bloqueado'});add('Degelo',dg.length?`${dg.length} lote(s) de ${nm('insumos',p.insumo)} em degelo para a data; ${atr.length} atrasado(s)/bloqueado(s).`:`Nenhum degelo de ${nm('insumos',p.insumo)} registrado para a data.`,atr.length?'forte':dg.length?'ok':'fraco');
      // (d) estoque
      const e=estoque().find(x=>x.i.id===p.insumo);if(e)add('Estoque',`${e.i.nome}: ${fmt(e.s)} ${e.i.um||'kg'} hoje, cobertura ${fmt(e.cob,1)} dias (segurança ${fmt(e.seg)}).`,e.st==='cr'?'fraco':'ok')}
    // (e) cardápio
    add('Cardápio',`${p.nome}: taxa de escolha cadastrada ${fmt(N(p.aceitacao))}%, porção ${fmt(N(p.gramatura_g))} g, repetição ×${fmt(N(p.fator_rep)||1,2)}.`,'ok');
  }
  rows('barreiras').filter(b=>b.previne===a.tipo&&b.ativo!=='Não').forEach(b=>{const uu=b.escopo==='Cozinha Central'?cozinha():u;const ck=rows('checks').filter(c=>c.barreira===b.id&&c.data===d&&c.unidade===uu&&(!c.hora||h2m(c.hora)<=h+5));const ok=ck.some(c=>c.status==='Feito');const lim=h2m(b.limite);if(lim!=null&&lim>h&&!ck.length)return;add('Barreira',ok?`${b.nome}: feita (${ck.find(c=>c.status==='Feito').hora}).`:`${b.nome}: NÃO feita até ${b.limite} em ${nm('unidades',uu)}. ${b.consequencia||''}`,ok?'ok':'forte')});
  const eq=rows('equipamentos').filter(x=>x.status!=='Disponível');if(eq.length)add('Equipamentos',eq.map(x=>`${x.nome}: ${x.status}`).join('; '),'fraco');
  const o={forte:0,fraco:1,ok:2};return E.sort((a,b)=>o[a.sinal]-o[b.sinal]||(b.etapa==='Barreira')-(a.etapa==='Barreira'));
}
function openInvestigacao(id){
  const a=get('anomalias',id);if(!a)return;
  const ev=investigar(a);const ac=rows('acoes').filter(x=>x.anomalia===id).sort(by('prazo'));
  const pq=[a.pq1,a.pq2,a.pq3,a.pq4,a.pq5];
  modal(`<h2>⚠️ ${esc(a.tipo)} — ${esc(a.id)} ${isSim(a)?'<span class="tag sim">SIMULADO</span>':''}<span class="sp" style="flex:1"></span><button class="btn sm" data-a="close">✕</button></h2>
  <div class="mu" style="margin-bottom:10px">${esc(nm('unidades',a.unidade))} · ${dBR(a.data)} ${a.inicio||''}${a.fim?'–'+a.fim+' ('+(h2m(a.fim)-h2m(a.inicio))+' min)':''} · ${esc(a.refeicao||'')} · ${esc(nm('preparacoes',a.preparacao))} · ${SB(a.status)} ${SB(a.severidade)}</div>
  <div class="card" style="margin-bottom:10px"><h3>Descrição</h3>${esc(a.descricao||'—')}</div>

  <div class="card"><h3>🧠 5 Porquês</h3><div class="why">${pq.map((q,i)=>`<span class="q">${i+1}º Porquê</span><span>${esc(q||'—')}</span>`).join('')}</div>

  <div class="card"><h3>Distribuição das anomalias</h3><div style="display:flex;gap:14px;align-items:center">${donut(tipos.map((t,i)=>({n:t.n,v:t.v,c:COL[[6,2,1,3,4,5,0][i%7]]})),fmt(an.length),'anomalias')}<div>${tipos.map((t,i)=>`<div><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${COL[[6,2,1,3,4,5,0][i%7]]};margin-right:6px"></i>${esc(t.n)}: <b>${pct(t.v/(an.length||1),1)}</b></div>`).join('')}</div></div></div></div>

V['dimensionamento']=()=>{
  const d=S.date,us=unidadesServico();const u=S.dimU?get('unidades',S.dimU):null;const tgt=u?[u]:us;
  const base=S.dimB||'prev';
  const pessoasU=x=>base==='media'?mediaDiaria(x.id,7):sum(rows('previsoes').filter(p=>p.data===d&&p.unidade===x.id),p=>N(p.pessoas));
  const pessoas=sum(tgt,pessoasU);const ps=prepsAtivas();const D=ps.map(p=>dimensionar(p,pessoas));
  const ex=ps.find(p=>p.grupo==='Proteína')||ps[0];const de=ex?dimensionar(ex,pessoas):null;const tc=ex?get('cubas_tipos',ex.tipo_cuba):null;
  const rowsT=D.map(x=>`<tr class="cl" data-a="edit" data-e="preparacoes" data-id="${x.p.id}"><td><b>${esc(x.p.nome)}</b><br><span class="mu">${esc(x.p.grupo||'')}</span></td><td class="n">${fmt(N(x.p.cru_g))} g</td><td class="n">${fmt(N(x.p.rend_coccao))}%</td><td class="n"><b>${fmt(x.g)} g</b></td><td>${esc(nm('cubas_tipos',x.p.tipo_cuba))}</td><td class="n">${fmt(x.kc,1)} kg</td><td class="n">${fmt(x.porcCuba,0)}</td><td class="n">${fmt(x.porc)}</td><td class="n">${fmt(x.kgC,1)} kg</td><td class="n"><b>${fmt(x.kgP,1)} kg</b></td><td class="n"><b>${fmt(x.cubas,1)}</b></td><td class="n">${fmt(x.repos)}</td></tr>`).join('');
  const med=us.map(x=>{const pe=mediaDiaria(x.id,7);const dd=ps.map(p=>dimensionar(p,pe));return {u:x,pe,kgP:sum(dd,y=>y.kgP),kgC:sum(dd,y=>y.kgC),cub:sum(dd,y=>y.cubas),rep:sum(dd,y=>y.repos),dd}});
  return head('Do cru para a cuba','Peso cru da ficha técnica → rendimento → quilos prontos → cubas e reposições no dia',`<div class="ctl">${unitSel(true,'dimU')}<div class="chips">${[['prev','Previsão do dia'],['media','Média dos últimos 7 dias']].map(([k,l])=>`<span class="chip ${base===k?'on':''}" data-a="dimb" data-v="${k}">${l}</span>`).join('')}</div></div>`)+

  <div class="card" style="margin-bottom:14px"><h3>🥘 Dimensionamento por preparação<span class="sp"></span><button class="btn sm act" data-a="nav" data-v="parametros">Ajustar valores</button></h3><div class="tw"><table class="t"><thead><tr><th>Preparação</th><th class="n">Cru/pessoa</th><th class="n">Rendimento</th><th class="n">Pronto/porção</th><th>Cuba</th><th class="n">Kg por cuba</th><th class="n">Porções por cuba</th><th class="n">Porções no dia</th><th class="n">Kg cru</th><th class="n">Kg pronto</th><th class="n">Cubas no dia</th><th class="n">Reposições</th></tr></thead><tbody>${rowsT}</tbody></table></div>

EXTRA['anomalias']=()=>{const d=S.date,an=rows('anomalias').filter(a=>a.data>=addDays(d,-29)&&a.data<=d);const last=an.filter(a=>a.tipo==='Parada de rampa'&&(a.pq1||a.causa)).sort((a,b)=>(b.data+b.inicio).localeCompare(a.data+a.inicio))[0];

  <div class="card"><h3>💡 Insights</h3>${ins.map(x=>`<div class="al in2"><div class="ai">${x[0]}</div><div class="at"><b>${esc(x[1])}</b></div></div>`).join('')||'<div class="empty">Sem dados suficientes.</div>'}</div></div>
  <div class="card" style="margin-bottom:14px"><h3>Risco e probabilidade de reincidência (estimativa)</h3><table class="t"><thead><tr><th>Tipo</th><th class="n">Ocorrências (30d)</th><th class="n">Probabilidade atual</th><th class="n">Após ações</th><th>Impacto</th><th>Risco</th></tr></thead><tbody>${risco.map(x=>{const rk=x.pDep*(x.sev==='Alta'?3:x.sev==='Média'?2:1);return `<tr><td>${esc(x.t)}</td><td class="n">${x.n}</td><td class="n">${pct(x.pAt,1)}</td><td class="n g">${pct(x.pDep,1)}</td><td>${SB(x.sev)}</td><td>${B(rk>0.3?'cr':rk>0.12?'at':'ok',rk>0.3?'Alto':rk>0.12?'Médio':'Baixo')}</td></tr>`}).join('')}</tbody></table><div class="hint">Probabilidade atual = dias com ocorrência ÷ 30. "Após ações" desconta as ações concluídas e com eficácia verificada (estimativa simples, não é modelo estatístico).</div></div>`};

/* ---------- Análises personalizadas (construtor estilo Power BI) ---------- */
function compileFormula(f,keys){const toks=String(f).match(/[A-Za-z_][A-Za-z0-9_]*|\d+(?:[.,]\d+)?|[-+*/(),<>=!?:]|\s+/g)||[];if(toks.join('')!==String(f))throw new Error('caractere não permitido');
  const fn={min:'Math.min',max:'Math.max',round:'Math.round',abs:'Math.abs',se:'((c,a,b)=>c?a:b)'};
  const js=toks.map(t=>{if(/^\s+$/.test(t))return t;if(/^\d/.test(t))return t.replace(',','.');if(/^[A-Za-z_]/.test(t)){if(fn[t])return fn[t];if(keys.includes(t))return `N(r[${JSON.stringify(t)}])`;throw new Error('campo desconhecido: '+t)}return t}).join('');
  return new Function('r','N','return ('+js+')').bind(null)}
function srcFields(src){if(String(src).startsWith('ds:')){const d=get('datasets',src.slice(3));return d?(d.colunas||[]).map(c=>({k:c,l:c,t:'t'})):[]}if(!SCHEMA[src])return [];return [...fields(src),...(CFG.calc||[]).filter(c=>c.tabela===src).map(c=>({k:c.k,l:c.nome+' (calculado)',t:'n'}))]}
function srcRows(src){if(String(src).startsWith('ds:')){const d=get('datasets',src.slice(3));return d?(d.linhas||[]):[]}const cs=(CFG.calc||[]).filter(c=>c.tabela===src);let R=rows(src);if(!cs.length)return R;const keys=srcFields(src).map(f=>f.k);const fns=cs.map(c=>{try{return [c.k,compileFormula(c.formula,keys)]}catch(e){return [c.k,()=>null]}});return R.map(r=>{const x={...r};fns.forEach(([k,f])=>{try{x[k]=f(x,N)}catch(e){x[k]=null}});return x})}
function dispVal(src,k,v){const f=srcFields(src).find(x=>x.k===k);if(f&&f.t==='r')return nm(f.e,v);if(f&&f.t==='d')return v;return v==null||v===''?'(vazio)':String(v)}
function runAnalise(a,useXf){let R=srcRows(a.fonte);const fs=srcFields(a.fonte);
  if(N(a.periodo)>0&&fs.some(f=>f.k==='data')){const ini=addDays(S.date,-(N(a.periodo)-1));R=R.filter(r=>r.data>=ini&&r.data<=S.date)}
  (a.filtros||[]).filter(f=>f&&f.k).forEach(f=>{R=R.filter(r=>{const v=r[f.k],dv=dispVal(a.fonte,f.k,v),x=f.v;switch(f.op){case '=':return norm(dv)===norm(x)||norm(v)===norm(x);case '≠':return norm(dv)!==norm(x)&&norm(v)!==norm(x);case 'contém':return norm(dv).includes(norm(x));case '>':return N(v)>N(x);case '<':return N(v)<N(x);default:return true}})});
  if(useXf&&S.xf&&S.xf.tab===S.tab&&S.xf.src!==a.id&&fs.some(f=>f.k===S.xf.k))R=R.filter(r=>dispVal(a.fonte,S.xf.k,r[S.xf.k])===S.xf.v);
  const meas=vals=>{const nums=vals.map(v=>N(v));switch(a.medida){case 'soma':return sum(nums);case 'media':return nums.length?sum(nums)/nums.length:0;case 'min':return nums.length?Math.min(...nums):0;case 'max':return nums.length?Math.max(...nums):0;case 'distintos':return new Set(vals.map(String)).size;default:return vals.length}};
  const key=r=>{if(!a.dim)return 'Total';if(a.dim==='_dia')return dBR(r.data);if(a.dim==='_mes')return String(r.data||'').slice(0,7);if(a.dim==='_semana'){const d=new Date((r.data||'')+'T12:00');if(isNaN(d))return '—';d.setDate(d.getDate()-((d.getDay()+6)%7));return 'Sem '+dBR(d.toISOString().slice(0,10))}return dispVal(a.fonte,a.dim,r[a.dim])};
  const g=new Map();R.forEach(r=>{const k=key(r);if(!g.has(k))g.set(k,[]);g.get(k).push(a.medida==='contagem'?1:r[a.campo])});
  let out=[...g.entries()].map(([k,v])=>({k,v:meas(v)}));
  if(a.dim&&a.dim.startsWith('_'))out.sort((x,y)=>x.k.localeCompare(y.k));else out.sort((x,y)=>y.v-x.v);
  if(N(a.top)>0)out=out.slice(0,N(a.top));
  return {out,n:R.length,total:a.medida==='contagem'?R.length:meas(R.map(r=>r[a.campo]))}}
function renderAnalise(a,preview){const res=runAnalise(a,!preview);const lab=res.out.map(x=>x.k),val=res.out.map(x=>x.v);const dec=a.medida==='media'?1:0;const f=v=>fmt(v,dec);
  const xf=a.dim&&!a.dim.startsWith('_')?{k:a.dim,src:a.id}:null;
  if(!res.out.length)return '<div class="empty">Sem dados para os filtros escolhidos.</div>';
  switch(a.visual){
    case 'kpi':return `<div class="big">${f(res.total)}</div><div class="mu">${esc(a.sub||'')} ${res.n} registro(s)</div>`;
    case 'linha':return chart({labels:lab,lines:[{n:a.titulo,v:val,c:a.cor||'#2563eb'}],yfmt:f,h:200});
    case 'rosca':return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${donut(res.out.slice(0,8).map((x,i)=>({n:x.k,v:x.v,c:COL[i%COL.length]})),f(res.total),'total')}<div>${res.out.slice(0,8).map((x,i)=>`<div ${xf?`data-a="xf" data-k="${esc(xf.k)}" data-v="${esc(x.k)}" data-src="${esc(a.id)}" style="cursor:pointer"`:''}><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${COL[i%COL.length]};margin-right:6px"></i>${esc(x.k)}: <b>${f(x.v)}</b></div>`).join('')}</div></div>`;
    case 'tabela':return `<div class="tw sm"><table class="t"><thead><tr><th>${esc(a.dim?dimLabel(a):'')}</th><th class="n">${esc(medLabel(a))}</th></tr></thead><tbody>${res.out.map(x=>`<tr ${xf?`class="cl" data-a="xf" data-k="${esc(xf.k)}" data-v="${esc(x.k)}" data-src="${esc(a.id)}"`:''}><td>${esc(x.k)}</td><td class="n">${f(x.v)}</td></tr>`).join('')}</tbody></table></div>`;
    default:return chart({labels:lab,bars:[{n:a.titulo,v:val,c:a.cor||'#2563eb'}],yfmt:f,h:200,xf})}}
const medLabel=a=>({contagem:'Contagem',soma:'Soma',media:'Média',min:'Mínimo',max:'Máximo',distintos:'Distintos'}[a.medida]||'')+(a.medida!=='contagem'&&a.campo?' de '+((srcFields(a.fonte).find(f=>f.k===a.campo)||{}).l||a.campo):'');
const dimLabel=a=>({_dia:'Dia',_semana:'Semana',_mes:'Mês'}[a.dim])||((srcFields(a.fonte).find(f=>f.k===a.dim)||{}).l||a.dim);
