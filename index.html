<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre de Controle Operacional — Alimentação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06101c;--bg2:#091727;--p:#0c1b2e;--p2:#10233a;--ln:#1d3552;--ln2:#28466b;--tx:#e2ecf6;--mu:#8ea3bb;--mu2:#5f7690;
--g:#22c55e;--g2:#16a34a;--y:#eab308;--r:#ef4444;--b:#3b82f6;--c:#06b6d4;--pu:#a855f7;--o:#f97316;--rad:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px}
body{min-height:100vh}
a{color:var(--c)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#081627,#07121f);border-bottom:1px solid var(--ln)}
.hdr{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0f3b2a,#0c2b45);display:grid;place-items:center;border:1px solid #1f5a40}
.ttl{font-weight:800;font-size:18px;font-style:italic;letter-spacing:-.2px;white-space:nowrap}
.ttl small{font-weight:500;color:var(--mu);font-style:normal;font-size:13px;margin-left:6px}
.sp{flex:1}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--ln2);background:var(--p);color:var(--tx);font-size:12px;white-space:nowrap}
.pill.live{border-color:#1f7a45;color:#4ade80}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g)}
.dot.y{background:var(--y);box-shadow:0 0 8px var(--y)}.dot.r{background:var(--r);box-shadow:0 0 8px var(--r)}.dot.gray{background:var(--mu2);box-shadow:none}
input.in,select.in,textarea.in{background:var(--bg2);border:1px solid var(--ln2);border-radius:8px;padding:6px 9px;outline:none;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--g)}
nav.tabs{display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:none;border:1px solid transparent;color:var(--tx);padding:7px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button:hover{background:var(--p2)}
nav.tabs button.on{background:linear-gradient(180deg,#14532d,#0f3d22);border-color:#22c55e;color:#fff;font-weight:700;box-shadow:0 0 12px rgba(34,197,94,.35)}
.banner{margin:10px 16px 0;padding:10px 14px;border-radius:10px;border:1px solid #6b5a12;background:#2a2408;color:#fde68a;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{border-color:#1e4a7a;background:#0b2440;color:#bfdbfe}
.banner.err{border-color:#7f1d1d;background:#2b0d0d;color:#fecaca}
main{padding:14px 16px 40px;max-width:1700px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-weight:800}
.ph p{margin:2px 0 0;color:var(--mu)}
.grid{display:grid;gap:12px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.kpi{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:var(--rad);padding:11px 12px;display:flex;gap:10px;align-items:center;min-width:0}
.kpi .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:19px}
.kpi .v{font-size:22px;font-weight:800;line-height:1.1;white-space:nowrap}
.kpi .l{color:var(--tx);font-size:12px;font-weight:600}
.kpi .s{color:var(--mu);font-size:11px;margin-top:2px}
.ic.g{background:#0f3d22;color:#4ade80}.ic.b{background:#0f2a52;color:#60a5fa}.ic.y{background:#3d300a;color:#facc15}.ic.r{background:#4a1111;color:#f87171}.ic.c{background:#083344;color:#22d3ee}.ic.pu{background:#2e1065;color:#c084fc}.ic.o{background:#431407;color:#fb923c}
.row{display:grid;gap:12px;margin-bottom:12px}
.c2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.c4{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.w2{grid-column:span 2}
@media(max-width:900px){.c2,.c3,.opg{grid-template-columns:1fr!important}.w2{grid-column:auto}}
@media(max-width:600px){.ttl{white-space:normal;font-size:15px}.ttl small{display:none}main{padding:10px 10px 30px}.kpi .v{font-size:19px}.hdr{padding:8px 10px}}
.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:var(--rad);padding:12px 14px;min-width:0}
.card h3{margin:0 0 10px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3 .act{font-weight:500;font-size:12px}
.card.alert{border-color:#7f1d1d;background:linear-gradient(180deg,#1d0f17,#130b12)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{color:var(--mu);font-weight:600;text-align:left;padding:6px 7px;border-bottom:1px solid var(--ln);white-space:nowrap;font-size:11.5px}
table.t td{padding:6px 7px;border-bottom:1px solid rgba(29,53,82,.55);vertical-align:middle}
table.t tr.cl{cursor:pointer}
table.t tr.cl:hover td{background:rgba(59,130,246,.07)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-height:520px}
.tw.sm{max-height:300px}
.b{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.b.ok{background:#0f3d22;color:#4ade80;border-color:#166534}
.b.at{background:#3d300a;color:#facc15;border-color:#854d0e}
.b.cr{background:#4a1111;color:#fca5a5;border-color:#991b1b}
.b.in{background:#0f2a52;color:#93c5fd;border-color:#1e40af}
.b.ne{background:#1b2a3d;color:#a9b9cc;border-color:#2c4260}
.b.pu{background:#2e1065;color:#d8b4fe;border-color:#6b21a8}
.tag{font-size:10px;padding:1px 6px;border-radius:5px;background:#1b2a3d;color:#9fb3c8;border:1px solid #2c4260;margin-left:4px;font-weight:600;vertical-align:middle}
.tag.sim{background:#2e1a05;color:#fdba74;border-color:#7c2d12}
.btn{background:var(--p2);border:1px solid var(--ln2);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--g)}
.btn.pr{background:linear-gradient(180deg,#16a34a,#15803d);border-color:#22c55e;color:#fff}
.btn.dg{background:#3a1010;border-color:#7f1d1d;color:#fecaca}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.y{background:#3d300a;border-color:#a16207;color:#fde68a}
.btn.r{background:#4a1111;border-color:#b91c1c;color:#fecaca}
.btn.bl{background:#0f2a52;border-color:#1d4ed8;color:#bfdbfe}
.mu{color:var(--mu)}.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}.bl{color:#60a5fa}
.flow{display:flex;gap:0;overflow-x:auto;padding:2px 2px 4px}
.fs{flex:1;min-width:128px;position:relative;padding:9px 18px 9px 22px;background:#0f3d22;border:1px solid #166534;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);margin-right:-8px;cursor:pointer}
.fs:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-left:14px}
.fs.at{background:#3d300a}.fs.cr{background:#4a1111}.fs.ne{background:#14243a}
.fs b{display:block;font-size:12.5px}
.fs span{font-size:11px;color:#bbf7d0}
.fs.at span{color:#fde68a}.fs.cr span{color:#fecaca}.fs.ne span{color:var(--mu)}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid var(--ln);margin-bottom:7px}
.al .ai{font-size:16px;line-height:1}
.al .at{flex:1;min-width:0}
.al .at b{display:block;font-size:12.5px}
.al .at span{font-size:11.5px;color:var(--mu)}
.al.cr{border-color:#7f1d1d;background:#1f0d10}.al.at2{border-color:#713f12;background:#1c1609}.al.in2{border-color:#1e3a8a;background:#0b1a33}
.units{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.uc{border:1px solid var(--ln);border-radius:11px;padding:10px 12px;background:var(--bg2);cursor:pointer}
.uc.cr{border-color:#b91c1c;box-shadow:0 0 0 1px #7f1d1d inset;background:#1a0c0f}.uc.at{border-color:#a16207}
.uc h4{margin:0 0 4px;font-size:13.5px}
.bar{height:6px;background:#1a2c44;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:4px}
.bar.y i{background:var(--y)}.bar.r i{background:var(--r)}.bar.b i{background:var(--b)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mu);font-size:10px;font-family:Inter,sans-serif}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin:-4px 0 6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.modal{position:fixed;inset:0;background:rgba(2,8,16,.72);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.modal.on{display:flex}
.mbox{background:var(--p);border:1px solid var(--ln2);border-radius:14px;width:min(860px,100%);padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 12px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--mu);font-weight:600}
.fg label.full{grid-column:1/-1}
.fg .in{width:100%}
.mft{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.side{display:grid;grid-template-columns:230px 1fr;gap:12px}
@media(max-width:820px){.side{grid-template-columns:1fr}}
.elist button{display:flex;width:100%;justify-content:space-between;background:none;border:1px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer;text-align:left}
.elist button:hover{background:var(--p2)}
.elist button.on{background:#0f3d22;border-color:#166534}
.elist .gh{color:var(--mu2);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;margin:10px 0 4px 6px;font-weight:700}
.macro{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.mc{min-width:220px;max-width:240px;background:var(--bg2);border:1px solid var(--ln);border-radius:11px;padding:9px}
.mc h4{margin:0 0 8px;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.sc{border:1px solid var(--ln);border-left:4px solid var(--g);border-radius:8px;padding:7px 8px;margin-bottom:6px;background:var(--p);cursor:pointer;font-size:12px}
.sc.nao{border-left-color:var(--r)}.sc.na{border-left-color:var(--mu2)}.sc.ver{border-left-color:var(--y)}
.sc small{display:block;color:var(--mu);font-size:10.5px;margin-top:3px}
.why{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.why .q{background:#0f3d22;border:1px solid #166534;color:#bbf7d0;border-radius:7px;padding:4px 8px;font-weight:700;font-size:11px;white-space:nowrap}
.ev{display:flex;gap:9px;padding:8px 10px;border-radius:9px;border:1px solid var(--ln);margin-bottom:6px;background:var(--bg2)}
.ev.forte{border-color:#b91c1c;background:#1f0d10}.ev.fraco{border-color:#a16207;background:#1c1609}.ev.ok{border-color:#166534}
.ev b{font-size:12px}.ev div{font-size:12px}
.heat td{text-align:center;font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f3d22;border:1px solid #22c55e;color:#dcfce7;padding:9px 16px;border-radius:10px;z-index:80;display:none;font-weight:600;max-width:90vw}
.toast.on{display:block}.toast.err{background:#4a1111;border-color:#ef4444;color:#fee2e2}
.empty{padding:20px;text-align:center;color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--ln2);background:var(--bg2);cursor:pointer;font-size:12px;font-weight:600}
.chip.on{background:#0f3d22;border-color:#22c55e;color:#bbf7d0}
.cub{display:inline-flex;gap:2px;vertical-align:middle}
.cub i{width:7px;height:11px;border-radius:2px;background:#60a5fa;display:block}
.timeline{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:6px 0}
.tl{flex:1;min-width:110px;text-align:center;position:relative;font-size:11.5px}
.tl:before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--ln2);z-index:0}
.tl:first-child:before{display:none}
.tl.done:before{background:var(--g)}
.tl .o{width:22px;height:22px;border-radius:50%;margin:0 auto 5px;border:3px solid var(--ln2);background:var(--p);position:relative;z-index:1}
.tl.done .o{border-color:var(--g);background:#0f3d22}.tl.now .o{border-color:var(--y);background:#3d300a;box-shadow:0 0 10px var(--y)}
.hint{font-size:11.5px;color:var(--mu);margin-top:6px}
.sub{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.calc{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;color:#cbd5e1;line-height:1.6}
</style>
</head>
<body>
<div class="top">
  <div class="hdr">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.9A4 4 0 0 1 7.5 6.3a5 5 0 0 1 9 0A4 4 0 0 1 18 13.9V20H6z"/><path d="M6 17h12"/></svg></div>

      <span class="pill live" id="livePill"><span class="dot"></span><span id="liveTxt">Operação</span></span>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="banners"></div>
<main id="view"></main>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

let db=null,sb=null,backend='demo',dbState='local',dbEmpty=false,loaded={tabelas:false,config:false},existing=new Set(),qchain={};
const LSK='torre-controle:';
function enqueue(path,fn){const p=(qchain[path]||Promise.resolve()).then(fn,fn);qchain[path]=p.catch(()=>{});return p}
async function persist(e){
  if(dbState!=='ok')return;
  const rowsE=DATA[e]||{};
  return enqueue('t:'+e,async()=>{try{
    if(backend==='artifact'){await db.doc('tabelas/'+e).set({rows:rowsE,atualizado:Date.now()});existing.add(e)}
    else if(backend==='supabase'){const {error}=await sb.from('torre_tabelas').upsert({nome:e,rows:rowsE,atualizado:new Date().toISOString()});if(error)throw error}
    else if(backend==='local'){localStorage.setItem(LSK+'t:'+e,JSON.stringify(rowsE));localStorage.setItem(LSK+'tabelas',JSON.stringify(Object.keys(DATA)))}
  }catch(err){handleErr(err)}});
}
async function writeRow(e,row,isDel){
  row._atualizado=new Date().toISOString();
  if(!isDel){DATA[e]=DATA[e]||{};DATA[e][row.id]=row}else{delete (DATA[e]||{})[row.id]}
  render();
  if(dbState!=='ok'){toast(dbEmpty?'Grave a base inicial para salvar as alterações':'Modo demonstração: alteração não será salva',true);return}
  if(dbEmpty){dbEmpty=false;banner();for(const k of Object.keys(DATA))await persist(k);await writeCfg();return}
  if(backend==='artifact'&&!isDel&&existing.has(e)){return enqueue('t:'+e,async()=>{try{await db.doc('tabelas/'+e).update({rows:{[row.id]:row},atualizado:Date.now()})}catch(err){handleErr(err)}})}
  return persist(e);
}

async function writeCfg(){
  render();if(dbState!=='ok')return;
  const body={params:CFG.params,campos:CFG.campos};
  return enqueue('cfg',async()=>{try{
    if(backend==='artifact')await db.doc('config/geral').set({...body,atualizado:Date.now()});
    else if(backend==='supabase'){const {error}=await sb.from('torre_config').upsert({id:'geral',dados:body,atualizado:new Date().toISOString()});if(error)throw error}
    else if(backend==='local')localStorage.setItem(LSK+'config',JSON.stringify(body));
  }catch(err){handleErr(err)}});
}
function handleErr(err){
  const c=err&&err.code;
  if(c==='invalid_argument')toast('Sem permissão para gravar (ou registro muito grande).',true);
  else if(c==='quota_exceeded'||(err&&err.name==='QuotaExceededError'))toast('Limite de armazenamento atingido: '+(err.message||''),true);
  else toast('Falha ao salvar: '+(err&&err.message||c||'erro'),true);
}
function setPill(){

function applyLoaded(nd,cfg){
  if(Object.keys(nd).length){DATA=nd;dbEmpty=false}else{dbEmpty=true;if(!Object.keys(DATA).length)useSeedLocal()}
  if(cfg)CFG={params:{...DEF_PARAMS,...(cfg.params||{})},campos:cfg.campos||{}};
  loaded.tabelas=loaded.config=true;dbState='ok';setPill();banner();render();
}
async function initDB(){
  dbState='wait';setPill();
  const C=window.TORRE_CONFIG||{};
  // 1) banco do artefato (quando aberto no claude.ai)
  let api=null;
  if(window.claude&&typeof window.claude.use==='function'){try{api=await window.claude.use('db')}catch(e){api=null}}
  if(api){backend='artifact';db=api;
    const timer=setTimeout(()=>{if(!loaded.tabelas){dbState='off';setPill();banner()}},10000);
    db.collection('tabelas').onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer);dbState='ok';loaded.tabelas=true}
      if(snap.empty){if(!snap.metadata.fromCache){dbEmpty=true;if(!Object.keys(DATA).length)useSeedLocal()}}
      else{dbEmpty=false;existing=new Set();const nd={};snap.docs.forEach(d=>{const x=d.data()||{};nd[d.id]=JSON.parse(JSON.stringify(x.rows||{}));existing.add(d.id)});DATA=nd}
      setPill();banner();render();
    },()=>{clearTimeout(timer);dbState='off';setPill();banner();if(!Object.keys(DATA).length)useSeedLocal()});
    db.doc('config/geral').onSnapshot(s=>{if(s.exists){const x=JSON.parse(JSON.stringify(s.data()));CFG={params:{...DEF_PARAMS,...(x.params||{})},campos:x.campos||{}}}loaded.config=true;render()},()=>{});
    return}
  // 2) Supabase (GitHub Pages com config.js preenchido)
  if(C.supabaseUrl&&C.supabaseAnonKey&&window.supabase&&window.supabase.createClient){
    backend='supabase';
    try{sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey);
      const [t,c]=await Promise.all([sb.from('torre_tabelas').select('nome,rows'),sb.from('torre_config').select('dados').eq('id','geral').maybeSingle()]);
      if(t.error)throw t.error;
      const nd={};(t.data||[]).forEach(r=>{nd[r.nome]=r.rows||{}});
      applyLoaded(nd,c&&c.data?c.data.dados:null);
      try{sb.channel('torre').on('postgres_changes',{event:'*',schema:'public',table:'torre_tabelas'},p=>{const r=p.new;if(r&&r.nome){DATA[r.nome]=r.rows||{};dbEmpty=false;planCache.clear();if(!$('#modal').classList.contains('on'))render()}}).subscribe()}catch(e){}
    }catch(err){dbState='off';setPill();banner();toast('Supabase: '+(err.message||err),true);if(!Object.keys(DATA).length)useSeedLocal()}
    return}
  // 3) navegador (localStorage)
  try{localStorage.setItem(LSK+'teste','1');localStorage.removeItem(LSK+'teste');backend='local';
    const ks=JSON.parse(localStorage.getItem(LSK+'tabelas')||'[]');const nd={};ks.forEach(k=>{const v=localStorage.getItem(LSK+'t:'+k);if(v)nd[k]=JSON.parse(v)});
    const cf=localStorage.getItem(LSK+'config');applyLoaded(nd,cf?JSON.parse(cf):null);
  }catch(e){backend='demo';dbState='local';setPill();useSeedLocal()}
}
function useSeedLocal(){const s=buildSeed();DATA=s.data;if(!loaded.config)CFG=s.cfg;S.hora='12:15';$('#hTime').value=S.hora;banner();render()}

/* ================= motores de cálculo ================= */
const INT=()=>P('intervalo_min')||15;
function nowMin(){if(S.modo==='real'){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}return h2m(S.hora)??735}
function curva(r){return rows('curvas').filter(c=>c.refeicao===r).sort((a,b)=>h2m(a.inicio)-h2m(b.inicio))}
function janela(r){const c=curva(r);if(!c.length)return null;return [h2m(c[0].inicio),h2m(c[c.length-1].inicio)+INT()]}
function refAtual(){const n=nowMin();let best=null,bd=1e9;REF.forEach(r=>{const j=janela(r);if(!j)return;if(n>=j[0]&&n<j[1]){best=r;bd=-1}else if(bd>=0){const d=n<j[0]?j[0]-n:n-j[1]+600;if(d<bd){bd=d;best=r}}});return best||'Almoço'}
function prevPessoas(d,u,r){return sum(rows('previsoes').filter(x=>x.data===d&&x.unidade===u&&x.refeicao===r),x=>N(x.pessoas))}
function prepsAtivas(){return rows('preparacoes').filter(p=>p.ativo!=='Não').sort(by('id'))}
function kPorPessoa(p){return N(p.aceitacao)/100*N(p.gramatura_g)/1000*(N(p.fator_rep)||1)}
const planCache=new Map();
function plan(d,u,r){
  const key=d+'|'+u+'|'+r+'|'+Math.floor(nowMin());if(planCache.has(key))return planCache.get(key);
  const Pp=prevPessoas(d,u,r),cv=curva(r),now=d===S.date?nowMin():(d<S.date?1e9:-1e9);
  const cat=rows('catraca').filter(x=>x.data===d&&x.unidade===u&&x.refeicao===r);
  const iv=cv.map(c=>{const t=h2m(c.inicio);const m=cat.filter(x=>h2m(x.inicio)===t);return {t,prev:Pp*N(c.pct)/100,real:m.length?sum(m,x=>N(x.entradas)):null,band:m.length?sum(m,x=>N(x.bandejas)):null}});
  const done=iv.filter(i=>i.real!=null),sp=sum(done,i=>i.prev),sr=sum(done,i=>i.real);
  const fator=sp>0?sr/sp:1;
  iv.forEach(i=>i.proj=i.real!=null?i.real:i.prev*fator);
  const tr=P('tempo_reposicao_min'),mg=P('margem_pct')/100;
  const preps=prepsAtivas().map(p=>{const k=kPorPessoa(p),kc=N(p.kg_cuba)||1;
    const per=iv.map(i=>{const kg=i.proj*k,kgmin=kg/INT(),cubas=kg>0?Math.ceil(kg*(1+mg)/kc):0,dur=kgmin>0?kc/kgmin:Infinity;return {t:i.t,kg,kgmin,cubas,dur,aui:dur-tr}});
    const pico=per.reduce((a,b)=>b.kgmin>a.kgmin?b:a,per[0]||{kgmin:0,dur:Infinity,aui:Infinity,t:null});
    const proj=sum(iv,i=>i.proj);
    return {p,k,per,pico,kg:sum(per,x=>x.kg),kgPrev:Pp*k,cubas:sum(per,x=>x.cubas),porcoes:proj*N(p.aceitacao)/100*(N(p.fator_rep)||1),porcoesPrev:Pp*N(p.aceitacao)/100*(N(p.fator_rep)||1)}});
  const out={d,u,r,P:Pp,iv,fator,real:sr,prevAte:sp,proj:sum(iv,i=>i.proj),preps,now,temReal:done.length>0};
  planCache.set(key,out);return out;
}
function linha(d,u,r){
  const pl=plan(d,u,r),now=nowMin(),j=janela(r);
  const emServ=j&&now>=j[0]&&now<j[1];
  const cur=pl.iv.find(i=>now>=i.t&&now<i.t+INT());
  const lt=rows('leituras').filter(x=>x.data===d&&x.unidade===u&&x.refeicao===r&&h2m(x.hora)<=now);
  const rp=rows('reposicoes').filter(x=>x.data===d&&x.unidade===u&&x.refeicao===r);
  return pl.preps.map(pp=>{
    const l=lt.filter(x=>x.preparacao===pp.p.id).sort((a,b)=>h2m(b.hora)-h2m(a.hora))[0];
    const per=cur?pp.per.find(x=>x.t===cur.t):null;
    const kgmin=per?per.kgmin:0;
    const pend=rp.filter(x=>x.preparacao===pp.p.id&&x.status!=='Concluída'&&h2m(x.solicitacao)<=now);
    const repos=rp.filter(x=>x.preparacao===pp.p.id&&x.status==='Concluída'&&x.chegada&&h2m(x.chegada)<=now);
    let saldo=null,cob=null,esg=null,st='Sem leitura',cls='ne';
    if(l){const add=sum(repos.filter(x=>h2m(x.chegada)>h2m(l.hora)),x=>N(x.qtd_kg));saldo=Math.max(0,N(l.saldo_kg)+add-kgmin*Math.max(0,now-h2m(l.hora)));
      if(!emServ){st='Fora do serviço';cls='ne'}
      else if(kgmin<=0){st='OK';cls='ok';cob=Infinity}
      else{cob=saldo/kgmin;esg=now+cob;
        if(saldo<=0.05){st='Ruptura';cls='cr'}
        else if(cob<P('tempo_reposicao_min')){st=pend.length?'Risco — reposição a caminho':'Risco de ruptura';cls='cr'}
        else if(cob<P('cobertura_alvo_min')){st='Atenção';cls='at'}
        else{st='OK';cls='ok'}}}
    return {...pp,l,saldo,cob,esg,st,cls,kgmin,pend,porcMin:kgmin/(N(pp.p.gramatura_g)/1000||1)};
  });
}
function statusUnidade(d,u,r){const L=linha(d,u,r);if(L.some(x=>x.cls==='cr'))return 'cr';if(L.some(x=>x.cls==='at'))return 'at';return L.some(x=>x.l)?'ok':'ne'}
function saldoInsumo(id){return sum(rows('lotes').filter(l=>l.insumo===id&&l.status!=='Bloqueado'),l=>N(l.qtd))}
function estoque(){
  return rows('insumos').sort(by('id')).map(i=>{const s=saldoInsumo(i.id),c=N(i.consumo_dia),cob=c>0?s/c:Infinity,seg=N(i.seg_dias)||3;
    const futuros=rows('pedidos').filter(p=>p.insumo===i.id&&!['Recebido','Cancelado'].includes(p.status));
    const proj=[];let sal=s;for(let k=0;k<=14;k++){const dd=addDays(S.date,k);if(k>0)sal-=c;sal+=sum(futuros.filter(p=>p.data_prevista===dd),p=>N(p.qtd));proj.push(Math.max(0,c>0?sal/c:0))}
    const st=cob<seg/2?'cr':cob<seg?'at':'ok';
    return {i,s,c,cob,seg,st,futuros,proj,emPedido:sum(futuros,p=>N(p.qtd))}});
}
function pedidoAtrasado(p){return !['Recebido','Cancelado'].includes(p.status)&&p.data_prevista&&p.data_prevista<S.date}

function alertas(){
  const A=[],d=S.date,now=nowMin();
  const add=(nv,etapa,txt,acao,tab,sub)=>A.push({nv,etapa,txt,acao,tab,sub});
  // distribuição em tempo real
  REF.forEach(r=>{const j=janela(r);if(!j||now<j[0]-60||now>j[1])return;
    unidadesServico().forEach(u=>{const pl=plan(d,u.id,r);if(!pl.P)return;
      linha(d,u.id,r).forEach(x=>{if(x.cls==='cr')add(3,'Distribuição',`${x.p.nome} em ${u.nome}: ${x.st.toLowerCase()} (${x.cob!=null&&isFinite(x.cob)?fmt(x.cob,0)+' min de cobertura':'sem saldo'})`,x.pend.length?'Acompanhar reposição':'Repor agora','operacao')});
      if(pl.temReal&&Math.abs(pl.fator-1)*100>P('tolerancia_prev_pct'))add(pl.fator>1?3:1,'Demanda',`${u.nome} (${r}): demanda ${pl.fator>1?'+':''}${fmt((pl.fator-1)*100,0)}% vs previsão — projeção ${fmt(pl.proj)} pessoas (previsto ${fmt(pl.P)})`,pl.fator>1?'Replanejar produção e reposição':'Reduzir produção restante','planejamento');
    });
    if(r===refAtual())prepsAtivas().forEach(p=>{const us=unidadesServico().map(u=>({u,pp:plan(d,u.id,r).preps.find(x=>x.p.id===p.id)})).filter(x=>x.pp&&x.pp.pico.kg>0&&x.pp.pico.aui<0);
      if(us.length){const w=us.reduce((a,b)=>b.pp.pico.dur<a.pp.pico.dur?b:a);add(2,'Distribuição',`${p.nome}: no pico a cuba dura menos que a reposição (${fmt(P('tempo_reposicao_min'))} min) em ${us.length} unidade(s) — pior: ${w.u.nome}, ${fmt(w.pp.pico.dur,1)} min`,'Manter 2 cubas ou buffer pronto','planejamento')}});
  });
  // produção x demanda
  rows('ordens').filter(o=>o.data===d).forEach(o=>{const st=ordemStatus(o);if(st==='Atrasada'||st==='Deveria ter iniciado')add(2,'Produção',`${o.id} (${nm('preparacoes',o.preparacao)}): ${st.toLowerCase()} — término previsto ${o.fim_prev||'—'}`,'Acompanhar produção','producao');
    const dem=demandaPrep(d,o.preparacao,o.refeicao);if(N(o.planejado)>0&&dem>N(o.planejado)*(1+P('tolerancia_prev_pct')/100)&&o.status!=='Cancelada'){const p=get('preparacoes',o.preparacao)||{};add(3,'Produção',`${nm('preparacoes',o.preparacao)}: demanda projetada ${fmt(dem)} porções vs ordem ${fmt(N(o.planejado))} — faltam ${fmt(dem-N(o.planejado))}`,`Liberar reforço (mín. ${fmt(N(p.tempo_prod))} min)`,'producao')}});
  REF.forEach(r=>unidadesServico().forEach(u=>{const pl=plan(d,u.id,r);if(!pl.temReal||pl.fator<=1+P('tolerancia_prev_pct')/100)return;const gaps=pl.preps.map(pp=>({pp,g:pp.porcoes-pp.porcoesPrev})).filter(x=>x.g>=1).sort((a,b)=>b.g-a.g);
    if(gaps.length)add(3,'Produção',`Reforço para ${u.nome} (${r}): ${gaps.slice(0,3).map(x=>`${x.pp.p.nome} +${fmt(x.g)} porç. (${fmt(x.g*N(x.pp.p.gramatura_g)/1000,1)} kg)`).join(', ')}${gaps.length>3?'…':''}`,'Liberar reforço','producao')}));
  rows('expedicoes').filter(x=>x.data===d).forEach(x=>{const s=expStatus(x);if(s==='Atrasada')add(2,'Logística',`${x.id} → ${nm('unidades',x.destino)}: chegada prevista ${x.chegada_prev}, ainda sem registro`,'Acompanhar rota','logistica');if(x.romaneio==='Não'&&x.chegada_real)add(1,'Logística',`${x.id} → ${nm('unidades',x.destino)} sem romaneio conferido (quebra de rastreabilidade)`,'Registrar romaneio','logistica')});
  rows('degelo').forEach(x=>{const s=degeloStatus(x);if(s==='Atrasado')add(2,'Degelo',`${x.lote||x.id} ${nm('insumos',x.insumo)} (${fmt(N(x.qtd))} kg): liberação prevista ${dtBR(x.liberacao)} não confirmada`,'Verificar degelo / liberação sanitária','degelo')});
  estoque().forEach(e=>{if(e.st!=='ok')add(e.st==='cr'?3:2,'Estoque',`${e.i.nome}: cobertura de ${fmt(e.cob,1)} dias (segurança ${fmt(e.seg)} dias)${e.emPedido?' — '+fmt(e.emPedido)+' '+(e.i.um||'kg')+' em pedido':''}`,e.emPedido?'Confirmar entrega':'Antecipar compra','estoque')});
  rows('lotes').forEach(l=>{const dv=daysBetween(d,l.validade||'2999-01-01');if(l.validade&&dv<=2&&l.status!=='Bloqueado'&&N(l.qtd)>0)add(dv<0?3:2,'Estoque',`Lote ${l.id} (${nm('insumos',l.insumo)}) ${dv<0?'vencido':'vence em '+dv+' dia(s)'}`,dv<0?'Bloquear lote':'Uso prioritário (PVPS)','estoque')});
  rows('pedidos').filter(pedidoAtrasado).forEach(p=>add(2,'Suprimentos',`Pedido ${p.id} (${nm('fornecedores',p.fornecedor)}) atrasado desde ${dBR(p.data_prevista)}`,'Cobrar fornecedor','suprimentos'));
  rows('anomalias').filter(a=>a.data===d&&!['Tratada','Encerrada'].includes(a.status)).forEach(a=>add(3,'Anomalia',`${a.tipo} — ${nm('unidades',a.unidade)}${a.preparacao?' ('+nm('preparacoes',a.preparacao)+')':''} ${a.inicio||''}${a.fim?'–'+a.fim:''}`,'Investigar','anomalias',a.id));
  return A.sort((a,b)=>b.nv-a.nv);
}

const COL=['#22c55e','#3b82f6','#eab308','#a855f7','#06b6d4','#f97316','#ef4444','#ec4899'];
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function chart({labels,bars=[],lines=[],h=200,ref=null,yfmt=v=>fmt(v),y2fmt=v=>fmt(v),stacked=false,marker=null}){
  const W=640,pl=44,pr=lines.some(l=>l.y2)?44:10,pt=12,pb=26,iw=W-pl-pr,ih=h-pt-pb,n=labels.length||1;
  const bvals=stacked?labels.map((_,i)=>sum(bars,b=>b.v[i]||0)):bars.flatMap(b=>b.v);
  const lv1=lines.filter(l=>!l.y2).flatMap(l=>l.v.filter(x=>x!=null));
  const mx=niceMax(Math.max(1,...bvals,...lv1,ref?ref.v:0));
  const lv2=lines.filter(l=>l.y2).flatMap(l=>l.v.filter(x=>x!=null));const mx2=niceMax(Math.max(1,...lv2));
  const X=i=>pl+iw*(i+.5)/n,Y=v=>pt+ih-ih*v/mx,Y2=v=>pt+ih-ih*v/mx2;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid meet">`;
  for(let k=0;k<=4;k++){const v=mx*k/4,y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#1d3552" stroke-dasharray="${k?'3 3':''}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${yfmt(v)}</text>`;if(lv2.length)s+=`<text x="${W-pr+6}" y="${Y2(mx2*k/4)+3}">${y2fmt(mx2*k/4)}</text>`}
  const step=Math.ceil(n/12);labels.forEach((l,i)=>{if(i%step===0)s+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`});
  const bw=Math.min(34,iw/n*.72),gb=stacked?1:Math.max(1,bars.length);
  labels.forEach((_,i)=>{let acc=0;bars.forEach((b,j)=>{const v=b.v[i]||0;if(stacked){const y=Y(acc+v),hh=Y(acc)-y;s+=`<rect x="${X(i)-bw/2}" y="${y}" width="${bw}" height="${Math.max(0,hh)}" fill="${b.c}" rx="2"><title>${esc(b.n)}: ${yfmt(v)}</title></rect>`;acc+=v}else{const w=bw/gb,x=X(i)-bw/2+j*w;s+=`<rect x="${x+1}" y="${Y(v)}" width="${Math.max(1,w-2)}" height="${Math.max(0,pt+ih-Y(v))}" fill="${b.c}" rx="2"><title>${esc(labels[i])} · ${esc(b.n)}: ${yfmt(v)}</title></rect>`}})});
  if(ref)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(ref.v)}" y2="${Y(ref.v)}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-pr-4}" y="${Y(ref.v)-4}" text-anchor="end" style="fill:#fca5a5">${esc(ref.l)}</text>`;
  if(marker!=null&&marker>=0&&marker<n)s+=`<line x1="${X(marker)}" x2="${X(marker)}" y1="${pt}" y2="${pt+ih}" stroke="#eab308" stroke-dasharray="4 3"/><text x="${X(marker)+4}" y="${pt+9}" style="fill:#facc15">agora</text>`;
  lines.forEach(l=>{const yy=l.y2?Y2:Y;const pts=l.v.map((v,i)=>v==null?null:[X(i),yy(v)]);let d='';pts.forEach((p,i)=>{if(!p)return;d+=(d&&pts[i-1]?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)});
    s+=`<path d="${d}" fill="none" stroke="${l.c}" stroke-width="2.2" ${l.dash?'stroke-dasharray="5 4"':''}/>`;pts.forEach((p,i)=>{if(p)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="${l.c}"><title>${esc(labels[i])} · ${esc(l.n)}: ${(l.y2?y2fmt:yfmt)(l.v[i])}</title></circle>`})});
  return s+'</svg>';
}
function legend(items){return `<div class="leg">${items.map(i=>`<span><i style="background:${i.c}"></i>${esc(i.n)}</span>`).join('')}</div>`}
function donut(parts,center,sub){const W=180,r=62,c=2*Math.PI*r;let off=0;const tot=sum(parts,p=>p.v)||1;
  let s=`<svg viewBox="0 0 ${W} ${W}" style="width:160px;height:160px;flex:none"><circle cx="90" cy="90" r="${r}" fill="none" stroke="#1a2c44" stroke-width="18"/>`;
  parts.forEach(p=>{const L=c*p.v/tot;s+=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${L} ${c-L}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(p.n)}: ${fmt(p.v)}</title></circle>`;off+=L});
  return s+`<text x="90" y="92" text-anchor="middle" style="fill:#e2ecf6;font-size:26px;font-weight:800">${esc(center)}</text><text x="90" y="112" text-anchor="middle" style="fill:#8ea3bb;font-size:11px">${esc(sub||'')}</text></svg>`}
function meter(v,cls){return `<div class="bar ${cls||''}"><i style="width:${Math.max(0,Math.min(100,v*100))}%"></i></div>`}
function gantt(items,from,to,lanes){/* items:{lane,a,b,label,cls} em minutos */
  const W=640,lw=96,rowH=26,h=lanes.length*rowH+30,iw=W-lw-10,X=m=>lw+iw*(m-from)/(to-from);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}">`;
  for(let m=Math.ceil(from/120)*120;m<=to;m+=120){s+=`<line x1="${X(m)}" x2="${X(m)}" y1="4" y2="${h-22}" stroke="#1d3552"/><text x="${X(m)}" y="${h-8}" text-anchor="middle">${m2h(m)}${m>=1440?'+1':''}</text>`}
  lanes.forEach((l,i)=>{s+=`<text x="4" y="${i*rowH+20}" style="fill:#cbd5e1">${esc(String(l).slice(0,15))}</text>`});
  const C={ok:'#16a34a',at:'#ca8a04',cr:'#dc2626',in:'#2563eb',ne:'#475569'};
  items.forEach(it=>{const i=lanes.indexOf(it.lane);if(i<0)return;const a=Math.max(from,it.a),b=Math.min(to,it.b);if(b<=a)return;s+=`<rect x="${X(a)}" y="${i*rowH+7}" width="${X(b)-X(a)}" height="18" rx="4" fill="${C[it.cls]||C.in}"><title>${esc(it.label)}</title></rect><text x="${X(a)+4}" y="${i*rowH+20}" style="fill:#fff;font-size:9.5px">${esc(it.label.slice(0,Math.max(0,Math.floor((X(b)-X(a))/5.6))))}</text>`});
  const n=nowMin();if(n>=from&&n<=to)s+=`<line x1="${X(n)}" x2="${X(n)}" y1="2" y2="${h-22}" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${X(n)+3}" y="${h-24}" style="fill:#facc15">agora ${m2h(n)}</text>`;
  return s+'</svg>'}

   stage('Consumo','consumo',pls.some(p=>p.temReal&&Math.abs(p.fator-1)*100>P('tolerancia_prev_pct'))?'at':'ok',pls.some(p=>p.temReal)?'Em andamento':'Aguardando')].join('');
  const cards=us.map((u,i)=>{const st=stDist[i],pl=pls[i],Lu=linha(d,u.id,r).filter(x=>x.l&&isFinite(x.cob));const cm=Lu.length?sum(Lu,x=>Math.max(0,x.cob))/Lu.length:null;
    const ru=rp.filter(x=>x.unidade===u.id);const tr=ru.length?sum(ru,x=>h2m(x.chegada)-h2m(x.solicitacao))/ru.length:null;
    return `<div class="uc ${st}" data-a="unitop" data-v="${u.id}"><h4>🍽️ ${esc(u.nome)}</h4><div style="margin-bottom:6px">${st==='cr'?B('cr','Risco / ruptura'):st==='at'?B('at','Atenção'):st==='ok'?B('ok','Operação normal'):B('ne','Sem leitura')}</div>
    <div class="mu">Serviço: <b style="color:var(--tx)">${r}</b> · Pessoas: <b style="color:var(--tx)">${fmt(pl.real)}</b> / ${fmt(pl.P)}</div>
    <div class="mu">Cobertura média: <b style="color:var(--tx)">${cm==null?'—':fmt(cm,0)+' min'}</b> · Reposição: <b style="color:var(--tx)">${tr==null?'—':fmt(tr,1)+' min'}</b></div>
    <div style="margin-top:7px">${meter(pl.P?pl.real/pl.P:0,st==='cr'?'r':st==='at'?'y':'')}</div></div>`}).join('');
  const labels=pls[0]?pls[0].iv.map(i=>m2h(i.t)):[];
  const prevS=labels.map((_,k)=>sum(pls,p=>p.iv[k]?p.iv[k].prev:0)),realS=labels.map((_,k)=>pls.some(p=>p.iv[k]&&p.iv[k].real!=null)?sum(pls,p=>p.iv[k]&&p.iv[k].real||0):null);
  let ac1=0,ac2=0;const prevAc=prevS.map(v=>ac1+=v),realAc=realS.map(v=>v==null?null:(ac2+=v));
  const mk=pls[0]?pls[0].iv.findIndex(i=>nowMin()>=i.t&&nowMin()<i.t+INT()):-1;

  return head('Visão Geral','Planejamento • Execução • Monitoramento • Previsão • Decisão')+
  `<div class="kpis">${K('🍽️','g','Pessoas previstas hoje',fmt(prevDia),`Catraca até agora: ${fmt(realDia)}`)}${K('📊','b',`Demanda projetada (${r})`,fmt(projR),prevR?`Previsto ${fmt(prevR)} · ${projR>=prevR?'+':''}${fmt((projR/prevR-1)*100,1)}%`:'Sem previsão')}${K('👨‍🍳','c','Produção do dia',`${fmt(sum(ops,o=>N(o.produzido)))}`,`Planejado ${fmt(sum(ops,o=>N(o.planejado)))} porções`)}${K('🛡️','g','Disponibilidade na linha',disp==null?'—':pct(disp,0),'Preparações sem risco de ruptura')}${K('⚠️','r','Ocorrências no dia',fmt(anD.length),anD.filter(a=>a.tipo==='Parada de rampa').length+' parada(s) de rampa')}${K('⏱️','pu','Tempo médio de reposição',trep==null?'—':fmt(trep,1)+' min',`SLA ≤ ${fmt(P('sla_reposicao_min'))} min`)}</div>
  <div class="card" style="margin-bottom:12px"><h3>Fluxo do processo (status agora)</h3><div class="flow">${flow}</div></div>
  <div class="row c2"><div class="card"><h3>Operação em tempo real — unidades<span class="sp"></span><span class="mu act">${r} · ${m2h(nowMin())}</span></h3><div class="units">${cards||'<div class="empty">Cadastre unidades.</div>'}</div></div>
  ${cardT(`🔔 Alertas e ações prioritárias (${A.length})`,alertList(A,5),`<button class="btn sm act" data-a="nav" data-v="operacao">Ver todos</button>`,'alert')}</div>
  <div class="row c3"><div class="card"><h3>Demanda vs consumo acumulado (${r})</h3>${legend([{n:'Previsto',c:'#3b82f6'},{n:'Real (catraca)',c:'#22c55e'}])}${chart({labels,lines:[{n:'Previsto',v:prevAc,c:'#3b82f6',dash:true},{n:'Real',v:realAc,c:'#22c55e'}],marker:mk})}</div>
  <div class="card"><h3>Estoque — itens críticos<span class="sp"></span><button class="btn sm act" data-a="nav" data-v="estoque">Ver estoque</button></h3><table class="t"><thead><tr><th>Insumo</th><th class="n">Saldo</th><th class="n">Cobertura</th><th>Status</th></tr></thead><tbody>${(crit.length?crit:est.slice(0,5)).map(e=>`<tr class="cl" data-a="edit" data-e="insumos" data-id="${e.i.id}"><td>${esc(e.i.nome)}</td><td class="n">${fmt(e.s)} ${esc(e.i.um||'kg')}</td><td class="n ${e.st==='cr'?'r':e.st==='at'?'y':'g'}"><b>${fmt(e.cob,1)} dias</b></td><td>${B(e.st,e.st==='ok'?'OK':e.st==='at'?'Atenção':'Crítico')}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h3>🔎 Investigação da ocorrência${an?' — '+esc(an.id):''}</h3>${an?invMini(an):'<div class="empty">Nenhuma parada de rampa registrada.</div>'}</div></div>`;
};
function invMini(a){const ev=investigar(a);return `<div class="mu" style="margin-bottom:6px"><b style="color:#fca5a5">${esc(a.tipo)} — ${esc(nm('unidades',a.unidade))}</b> · ${dBR(a.data)} ${a.inicio||''}–${a.fim||''} · ${esc(nm('preparacoes',a.preparacao))}</div>

V['operacao']=()=>{
  const d=S.date,us=unidadesServico(),r=S.ref||refAtual();if(!S.unitOp&&us[0])S.unitOp=us[0].id;const u=get('unidades',S.unitOp)||us[0];
  if(!u)return head('Operação','Cadastre unidades em Cadastros.');
  const L=linha(d,u.id,r),pl=plan(d,u.id,r);
  const pls=us.map(x=>plan(d,x.id,r));
  const rp=rows('reposicoes').filter(x=>x.data===d&&x.unidade===u.id&&x.refeicao===r);
  const rpt=rp.filter(x=>x.chegada);
  const crit=L.filter(x=>x.cls==='cr').sort((a,b)=>(a.cob??0)-(b.cob??0))[0];
  const sel=us.map(x=>{const st=statusUnidade(d,x.id,r);return `<div class="uc ${x.id===u.id?'':''} ${st}" style="${x.id===u.id?'outline:2px solid #22c55e':''}" data-a="unitop" data-v="${x.id}"><span class="dot ${st==='cr'?'r':st==='at'?'y':st==='ok'?'':'gray'}" style="display:inline-block;margin-right:6px"></span><b>${esc(x.nome)}</b></div>`}).join('');
  const now=nowMin();
  const rowsL=L.map(x=>`<tr class="cl" data-a="newleitura" data-v="${x.p.id}"><td><b>${esc(x.p.nome)}</b></td><td class="n">${x.l?fmt(N(x.l.cubas)||0):'—'}</td><td class="n">${x.saldo==null?'—':fmt(x.saldo,1)+' kg'}</td><td class="n">${fmt(x.kgmin,2)} kg/min<br><span class="mu">${fmt(x.porcMin,1)} porç/min</span></td><td class="n ${x.cls==='cr'?'r':x.cls==='at'?'y':'g'}"><b>${x.cob==null?'—':isFinite(x.cob)?fmt(x.cob,0)+' min':'∞'}</b></td><td>${x.esg&&isFinite(x.esg)?m2h(x.esg):'—'}</td><td>${x.pend.length?B('at','Pedida '+x.pend[0].solicitacao):'—'}</td><td>${B(x.cls,x.st)}</td></tr>`).join('');
  // projeção de cobertura da preparação crítica
  let proj='';if(crit&&crit.saldo!=null){const pts=[],labs=[];for(let k=-15;k<=20;k+=5){const t=now+k;labs.push(m2h(t));const per=crit.per.find(x=>t>=x.t&&t<x.t+INT());const km=per?per.kgmin:crit.kgmin;pts.push(Math.max(0,crit.saldo-km*k))}
    proj=`${legend([{n:'Saldo projetado (kg)',c:'#22c55e'}])}${chart({labels:labs,lines:[{n:'Saldo',v:pts,c:'#22c55e'}],ref:{v:0.0001,l:'esgota'},yfmt:v=>fmt(v,1),marker:3})}<div class="hint">${esc(crit.p.nome)}: esgotamento previsto às <b class="r">${m2h(crit.esg)}</b> (em ${fmt(Math.max(0,crit.cob),0)} min). Reposição leva ${fmt(P('tempo_reposicao_min'))} min → AUI = <b class="${crit.cob-P('tempo_reposicao_min')<0?'r':'g'}">${fmt(crit.cob-P('tempo_reposicao_min'),1)} min</b>.</div>`}
  else proj='<div class="empty">✅ Nenhuma preparação em risco nesta unidade.</div>';
  const labels=pl.iv.map(i=>m2h(i.t)),mk=pl.iv.findIndex(i=>now>=i.t&&now<i.t+INT());
  const acts=[];if(crit){acts.push([crit.pend.length?'Acompanhar reposição já pedida de '+crit.p.nome:`Liberar reposição de ${fmt(Math.max(N(crit.p.kg_cuba),crit.kgmin*P('cobertura_alvo_min')),1)} kg de ${crit.p.nome}`,'Imediata','r']);acts.push(['Confirmar disponibilidade pronta na produção / pass-through','Agora','y'])}
  if(pl.temReal&&pl.fator>1+P('tolerancia_prev_pct')/100)acts.push([`Demanda ${fmt((pl.fator-1)*100,0)}% acima: reprojetar cubas para o restante do serviço`,'Agora','y']);
  acts.push(['Monitorar consumo nos próximos 10 minutos','Acompanhar','bl']);
  const oc=rows('anomalias').filter(a=>a.data===d&&a.unidade===u.id);
  const ivs=pl.iv;const steps=ivs.filter((_,k)=>k%2===0).map(i=>`<div class="tl ${i.t+INT()<=now?'done':i.t<=now?'now':''}"><div class="o"></div><b>${m2h(i.t)}</b><div class="mu">${fmt(i.real!=null?i.real:i.proj)} pessoas</div></div>`).join('');
  return head('Operação — tempo real da distribuição','Linhas de serviço, cubas, cobertura, consumo e reposições',`<div class="ctl">${refSel()}</div>`)+
  `<div class="kpis">${K('🍽️','g','Pessoas atendidas (todas)',fmt(sum(pls,p=>p.real)),`de ${fmt(sum(pls,p=>p.P))} previstas (${pct(sum(pls,p=>p.real)/(sum(pls,p=>p.P)||1),0)})`)}${K('📈','b','Projeção do serviço',fmt(sum(pls,p=>p.proj)),'corrigida pelo consumo real')}${K('🕐','pu','Pico de atendimento',(()=>{const iv=pl.iv.reduce((a,b)=>b.proj>a.proj?b:a,pl.iv[0]||{t:0});return m2h(iv.t)+'–'+m2h(iv.t+INT())})(),'na unidade selecionada')}${K('⏱️','c','Reposição média',rpt.length?fmt(sum(rpt,x=>h2m(x.chegada)-h2m(x.solicitacao))/rpt.length,1)+' min':'—',`Meta ≤ ${fmt(P('sla_reposicao_min'))} min`)}${K('⚠️','o','Ocorrências no serviço',fmt(oc.length),oc.filter(a=>a.tipo==='Parada de rampa').length+' parada(s) de rampa')}${K('🛡️','g','Cobertura das preparações',pct(L.filter(x=>x.l).length?L.filter(x=>x.l&&x.cls!=='cr').length/L.filter(x=>x.l).length:0,0),'sem risco de ruptura')}</div>
  <div class="row opg" style="grid-template-columns:minmax(180px,230px) 1fr"><div class="card"><h3>Selecione a unidade</h3><div class="grid">${sel}</div></div>
  <div class="card"><h3>${esc(u.nome)} — linhas de serviço (${r})<span class="sp"></span><span class="mu act">Atualizado ${m2h(now)}</span>${addBtn('leituras','+ Leitura de linha')}${addBtn('reposicoes','+ Reposição')}</h3>
  <div class="tw"><table class="t"><thead><tr><th>Preparação</th><th class="n">Cubas</th><th class="n">Saldo pronto</th><th class="n">Consumo agora</th><th class="n">Cobertura</th><th>Esgota às</th><th>Reposição</th><th>Status</th></tr></thead><tbody>${rowsL}</tbody></table></div>
  <div class="hint">Saldo = última leitura + reposições recebidas − consumo desde a leitura. Consumo = pessoas no intervalo (catraca) × taxa de escolha × gramatura × repetição. Clique numa linha para registrar nova leitura.</div></div></div>
  <div class="row c3"><div class="card"><h3>Previsão de cobertura${crit?' — '+esc(crit.p.nome):''}</h3>${proj}</div>
  <div class="card"><h3>Demanda x atendimento — ${esc(u.nome)}</h3>${legend([{n:'Previsto',c:'#3b82f6'},{n:'Real',c:'#22c55e'}])}${chart({labels,bars:[{n:'Previsto',v:pl.iv.map(i=>i.prev),c:'#3b82f6'},{n:'Real',v:pl.iv.map(i=>i.real||0),c:'#22c55e'}],marker:mk})}</div>
  <div class="card alert"><h3>⚡ Ações recomendadas (tempo real)</h3>${acts.map((a,i)=>`<div class="al ${a[2]==='r'?'cr':a[2]==='y'?'at2':'in2'}"><div class="ai"><b>${i+1}</b></div><div class="at"><b>${esc(a[0])}</b></div>${B(a[2]==='r'?'cr':a[2]==='y'?'at':'in',a[1])}</div>`).join('')}</div></div>
  <div class="row c3"><div class="card"><h3>Linha do tempo da operação</h3><div class="timeline">${steps}</div></div>
  <div class="card"><h3>Reposições — ${esc(u.nome)}</h3>${table('reposicoes',rp.sort(by('solicitacao')),['preparacao','solicitacao','chegada','qtd_kg','status'],{sm:true})}</div>
  <div class="card"><h3>Ocorrências do dia</h3>${oc.length?oc.map(a=>`<div class="al cr" data-a="investigar" data-v="${esc(a.id)}" style="cursor:pointer"><div class="ai">⚠️</div><div class="at"><b>${esc(a.tipo)} — ${esc(nm('preparacoes',a.preparacao))}</b><span>${a.inicio||''}–${a.fim||''} · ${esc(a.status)}</span></div></div>`).join(''):'<div class="empty">Nenhuma.</div>'}<div style="margin-top:6px">${addBtn('anomalias','+ Registrar ocorrência')}</div></div></div>`;
};

V['planejamento']=()=>{
  const d=S.date,us=unidadesServico(),r=S.ref||refAtual();const u=get('unidades',S.unit)||null;
  const target=u?[u]:us;
  const pls=target.map(x=>plan(d,x.id,r));
  const P0=sum(pls,p=>p.P),proj=sum(pls,p=>p.proj);
  const preps=prepsAtivas();
  const agg=preps.map(p=>{const list=pls.map(pl=>pl.preps.find(x=>x.p.id===p.id)).filter(Boolean);return {p,kg:sum(list,x=>x.kg),kgPrev:sum(list,x=>x.kgPrev),cubas:sum(list,x=>x.cubas),porc:sum(list,x=>x.porcoes),minDur:Math.min(...list.map(x=>x.pico.dur)),picoT:(list[0]||{}).pico?.t}});
  const ivs=(pls[0]||{iv:[]}).iv;
  const cubTab=`<div class="tw"><table class="t"><thead><tr><th>Preparação</th>${ivs.map(i=>`<th class="n">${m2h(i.t)}</th>`).join('')}<th class="n">Total kg</th><th class="n">Cubas</th><th class="n">Cuba dura (pico)</th><th class="n">AUI</th></tr></thead><tbody>${agg.map(a=>{const list=pls.map(pl=>pl.preps.find(x=>x.p.id===a.p.id));const aui=a.minDur-P('tempo_reposicao_min');
    return `<tr class="cl" data-a="edit" data-e="preparacoes" data-id="${a.p.id}"><td><b>${esc(a.p.nome)}</b><br><span class="mu">${fmt(N(a.p.gramatura_g))} g · ${fmt(N(a.p.aceitacao))}% · cuba ${fmt(N(a.p.kg_cuba),1)} kg</span></td>${ivs.map((_,k)=>{const kg=sum(list,x=>x?x.per[k].kg:0),cb=sum(list,x=>x?x.per[k].cubas:0);return `<td class="n">${fmt(kg,1)}<br><span class="mu">${cb} cuba${cb!==1?'s':''}</span></td>`}).join('')}<td class="n"><b>${fmt(a.kg,1)}</b></td><td class="n"><b>${fmt(a.cubas)}</b></td><td class="n">${isFinite(a.minDur)?fmt(a.minDur,1)+' min':'—'}</td><td class="n">${isFinite(aui)?B(aui<0?'cr':aui<3?'at':'ok',(aui>=0?'+':'')+fmt(aui,1)+' min'):'—'}</td></tr>`}).join('')}</tbody></table></div>`;
  const ex=agg.find(a=>a.p.grupo==='Proteína')||agg[0];const exPl=pls[0]&&ex?pls[0].preps.find(x=>x.p.id===ex.p.id):null;
  const calc=exPl?(()=>{const pk=exPl.pico,ivk=pls[0].iv.find(i=>i.t===pk.t);return `<div class="calc">Exemplo — ${esc(ex.p.nome)} em ${esc(target[0].nome)}, intervalo ${m2h(pk.t)}:<br>
  pessoas = ${fmt(ivk?ivk.proj:0)} · escolha ${fmt(N(ex.p.aceitacao))}% · porção ${fmt(N(ex.p.gramatura_g))} g · repetição ×${fmt(N(ex.p.fator_rep)||1,2)}<br>
  kg = ${fmt(ivk?ivk.proj:0)} × ${fmt(N(ex.p.aceitacao)/100,2)} × ${fmt(N(ex.p.gramatura_g)/1000,3)} × ${fmt(N(ex.p.fator_rep)||1,2)} = <b>${fmt(pk.kg,1)} kg</b> em ${INT()} min → ${fmt(pk.kgmin,2)} kg/min<br>
  cubas = ⌈${fmt(pk.kg,1)} × (1 + ${fmt(P('margem_pct'))}%) ÷ ${fmt(N(ex.p.kg_cuba),1)} kg⌉ = <b>${pk.cubas}</b> · cada cuba dura ${fmt(pk.dur,1)} min<br>
  AUI = ${fmt(pk.dur,1)} − ${fmt(P('tempo_reposicao_min'))} min de reposição = <b class="${pk.aui<0?'r':'g'}">${fmt(pk.aui,1)} min</b> ${pk.aui<0?'→ manter 2 cubas na linha ou buffer pronto':''}</div>`})():'';
  const labels=ivs.map(i=>m2h(i.t));
  const prevRows=rows('previsoes').filter(x=>x.data>=d&&x.data<=addDays(d,7)&&(!u||x.unidade===u.id)).sort((a,b)=>(a.data+a.unidade+a.refeicao).localeCompare(b.data+b.unidade+b.refeicao));
  const days=[...Array(8)].map((_,k)=>addDays(d,k-1));
  const capDia=days.map(dd=>sum(rows('previsoes').filter(x=>x.data===dd),x=>N(x.pessoas)));
  return head('Planejamento','Previsão de demanda → quantidade de cubas e quilos por cuba, por intervalo de entrada',`<div class="ctl">${unitSel()}${refSel()}</div>`)+
  `<div class="kpis">${K('👥','b','Pessoas previstas',fmt(P0),`${r} · ${u?esc(u.nome):'todas as unidades'}`)}${K('📈','g','Projeção corrigida',fmt(proj),pls.some(p=>p.temReal)?`fator real/previsto ${fmt(proj/(P0||1),2)}`:'sem consumo real ainda')}${K('⚖️','c','Alimento necessário',fmt(sum(agg,a=>a.kg),0)+' kg',`previsto ${fmt(sum(agg,a=>a.kgPrev),0)} kg`)}${K('🥘','pu','Cubas no serviço',fmt(sum(agg,a=>a.cubas)),`margem ${fmt(P('margem_pct'))}%`)}${K('⚠️','r','Preparações com AUI < 0',fmt(agg.filter(a=>a.minDur-P('tempo_reposicao_min')<0).length),'cuba esgota antes da reposição')}</div>
  <div class="card" style="margin-bottom:12px"><h3>🥘 Plano de cubas e quilos por intervalo (${r})<span class="sp"></span><span class="mu act">kg necessários · cubas por intervalo</span></h3>${cubTab}${calc}<div class="hint">Os intervalos já passados usam a catraca real; os futuros usam a previsão × curva de entrada, corrigida pelo desvio real/previsto do serviço. Edite gramatura, taxa de escolha e capacidade da cuba em Cadastros → Preparações; a curva em Cadastros → Curva de entrada.</div></div>
  <div class="row c2"><div class="card"><h3>Curva de entrada × projeção (pessoas por intervalo)</h3>${legend([{n:'Previsto',c:'#3b82f6'},{n:'Real (catraca)',c:'#22c55e'},{n:'Projeção',c:'#eab308'}])}${chart({labels,bars:[{n:'Previsto',v:ivs.map((_,k)=>sum(pls,p=>p.iv[k].prev)),c:'#3b82f6'},{n:'Real',v:ivs.map((_,k)=>sum(pls,p=>p.iv[k].real||0)),c:'#22c55e'}],lines:[{n:'Projeção',v:ivs.map((_,k)=>sum(pls,p=>p.iv[k].proj)),c:'#eab308'}],marker:ivs.findIndex(i=>nowMin()>=i.t&&nowMin()<i.t+INT())})}</div>
  <div class="card"><h3>Demanda prevista — próximos dias (todas as refeições)</h3>${chart({labels:days.map(dBR),bars:[{n:'Pessoas previstas',v:capDia,c:'#22c55e'}]})}</div></div>
  ${cardT('🗓️ Previsões de demanda (próximos 7 dias)',table('previsoes',prevRows,['data','unidade','refeicao','pessoas','obs']),addBtn('previsoes','+ Previsão'))}`;
};

V['suprimentos']=()=>{
  const d=S.date,pe=rows('pedidos');const aberto=pe.filter(p=>!['Recebido','Cancelado'].includes(p.status));
  const prox=aberto.filter(p=>p.data_prevista>=d&&p.data_prevista<=addDays(d,7));
  const rec=pe.filter(p=>p.status==='Recebido'&&p.data_entrega>=addDays(d,-30));const otif=rec.length?rec.filter(otifPedido).length/rec.length:null;
  const atr=pe.filter(pedidoAtrasado);

  <div class="row c3"><div class="card"><h3>Necessidade × cobertura (principais insumos)</h3><table class="t"><thead><tr><th>Insumo</th><th class="n">Necessidade 7d</th><th class="n">Em pedido</th><th class="n">Cobertura</th><th>Status</th></tr></thead><tbody>${est.map(e=>`<tr class="cl" data-a="edit" data-e="insumos" data-id="${e.i.id}"><td>${esc(e.i.nome)}</td><td class="n">${fmt(e.c*7)}</td><td class="n">${fmt(e.emPedido)}</td><td class="n ${e.st==='cr'?'r':e.st==='at'?'y':'g'}"><b>${fmt(e.cob,1)} d</b></td><td>${B(e.st,e.st==='ok'?'OK':e.st==='at'?'Atenção':'Crítico')}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h3>Calendário de entregas (7 dias)</h3><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${cal.map((c,k)=>`<div class="uc" style="text-align:center;padding:8px 4px;${k===0?'border-color:#22c55e':''}"><b>${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date(c.dd+'T12:00').getDay()]}</b><div class="mu">${dBR(c.dd)}</div><div style="font-size:18px;margin:4px 0">🚚</div><b>${c.kg?fmt(c.kg)+' kg':'—'}</b></div>`).join('')}</div></div>
  ${cardT('⚠️ Riscos de abastecimento',alertList(alertas(),6,a=>['Suprimentos','Estoque'].includes(a.etapa)),'','alert')}</div>`;

V['estoque']=()=>{
  const d=S.date,est=estoque(),lt=rows('lotes');
  const cams=rows('camaras').sort(by('id')).map(c=>{const oc=sum(lt.filter(l=>l.camara===c.id),l=>N(l.qtd))+sum(rows('degelo').filter(x=>x.camara===c.id&&['Programado','Em andamento'].includes(x.status)),x=>N(x.qtd));return {c,oc,p:N(c.capacidade)?oc/N(c.capacidade):0}});
  const venc=lt.filter(l=>l.validade&&daysBetween(d,l.validade)<=P('validade_alerta_dias')&&N(l.qtd)>0).sort(by('validade'));
  const valor=sum(est,e=>e.s*N(e.i.custo));
  const days=[...Array(15)].map((_,k)=>dBR(addDays(d,k)));

  `<div class="kpis">${K('💰','g','Valor em estoque',brl(valor),'saldo × custo unitário')}${K('📦','b','Volume total',fmt(sum(est,e=>e.s))+' kg',fmt(lt.length)+' lotes')}${K('📅','c','Cobertura média',fmt(sum(est.filter(e=>isFinite(e.cob)),e=>e.cob)/(est.filter(e=>isFinite(e.cob)).length||1),1)+' dias','')}${K('⚠️','y','Itens em atenção',fmt(est.filter(e=>e.st==='at').length),'cobertura < segurança')}${K('🚨','r','Itens críticos',fmt(est.filter(e=>e.st==='cr').length),'cobertura < metade da segurança')}${K('🗓️','pu','Lotes a vencer',fmt(venc.length),`≤ ${fmt(P('validade_alerta_dias'))} dias`)}</div>
  <div class="row c3"><div class="card"><h3>Posição de estoque por insumo</h3><table class="t"><thead><tr><th>Insumo</th><th>Tipo</th><th class="n">Saldo</th><th class="n">Consumo/dia</th><th class="n">Cobertura</th><th>Status</th></tr></thead><tbody>${est.map(e=>`<tr class="cl" data-a="edit" data-e="insumos" data-id="${e.i.id}"><td><b>${esc(e.i.nome)}</b></td><td class="mu">${esc(e.i.tipo||'')}</td><td class="n">${fmt(e.s)} ${esc(e.i.um||'')}</td><td class="n">${fmt(e.c)}</td><td class="n ${e.st==='cr'?'r':e.st==='at'?'y':'g'}"><b>${fmt(e.cob,1)} d</b></td><td>${B(e.st,e.st==='ok'?'OK':e.st==='at'?'Atenção':'Crítico')}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h3>Curva de cobertura projetada (dias, com entregas)</h3>${legend(top.map((e,i)=>({n:e.i.nome,c:COL[i]})))}${chart({labels:days,lines:top.map((e,i)=>({n:e.i.nome,v:e.proj,c:COL[i]})),ref:{v:3,l:'Limite de segurança (3 dias)'},yfmt:v=>fmt(v,0)})}</div>
  <div class="card"><h3>Estoque por câmara / armazenagem</h3><table class="t"><thead><tr><th>Câmara</th><th class="n">Capacidade</th><th>Ocupação</th><th>Status</th></tr></thead><tbody>${cams.map(x=>`<tr class="cl" data-a="edit" data-e="camaras" data-id="${x.c.id}"><td>${esc(x.c.nome)}</td><td class="n">${fmt(N(x.c.capacidade))} kg</td><td style="min-width:120px">${meter(x.p,x.p>.9?'r':x.p>.8?'y':'')}<span class="mu">${fmt(x.oc)} kg · ${pct(x.p,0)}</span></td><td>${B(x.p>.9?'cr':x.p>.8?'at':'ok',x.p>.9?'Lotada':x.p>.8?'Atenção':'OK')}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="row c3">${cardT('🏷️ Lotes e validades',table('lotes',lt.sort(by('validade')),['id','insumo','qtd','validade','camara','status'],{sm:true}),addBtn('lotes','+ Lote'))}
  <div class="card"><h3>Projeção de cobertura (cenários de demanda)</h3><table class="t"><thead><tr><th>Insumo</th>${cen.map(c=>`<th class="n">${c?'+'+c+'%':'Base'}</th>`).join('')}</tr></thead><tbody>${est.map(e=>`<tr><td>${esc(e.i.nome)}</td>${cen.map(c=>{const v=e.c>0?e.s/(e.c*(1+c/100)):Infinity;return `<td class="n ${v<e.seg/2?'r':v<e.seg?'y':'g'}">${fmt(v,1)} d</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
  ${cardT('🚨 Alertas e recomendações de estoque',alertList(alertas(),6,a=>a.etapa==='Estoque'),'','alert')}</div>`;
};

  const items=hoje.map(o=>({lane:String(nm('camaras',o.x.camara)).replace(/^Câmara (de )?/,''),a:dtMin(o.x.inicio),b:dtMin(o.x.liberacao),label:`${o.x.lote||o.x.id} ${nm('insumos',o.x.insumo)} ${fmt(N(o.x.qtd))}kg`,cls:{Liberado:'ok','Em andamento':'at',Programado:'in',Atrasado:'cr',Bloqueado:'cr'}[o.s]}));
  const ins=[...new Set(rows('preparacoes').map(p=>p.insumo).filter(Boolean))].filter(i=>(get('insumos',i)||{}).tipo==='Congelado');
  const cob=ins.map(i=>{const need=sum(rows('ordens').filter(o=>o.data===d&&(get('preparacoes',o.preparacao)||{}).insumo===i),o=>{const p=get('preparacoes',o.preparacao);return N(o.planejado)*N(p.gramatura_g)/1000/((N(p.rendimento)||100)/100)});const lib=sum(sts.filter(o=>o.x.insumo===i&&o.s==='Liberado'&&(o.x.liberacao||'').slice(0,10)<=d&&(o.x.liberacao||'').slice(0,10)>=addDays(d,-1)),o=>N(o.x.qtd));const prev=sum(sts.filter(o=>o.x.insumo===i&&['Em andamento','Programado','Atrasado'].includes(o.s)&&(o.x.liberacao||'')<=d+'T23:59'),o=>N(o.x.qtd));return {i,need,lib,prev,c:need?lib/need:1}});
  const capT=sum(camD,c=>N(c.capacidade)),ocT=sum(sts.filter(o=>['Em andamento','Programado','Atrasado'].includes(o.s)),o=>N(o.x.qtd));
  const tempos=sts.filter(o=>o.s==='Liberado'&&o.x.inicio&&o.x.liberacao).map(o=>(dtMin(o.x.liberacao)-dtMin(o.x.inicio))/60);
  return head('Degelo','Programação, acompanhamento e liberação de proteínas e componentes congelados')+
  `<div class="kpis">${K('🗓️','g','Lotes no período',fmt(hoje.length),fmt(sum(hoje,o=>N(o.x.qtd)))+' kg')}${K('✅','b','Liberados',fmt(hoje.filter(o=>o.s==='Liberado').length),fmt(sum(hoje.filter(o=>o.s==='Liberado'),o=>N(o.x.qtd)))+' kg')}${K('⏳','y','Em andamento',fmt(hoje.filter(o=>o.s==='Em andamento').length),'')}${K('🚨','r','Em atraso',fmt(hoje.filter(o=>o.s==='Atrasado').length),fmt(sum(hoje.filter(o=>o.s==='Atrasado'),o=>N(o.x.qtd)))+' kg')}${K('⏱️','c','Tempo médio de degelo',tempos.length?fmt(sum(tempos)/tempos.length,1)+' h':'—','janela validada por procedimento')}${K('❄️','pu','Ocupação de degelo',capT?pct(ocT/capT,0):'—',`${fmt(ocT)} / ${fmt(capT)} kg`)}</div>
  <div class="row c2">${cardT('🧊 Programação de degelo',table('degelo',dg.sort(by('inicio')).reverse(),['id','lote','insumo','qtd','camara','inicio','liberacao'],{sm:true}).replace(/<\/tbody>/,'</tbody>'),addBtn('degelo','+ Degelo'))}
  <div class="card"><h3>Linha do tempo do degelo — utilização das câmaras</h3>${items.length?gantt(items,-6*60,24*60,camD.map(c=>String(c.nome).replace(/^Câmara (de )?/,''))):'<div class="empty">Sem degelos no período.</div>'}${legend([{n:'Liberado',c:'#16a34a'},{n:'Em andamento',c:'#ca8a04'},{n:'Programado',c:'#2563eb'},{n:'Atraso',c:'#dc2626'}])}</div></div>
  <div class="row c3"><div class="card"><h3>Cobertura de produção com degelo (hoje)</h3><table class="t"><thead><tr><th>Insumo</th><th class="n">Necessidade</th><th class="n">Liberado</th><th class="n">A liberar</th><th>Cobertura</th></tr></thead><tbody>${cob.map(c=>`<tr><td>${esc(nm('insumos',c.i))}</td><td class="n">${fmt(c.need)} kg</td><td class="n">${fmt(c.lib)} kg</td><td class="n">${fmt(c.prev)} kg</td><td>${B(c.c>=1?'ok':c.c>=.85?'at':'cr',pct(c.c,0))}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">Sem ordens de produção hoje.</td></tr>'}</tbody></table><div class="hint">Necessidade = porções planejadas × gramatura ÷ rendimento.</div></div>
  <div class="card"><h3>Status dos lotes em degelo</h3><table class="t"><thead><tr><th>Lote</th><th>Liberação</th><th>Status calculado</th></tr></thead><tbody>${hoje.sort((a,b)=>(a.x.liberacao||'').localeCompare(b.x.liberacao||'')).map(o=>`<tr class="cl" data-a="edit" data-e="degelo" data-id="${o.x.id}"><td>${esc(o.x.lote||o.x.id)} · ${esc(nm('insumos',o.x.insumo))}</td><td>${dtBR(o.x.liberacao)}</td><td>${SB(o.s)}</td></tr>`).join('')}</tbody></table></div>
  ${cardT('⚠️ Alertas e ações recomendadas',alertList(alertas(),5,a=>a.etapa==='Degelo'),'','alert')}</div>
  <div class="hint">⚠️ Janelas de degelo e temperaturas devem seguir procedimentos validados (MBPF). O app só calcula; não define parâmetros sanitários.</div>`;
};

V['producao']=()=>{
  const d=S.date,ops=rows('ordens').filter(o=>o.data===d).sort(by('inicio'));
  const pl=sum(ops,o=>N(o.planejado)),pr=sum(ops,o=>N(o.produzido));
  const sts=ops.map(o=>({o,s:ordemStatus(o)}));
  const items=sts.map(x=>({lane:nm('preparacoes',x.o.preparacao),a:h2m(x.o.inicio),b:h2m(x.o.fim_real||x.o.fim_prev),label:`${x.o.inicio}–${x.o.fim_real||x.o.fim_prev}`,cls:x.s==='Concluída'?'ok':x.s==='Em produção'?'at':['Atrasada','Deveria ter iniciado'].includes(x.s)?'cr':'in'}));
  const lanes=[...new Set(items.map(i=>i.lane))];
  const rep=sts.map(x=>{const dem=demandaPrep(d,x.o.preparacao,x.o.refeicao),prev=demandaPrepPrev(d,x.o.preparacao,x.o.refeicao);const p=get('preparacoes',x.o.preparacao)||{};return {...x,dem,prev,gap:dem-N(x.o.planejado),p}});
  const tol=1+P('tolerancia_prev_pct')/100;const atend=rep.filter(r=>r.dem>N(r.o.planejado)*tol);
  const dest=rows('expedicoes').filter(x=>x.data===d).sort(by('saida_prev'));
  const cap=P('capacidade_porcoes');
  return head('Produção','Planejamento, execução e desempenho da produção de preparações')+
  `<div class="kpis">${K('📋','g','Ordens de produção (hoje)',fmt(ops.length),fmt(sts.filter(x=>x.s==='Concluída').length)+' concluídas')}${K('🍴','b','Porções programadas',fmt(pl),'')}${K('🍽️','c','Porções produzidas',fmt(pr),pl?pct(pr/pl,1)+' de execução':'')}${K('⏳','y','Em produção',fmt(sts.filter(x=>x.s==='Em produção').length),'')}${K('🚨','r','Atrasadas',fmt(sts.filter(x=>['Atrasada','Deveria ter iniciado'].includes(x.s)).length),'')}${(()=>{const nu=unidadesServico().filter(u=>{const p=plan(d,u.id,refAtual());return p.temReal&&p.fator>1+P('tolerancia_prev_pct')/100}).length;return K('📈','pu','Unidades pedindo reforço',fmt(nu),`demanda > previsão + ${fmt(P('tolerancia_prev_pct'))}%`)})()}</div>
  <div class="row c2">${cardT('📋 Ordens de produção — '+dBR(d),`<div class="tw"><table class="t"><thead><tr><th>OP</th><th>Preparação</th><th class="n">Planejado</th><th class="n">Produzido</th><th class="n">Demanda projetada</th><th>Início</th><th>Término</th><th>Status</th></tr></thead><tbody>${rep.map(r=>`<tr class="cl" data-a="edit" data-e="ordens" data-id="${r.o.id}"><td>${esc(r.o.id)}</td><td><b>${esc(r.p.nome||r.o.preparacao)}</b></td><td class="n">${fmt(N(r.o.planejado))}</td><td class="n">${r.o.produzido===''||r.o.produzido==null?'—':fmt(N(r.o.produzido))}</td><td class="n ${r.gap>0.5?'y':''}"><b>${fmt(r.dem)}</b>${r.gap>0.5?`<br><span class="y">+${fmt(r.gap)}</span>`:''}</td><td>${esc(r.o.inicio||'')}</td><td>${esc(r.o.fim_real||r.o.fim_prev||'')}</td><td>${SB(r.s)}</td></tr>`).join('')||'<tr><td colspan=8 class="empty">Sem ordens hoje.</td></tr>'}</tbody></table></div><div class="hint">Demanda projetada = soma, nas unidades, de pessoas projetadas × taxa de escolha × repetição. Quando passa da ordem, a ordem não foi replanejada.</div>`,addBtn('ordens','+ Ordem'))}
  <div class="card"><h3>Cronograma de produção — linha do tempo</h3>${lanes.length?gantt(items,6*60,16*60,lanes):'<div class="empty">Sem ordens.</div>'}${legend([{n:'Concluída',c:'#16a34a'},{n:'Em produção',c:'#ca8a04'},{n:'Programada',c:'#2563eb'},{n:'Atrasada',c:'#dc2626'}])}</div></div>
  <div class="row c3"><div class="card"><h3>Planejado × produzido (porções)</h3>${legend([{n:'Planejado',c:'#3b82f6'},{n:'Produzido',c:'#22c55e'},{n:'Demanda projetada',c:'#eab308'}])}${chart({labels:rep.map(r=>(r.p.nome||'').split(' ')[0]),bars:[{n:'Planejado',v:rep.map(r=>N(r.o.planejado)),c:'#3b82f6'},{n:'Produzido',v:rep.map(r=>N(r.o.produzido)),c:'#22c55e'}],lines:[{n:'Demanda projetada',v:rep.map(r=>r.dem),c:'#eab308'}]})}</div>
  <div class="card"><h3>Capacidade produtiva da cozinha</h3><div style="display:flex;gap:14px;align-items:center">${donut([{v:pl,c:'#22c55e',n:'Programado'},{v:Math.max(0,cap-pl),c:'#1a2c44',n:'Disponível'}],pct(pl/(cap||1),0),'utilização')}<div><div class="mu">Capacidade/dia</div><b style="font-size:18px">${fmt(cap)} porções</b><div class="mu" style="margin-top:6px">Programado</div><b>${fmt(pl)}</b><div class="mu" style="margin-top:6px">Disponível para reforço</div><b class="g">${fmt(Math.max(0,cap-pl))}</b></div></div></div>
  <div class="card alert"><h3>⚠️ Alertas e ações recomendadas</h3>${unidadesServico().map(u=>{const pl=plan(d,u.id,refAtual());if(!pl.temReal||pl.fator<=1+P('tolerancia_prev_pct')/100)return '';const g=pl.preps.map(pp=>({pp,g:pp.porcoes-pp.porcoesPrev})).filter(x=>x.g>=1);return `<div class="al cr"><div class="ai">🔴</div><div class="at"><b>${esc(u.nome)}: demanda ${fmt((pl.fator-1)*100,0)}% acima — reforço de ${fmt(sum(g,x=>x.g*N(x.pp.p.gramatura_g)/1000),1)} kg</b><span>${g.map(x=>esc(x.pp.p.nome)+' +'+fmt(x.g)).join(' · ')}</span></div>${B('cr','Liberar reforço')}</div>`}).join('')}${atend.map(r=>`<div class="al cr"><div class="ai">🔴</div><div class="at"><b>${esc(r.p.nome)}: faltam ${fmt(r.gap)} porções (${fmt(r.gap*N(r.p.gramatura_g)/1000,1)} kg)</b><span>Reforço exige ${fmt(N(r.p.tempo_prod))} min · previsão original ${fmt(r.prev)} porções</span></div>${B('cr','Liberar reforço')}</div>`).join('')}${alertList(alertas(),4,a=>a.etapa==='Produção'&&!/demanda projetada|^Reforço para/.test(a.txt))}</div></div>
  ${cardT('🚚 Expedição para as unidades (hoje)',table('expedicoes',dest,['id','destino','refeicao','porcoes','saida_prev','chegada_prev','status'],{sm:true}),addBtn('expedicoes','+ Expedição'))}`;
};

V['logistica']=()=>{
  const d=S.date,ex=rows('expedicoes').filter(x=>x.data===d).sort(by('saida_prev'));const st=ex.map(x=>({x,s:expStatus(x)}));

V['anomalias']=()=>{
  const d=S.date,ini=addDays(d,-29),an=rows('anomalias').filter(a=>a.data>=ini&&a.data<=d).sort((a,b)=>(b.data+(b.inicio||'')).localeCompare(a.data+(a.inicio||'')));

  let ac=0;const tot=an.length||1;
  const tr=an.filter(a=>['Tratada','Encerrada'].includes(a.status));
  const us=unidadesServico();
  const dur=an.filter(a=>a.tipo==='Parada de rampa'&&a.inicio&&a.fim);const parada=sum(dur,a=>h2m(a.fim)-h2m(a.inicio));
  const ac2=rows('acoes');const acAt=ac2.filter(x=>x.status!=='Concluída'&&x.status!=='Cancelada'&&x.prazo&&x.prazo<d);

  return head('Anomalias','Registro, investigação, tratamento e prevenção de anomalias do processo',`<div class="ctl">${addBtn('anomalias','+ Registrar anomalia')}</div>`)+
  `<div class="kpis">${K('📅','g','Total (30 dias)',fmt(an.length),'')}${tipos.slice(0,3).map((t,i)=>K(['⚠️','🔍','🧫'][i],['r','y','b'][i],t.t,fmt(t.n),pct(t.n/tot,1)+' do total')).join('')}${K('✅','g','Taxa de tratamento',pct(tr.length/tot,1),'tratadas ou encerradas')}${K('⏱️','c','Tempo de parada (rampa)',fmt(parada)+' min',dur.length+' evento(s)')}${K('🔁','pu','Reincidência',pct(reinc,1),'mesmo tipo, unidade e preparação')}</div>
  <div class="row c3"><div class="card"><h3>Pareto de anomalias (80/20)</h3>${legend([{n:'Quantidade',c:'#3b82f6'},{n:'% acumulado',c:'#eab308'}])}${chart({labels:tipos.map(t=>t.t.length>14?t.t.slice(0,13)+'…':t.t),bars:[{n:'Quantidade',v:tipos.map(t=>t.n),c:'#3b82f6'}],lines:[{n:'% acumulado',v:tipos.map(t=>(ac+=t.n)/tot*100),c:'#eab308',y2:true}],y2fmt:v=>fmt(v,0)+'%'})}</div>
  <div class="card"><h3>Evolução das anomalias (4 semanas)</h3>${legend(tl)}${chart({labels:weeks.map(w=>w.l),lines:tl})}</div>

  <div class="row c2"><div class="card"><h3>📋 Registro e acompanhamento</h3><div class="tw"><table class="t"><thead><tr><th>ID</th><th>Data/hora</th><th>Unidade</th><th>Tipo</th><th>Descrição</th><th>Severidade</th><th>Status</th></tr></thead><tbody>${an.map(a=>`<tr class="cl" data-a="investigar" data-v="${esc(a.id)}"><td>${esc(a.id)}</td><td>${dBR(a.data)} ${a.inicio||''}</td><td>${esc(nm('unidades',a.unidade))}</td><td>${esc(a.tipo)}</td><td>${esc((a.descricao||'').slice(0,50))}</td><td>${SB(a.severidade)}</td><td>${SB(a.status)}</td></tr>`).join('')||'<tr><td colspan=7 class="empty">Nenhuma anomalia em 30 dias.</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3>Mapa de calor — anomalias por unidade (30 dias)</h3>${heat}</div></div>`;
};
function investigar(a){
  const E=[],d=a.data,u=a.unidade,p=get('preparacoes',a.preparacao),r=a.refeicao||'Almoço',h=h2m(a.inicio)??nowMin();
  const add=(etapa,achado,sinal)=>E.push({etapa,achado,sinal});
  // (a) consumo e reposição
  const cat=rows('catraca').filter(x=>x.data===d&&x.unidade===u&&x.refeicao===r&&h2m(x.inicio)+INT()<=h);
  const Pp=prevPessoas(d,u,r),cv=curva(r);const prevAte=sum(cv.filter(c=>h2m(c.inicio)+INT()<=h),c=>Pp*N(c.pct)/100);const real=sum(cat,x=>N(x.entradas));
  if(Pp&&cat.length){const dv=real/(prevAte||1)-1;add('Demanda',`Até ${a.inicio}: ${fmt(real)} pessoas na catraca vs ${fmt(prevAte)} previstas (${dv>=0?'+':''}${pct(dv,0)}). Previsão do dia: ${fmt(Pp)}.`,Math.abs(dv)*100>P('tolerancia_prev_pct')?'forte':'ok')}else add('Demanda','Sem catraca ou previsão para comparar no horário.','fraco');
  if(p){const rp=rows('reposicoes').filter(x=>x.data===d&&x.unidade===u&&x.preparacao===p.id&&h2m(x.solicitacao)<=h+5);
    const lentas=rp.filter(x=>x.chegada&&h2m(x.chegada)-h2m(x.solicitacao)>P('sla_reposicao_min'));const pend=rp.filter(x=>!x.chegada||h2m(x.chegada)>h);
    add('Reposição',rp.length?`${rp.length} reposição(ões) de ${p.nome}; ${lentas.length} acima do SLA de ${fmt(P('sla_reposicao_min'))} min; ${pend.length} sem chegada antes da parada.`:`Nenhuma reposição de ${p.nome} registrada antes da parada.`,lentas.length||pend.length?'forte':rp.length?'ok':'fraco');
    const pl=plan(d,u,r),pp=pl.preps.find(x=>x.p.id===p.id);if(pp)add('Buffer / cubas',`No pico (${m2h(pp.pico.t)}) uma cuba de ${p.nome} dura ${fmt(pp.pico.dur,1)} min; reposição ${fmt(P('tempo_reposicao_min'))} min → AUI ${fmt(pp.pico.aui,1)} min.`,pp.pico.aui<0?'forte':'ok');
    const lt=rows('leituras').filter(x=>x.data===d&&x.unidade===u&&x.preparacao===p.id&&h2m(x.hora)<=h).sort((a,b)=>h2m(b.hora)-h2m(a.hora))[0];if(lt)add('Saldo na linha',`Última leitura às ${lt.hora}: ${fmt(N(lt.saldo_kg),1)} kg (${fmt(N(lt.cubas))} cuba(s)).`,N(lt.saldo_kg)<N(p.kg_cuba)?'fraco':'ok');
    // (b) produção / expedição
    const op=rows('ordens').filter(o=>o.data===d&&o.preparacao===p.id&&(o.refeicao||r)===r);
    if(op.length){const pl2=sum(op,o=>N(o.planejado)),dem=demandaPrep(d,p.id,r),prevD=demandaPrepPrev(d,p.id,r);add('Produção',`Ordem(ns) ${op.map(o=>o.id).join(', ')}: ${fmt(pl2)} porções planejadas; demanda prevista ${fmt(prevD)} e projetada ${fmt(dem)}. ${dem>pl2*1.03?'Ordem não foi replanejada.':''}`,dem>pl2*1.03?'forte':'ok');
      op.forEach(o=>{const s=ordemStatus(o);if(o.fim_real&&o.fim_prev&&h2m(o.fim_real)>h2m(o.fim_prev))add('Produção',`${o.id} terminou ${o.fim_real} (previsto ${o.fim_prev}).`,'fraco');if(['Atrasada','Deveria ter iniciado'].includes(s))add('Produção',`${o.id}: ${s}.`,'forte')})}
    else add('Produção',`Sem ordem de produção de ${p.nome} na data.`,'fraco');
    const ex=rows('expedicoes').filter(x=>x.data===d&&x.destino===u&&(x.refeicao||r)===r);
    ex.forEach(x=>{const at=x.chegada_real?h2m(x.chegada_real)-h2m(x.chegada_prev):null;add('Logística',`${x.id}: chegada ${x.chegada_real||'não registrada'} (prevista ${x.chegada_prev||'—'})${x.romaneio==='Não'?'; sem romaneio conferido':''}.`,at!=null&&at>10?'forte':x.romaneio==='Não'||!x.chegada_real?'fraco':'ok')});
    // (c) degelo e insumos
    if(p.insumo){const dg=rows('degelo').filter(x=>x.insumo===p.insumo&&(x.liberacao||'').slice(0,10)>=addDays(d,-1)&&(x.liberacao||'').slice(0,10)<=d);
      const atr=dg.filter(x=>{const s=degeloStatus(x);return s==='Atrasado'||s==='Bloqueado'});add('Degelo',dg.length?`${dg.length} lote(s) de ${nm('insumos',p.insumo)} em degelo para a data; ${atr.length} atrasado(s)/bloqueado(s).`:`Nenhum degelo de ${nm('insumos',p.insumo)} registrado para a data.`,atr.length?'forte':dg.length?'ok':'fraco');
      // (d) estoque
      const e=estoque().find(x=>x.i.id===p.insumo);if(e)add('Estoque',`${e.i.nome}: ${fmt(e.s)} ${e.i.um||'kg'} hoje, cobertura ${fmt(e.cob,1)} dias (segurança ${fmt(e.seg)}).`,e.st==='cr'?'fraco':'ok')}
    // (e) cardápio
    add('Cardápio',`${p.nome}: taxa de escolha cadastrada ${fmt(N(p.aceitacao))}%, porção ${fmt(N(p.gramatura_g))} g, repetição ×${fmt(N(p.fator_rep)||1,2)}.`,'ok');
  }
  const eq=rows('equipamentos').filter(x=>x.status!=='Disponível');if(eq.length)add('Equipamentos',eq.map(x=>`${x.nome}: ${x.status}`).join('; '),'fraco');
  const o={forte:0,fraco:1,ok:2};return E.sort((a,b)=>o[a.sinal]-o[b.sinal]);
}
function openInvestigacao(id){
  const a=get('anomalias',id);if(!a)return;
  const ev=investigar(a);const ac=rows('acoes').filter(x=>x.anomalia===id).sort(by('prazo'));
  const pq=[a.pq1,a.pq2,a.pq3,a.pq4,a.pq5];
  modal(`<h2>⚠️ ${esc(a.tipo)} — ${esc(a.id)} ${isSim(a)?'<span class="tag sim">SIMULADO</span>':''}<span class="sp" style="flex:1"></span><button class="btn sm" data-a="close">✕</button></h2>
  <div class="mu" style="margin-bottom:10px">${esc(nm('unidades',a.unidade))} · ${dBR(a.data)} ${a.inicio||''}${a.fim?'–'+a.fim+' ('+(h2m(a.fim)-h2m(a.inicio))+' min)':''} · ${esc(a.refeicao||'')} · ${esc(nm('preparacoes',a.preparacao))} · ${SB(a.status)} ${SB(a.severidade)}</div>
  <div class="card" style="margin-bottom:10px"><h3>Descrição</h3>${esc(a.descricao||'—')}</div>
  <div class="row c2" style="margin-bottom:0"><div class="card"><h3>🔎 Evidências automáticas (navegação para trás)</h3>${ev.map(e=>`<div class="ev ${e.sinal}"><div style="min-width:86px"><b>${esc(e.etapa)}</b><br>${B(e.sinal==='forte'?'cr':e.sinal==='fraco'?'at':'ok',e.sinal==='forte'?'Evidência forte':e.sinal==='fraco'?'Verificar':'Sem desvio')}</div><div>${esc(e.achado)}</div></div>`).join('')}<div class="hint">Simultaneidade não prova causa: confirme cada hipótese com evidência e valide os 5 Porquês. Causas múltiplas são permitidas.</div></div>
  <div class="card"><h3>🧠 5 Porquês</h3><div class="why">${pq.map((q,i)=>`<span class="q">${i+1}º Porquê</span><span>${esc(q||'—')}</span>`).join('')}</div>
  <div class="card" style="margin-top:10px;border-color:#166534"><b class="g">Causa raiz ${a.validada==='Sim'?'(validada)':'(a validar)'}</b><div>${esc(a.causa||'—')}</div><div class="mu" style="margin-top:6px">Ação imediata: ${esc(a.acao_imediata||'—')}</div><div class="mu">Etapa de origem: ${esc(a.macro||'—')} · ${esc(a.subprocesso||'—')} · 4M: ${esc(a.m4||'—')}</div></div></div></div>
  <div class="card" style="margin-top:10px"><h3>✅ Plano de ação (A3)<span class="sp"></span><button class="btn sm pr act" data-a="newacao" data-v="${esc(a.id)}">+ Ação</button></h3>${table('acoes',ac,['tipo','acao','responsavel','prazo','status','eficaz'],{noAdd:true})}</div>
  <div class="mft"><button class="btn pr" data-a="edit" data-e="anomalias" data-id="${esc(a.id)}">Editar anomalia / 5 Porquês</button><button class="btn" data-a="close">Fechar</button></div>`);
}

V['relatorios']=()=>{
  const d=S.date,ini=addDays(d,-(S.rel-1)),us=unidadesServico();
  const cat=rows('catraca').filter(x=>x.data>=ini&&x.data<=d),prv=rows('previsoes').filter(x=>x.data>=ini&&x.data<=d),an=rows('anomalias').filter(x=>x.data>=ini&&x.data<=d);
  const linhas=us.map(u=>{const c=sum(cat.filter(x=>x.unidade===u.id),x=>N(x.entradas)),b=sum(cat.filter(x=>x.unidade===u.id&&x.bandejas!==''&&x.bandejas!=null),x=>N(x.bandejas)),p=sum(prv.filter(x=>x.unidade===u.id&&x.data<d),x=>N(x.pessoas))+sum(prv.filter(x=>x.unidade===u.id&&x.data===d),x=>plan(d,u.id,x.refeicao).prevAte);const a=an.filter(x=>x.unidade===u.id);return {u,c,b,p,ad:p?c/p:null,a:a.length,pr:a.filter(x=>x.tipo==='Parada de rampa').length}});
  const rec=rows('pedidos').filter(p=>p.status==='Recebido'&&p.data_entrega>=ini);const otif=rec.length?rec.filter(otifPedido).length/rec.length:null;
  const ent=rows('expedicoes').filter(x=>x.data>=ini&&x.chegada_real);const otl=ent.length?ent.filter(x=>h2m(x.chegada_real)-h2m(x.chegada_prev)<=10).length/ent.length:null;
  const custo=sum(rows('pedidos').filter(p=>p.status==='Recebido'&&p.data_entrega>=ini),p=>N(p.valor));const refe=sum(linhas,x=>x.c);
  const tipos=[...new Set(an.map(a=>a.tipo))].map(t=>({n:t,v:an.filter(a=>a.tipo===t).length})).sort((a,b)=>b.v-a.v);
  const varsD=rows('variaveis');const dispo=varsD.filter(v=>['Disponível','Parcial'].includes(v.disponibilidade)).length;
  const csv=['Unidade;Refeições (catraca);Previsto;Aderência;Bandejas;Anomalias;Paradas de rampa',...linhas.map(x=>[x.u.nome,x.c,Math.round(x.p),x.ad==null?'':(x.ad*100).toFixed(1)+'%',x.b,x.a,x.pr].join(';'))].join('\n');
  return head('Relatórios e inteligência gerencial','Consolidação de indicadores, desempenho, tendências e qualidade dos dados',`<div class="chips">${[7,30,90].map(n=>`<span class="chip ${S.rel===n?'on':''}" data-a="rel" data-v="${n}">${n} dias</span>`).join('')}</div>`)+
  `<div class="kpis">${K('🍽️','g','Refeições (catraca)',fmt(refe),dBR(ini)+' – '+dBR(d))}${K('📊','b','Aderência à previsão',sum(linhas,x=>x.p)?pct(refe/sum(linhas,x=>x.p),1):'—','')}${K('⚠️','r','Anomalias',fmt(an.length),an.filter(a=>a.tipo==='Parada de rampa').length+' paradas de rampa')}${K('🤝','c','OTIF fornecedores',otif==null?'—':pct(otif,0),'')}${K('🚚','pu','OTIF logístico',otl==null?'—':pct(otl,0),'')}${K('💰','y','Compras recebidas',brl(custo),refe?brl(custo/refe)+' por refeição':'')}${K('📚','b','Dados disponíveis',`${dispo}/${varsD.length}`,'variáveis do inventário')}</div>
  <div class="row c2"><div class="card"><h3>Desempenho por unidade<span class="sp"></span><button class="btn sm act" data-a="copy" data-v="${esc(csv)}">Copiar CSV</button></h3><table class="t"><thead><tr><th>Unidade</th><th class="n">Refeições</th><th class="n">Previsto</th><th class="n">Aderência</th><th class="n">Anomalias</th><th class="n">Paradas</th><th>Status</th></tr></thead><tbody>${linhas.map(x=>`<tr><td>${esc(x.u.nome)}</td><td class="n">${fmt(x.c)}</td><td class="n">${fmt(x.p)}</td><td class="n">${x.ad==null?'—':pct(x.ad,1)}</td><td class="n">${x.a}</td><td class="n">${x.pr}</td><td>${x.pr?B('at','Atenção'):B('ok','OK')}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h3>Distribuição das anomalias</h3><div style="display:flex;gap:14px;align-items:center">${donut(tipos.map((t,i)=>({n:t.n,v:t.v,c:COL[[6,2,1,3,4,5,0][i%7]]})),fmt(an.length),'anomalias')}<div>${tipos.map((t,i)=>`<div><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${COL[[6,2,1,3,4,5,0][i%7]]};margin-right:6px"></i>${esc(t.n)}: <b>${pct(t.v/(an.length||1),1)}</b></div>`).join('')}</div></div></div></div>
  <div class="row c3"><div class="card"><h3>Qualidade e governança dos dados</h3>${['Disponível','Parcial','Simulado','Inexistente','Não avaliado'].map(s=>{const n=varsD.filter(v=>(v.disponibilidade||'Não avaliado')===s).length;return `<div style="display:grid;grid-template-columns:110px 1fr 50px;gap:8px;align-items:center;margin-bottom:8px"><span>${s}</span>${meter(n/(varsD.length||1),s==='Disponível'?'':s==='Parcial'||s==='Simulado'?'y':'r')}<b>${n}</b></div>`}).join('')}<div class="hint">Do inventário mestre. Atualize em Processo e Dados → Dicionário.</div></div>
  <div class="card"><h3>Evidências no processo</h3>${(()=>{const pr=rows('processo');return ['Sim','Não','NA','A verificar'].map(s=>{const n=pr.filter(x=>x.evidencia===s).length;return `<div style="display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center;margin-bottom:8px"><span>${s}</span>${meter(n/(pr.length||1),s==='Sim'?'':s==='Não'?'r':s==='A verificar'?'y':'b')}<b>${n}</b></div>`}).join('')})()}<div class="hint">Subprocessos sem evidência quebram a rastreabilidade da Torre.</div></div>
  <div class="card"><h3>Principais insights</h3>${(()=>{const I=[];if(tipos[0])I.push(['🔴',`${tipos[0].n} concentra ${pct(tipos[0].v/(an.length||1),0)} das anomalias do período.`]);const pior=linhas.slice().sort((a,b)=>b.a-a.a)[0];if(pior&&pior.a)I.push(['🟡',`${pior.u.nome} tem o maior número de anomalias (${pior.a}).`]);const sem=rows('processo').filter(x=>x.evidencia==='Não');if(sem.length)I.push(['🔵',`${sem.length} subprocessos sem evidência: ${sem.slice(0,3).map(x=>x.subprocesso).join('; ')}…`]);const si=Object.keys(DATA).reduce((s,e)=>s+rows(e).filter(isSim).length,0);if(si)I.push(['🧪',`${fmt(si)} registros ainda são simulados.`]);return I.map(x=>`<div class="al in2"><div class="ai">${x[0]}</div><div class="at"><b>${esc(x[1])}</b></div></div>`).join('')})()}</div></div>`;
};

    const pr=rows('processo').sort((a,b)=>N(a.ordem)-N(b.ordem));const ms=macros();
