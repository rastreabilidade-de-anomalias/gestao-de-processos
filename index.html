  <div class="card"><h3>🧮 Campos calculados<span class="sp"></span><button class="btn sm act" data-a="newCalc">+ Campo</button></h3>${(CFG.calc||[]).length?`<table class="t"><thead><tr><th>Tabela</th><th>Campo</th><th>Fórmula</th><th></th></tr></thead><tbody>${CFG.calc.map(c=>`<tr><td>${esc(SCHEMA[c.tabela]?.l||c.tabela)}</td><td><b>${esc(c.nome)}</b></td><td><code>${esc(c.formula)}</code></td><td><button class="btn sm dg" data-a="delCalc" data-v="${esc(c.k)}">Remover</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum. Ex.: em Entradas na catraca, <code>bandejas - entradas</code>.</div>'}<div class="hint">Use os códigos dos campos (aparecem ao criar), números, + − × ÷ e as funções min, max, round, abs, se(condição, a, b).</div></div></div>`;};

/* ---------- séries históricas para mini-tendências ---------- */
const diasAte=n=>[...Array(n)].map((_,k)=>addDays(S.date,k-n+1));
function serieRefeicoes(n){const cv=catVis();return diasAte(n).map(d=>sum(cv.filter(x=>x.data===d),x=>N(x.entradas)))}
function serieDesvio(n){const cv=catVis();return diasAte(n).map(d=>{const c=cv.filter(x=>x.data===d);const ks=new Set(c.map(x=>x.unidade+'|'+x.refeicao));const pv=sum(rows('previsoes').filter(x=>x.data===d&&ks.has(x.unidade+'|'+x.refeicao)),x=>N(x.pessoas));if(d===S.date){const us=unidadesServico();const r=refAtual();const pa=sum(us,u=>plan(d,u.id,r).prevAte);return pa?(sum(c,x=>N(x.entradas))/pa-1)*100:null}return pv?(sum(c,x=>N(x.entradas))/pv-1)*100:null})}
function serieParadas(n){return diasAte(n).map(d=>rows('anomalias').filter(a=>a.data===d&&a.tipo==='Parada de rampa').length)}
function serieBarreiras(n){return diasAte(n).map(d=>{const c=cumprimento([d]);return c==null?null:c*100})}
function spark(vals,c){vals=vals.map(v=>v==null||!isFinite(v)?null:v);const v2=vals.filter(v=>v!=null);if(v2.length<2)return '';const W=110,H=26,mn=Math.min(...v2),mx=Math.max(...v2),sp=mx-mn||1;const X=i=>2+(W-4)*i/(vals.length-1),Y=v=>H-3-(H-6)*(v-mn)/sp;let d='';vals.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});const li=vals.length-1;
  return `<svg class="spk" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="${c||'#2563eb'}" stroke-width="1.8" stroke-linecap="round"/>${vals[li]!=null?`<circle cx="${X(li)}" cy="${Y(vals[li])}" r="2.6" fill="${c||'#2563eb'}"/>`:''}<title>Últimos ${vals.length} dias</title></svg>`}
const KS=(ic,c,l,v,s,vals,col)=>`<div class="kpi big"><div class="ic ${c}">${ic}</div><div style="min-width:0"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}${vals?spark(vals,col):''}</div></div>`;

function needBars(px){const W=1200,lw=200,rw=150,rh=36,H=px.length*rh+26;const mx=Math.max(1,...px.map(x=>Math.max(x.need,x.disp)))*1.05;const X=v=>lw+(W-lw-rw)*v/mx;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  px.forEach((x,i)=>{const y=8+i*rh;const ca=sum(x.preps,p=>sum(p.pend,q=>N(q.qtd_kg)));const parts=[[x.linhaKg,'#2563eb','Na linha'],[x.buffer,'#93b4f5','Buffer'],[ca,'#67e8f9','A caminho']];let acc=0;
    s+=`<text x="4" y="${y+15}" style="fill:#0f1e33;font-size:11.5px;font-weight:600">${esc(nm('unidades',x.u).slice(0,24))}</text><text x="4" y="${y+27}" style="font-size:10px">${fmt(x.pes)} pessoas · ${fmt(x.cub)} cubas</text><rect x="${lw}" y="${y+4}" width="${W-lw-rw}" height="18" rx="6" fill="#f1f5f9"/>`;
    parts.forEach(([v,c,n])=>{if(v>0){s+=`<rect x="${X(acc)}" y="${y+4}" width="${Math.max(0,X(acc+v)-X(acc))}" height="18" fill="${c}" rx="3"><title>${n}: ${fmt(v,1)} kg</title></rect>`;acc+=v}});
    const f=x.disp-x.need;s+=`<line x1="${X(x.need)}" x2="${X(x.need)}" y1="${y}" y2="${y+26}" stroke="#0f1e33" stroke-width="2.5"><title>Necessário: ${fmt(x.need,1)} kg</title></line><text x="${X(x.need)+3}" y="${y+33}" style="font-size:9.5px;fill:#0f1e33">precisa ${fmt(x.need,0)} kg</text><text x="${W-rw+8}" y="${y+18}" style="font-size:12.5px;font-weight:800;fill:${f<0?'#dc2626':'#16a34a'}">${f>=0?'+':''}${fmt(f,1)} kg</text>${x.nDef?`<text x="${W-rw+8}" y="${y+30}" style="font-size:9.5px;fill:#dc2626">${x.nDef} prep. em déficit</text>`:''}`});
  return s+`</svg><div class="legx"><span><i style="background:#2563eb"></i>Na linha</span><span><i style="background:#93b4f5"></i>Pronto no buffer</span><span><i style="background:#67e8f9"></i>Reposição a caminho</span><span><i style="background:#0f1e33;width:3px"></i>Necessário (com margem)</span></div>`}

/* ---------- gráfico do serviço: demanda × consumo em tempo real ---------- */
function serviceChart(pls,r){const ivs=(pls[0]||{iv:[]}).iv;if(!ivs.length)return '<div class="empty">Sem curva de entrada.</div>';
  const W=760,H=290,pl=46,pr=46,pt=18,pb=30,iw=W-pl-pr,ih=H-pt-pb,bh=ih*0.22;const t0=ivs[0].t,t1=ivs[ivs.length-1].t+INT();const X=m=>pl+iw*(m-t0)/(t1-t0);
  let cp=0,cr=0,cj=0;const pts=ivs.map((iv,k)=>{const prev=sum(pls,p=>p.iv[k].prev),real=pls.some(p=>p.iv[k].real!=null)?sum(pls,p=>p.iv[k].real||0):null,proj=sum(pls,p=>p.iv[k].proj);cp+=prev;cj+=proj;if(real!=null)cr+=real;return {t:iv.t+INT(),ti:iv.t,prev,real,proj,cp,cr:real!=null?cr:null,cj}});
  const tol=P('tolerancia_prev_pct')/100;const mx=niceMax(Math.max(cp*(1+tol),cj)*1.04);const Y=v=>pt+(ih-bh-8)-(ih-bh-8)*v/mx;const mxm=niceMax(Math.max(...pts.map(p=>Math.max(p.prev,p.proj,p.real||0)/INT())));const YB=v=>pt+ih-bh*v/mxm;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity=".03"/></linearGradient></defs>`;
  for(let k=0;k<=4;k++){const v=mx*k/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef2f7"/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v)}</text>`}
  for(let m=Math.ceil(t0/30)*30;m<=t1;m+=30)s+=`<text x="${X(m)}" y="${H-8}" text-anchor="middle">${m2h(m)}</text>`;
  const base=[[t0,0],...pts.map(p=>[p.t,p.cp])];
  s+=`<path d="M${base.map(([t,v])=>X(t)+' '+Y(v*(1+tol))).join('L')}L${base.slice().reverse().map(([t,v])=>X(t)+' '+Y(v*(1-tol))).join('L')}Z" fill="#94a3b8" opacity=".14"><title>Faixa de tolerância da previsão (±${fmt(tol*100)}%)</title></path>`;
  s+=`<path d="M${base.map(([t,v])=>X(t)+' '+Y(v)).join('L')}" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>`;
  const rp=[[t0,0],...pts.filter(p=>p.cr!=null).map(p=>[p.t,p.cr])];
  if(rp.length>1){s+=`<path d="M${X(t0)} ${Y(0)}L${rp.map(([t,v])=>X(t)+' '+Y(v)).join('L')}L${X(rp[rp.length-1][0])} ${Y(0)}Z" fill="url(#gr)"/><path d="M${rp.map(([t,v])=>X(t)+' '+Y(v)).join('L')}" fill="none" stroke="#2563eb" stroke-width="3"/>`;
    const last=rp[rp.length-1];const jp=[last,...pts.filter(p=>p.t>last[0]).map(p=>[p.t,last[1]+(p.cj-pts.find(q=>q.t===last[0]).cj)])];if(jp.length>1)s+=`<path d="M${jp.map(([t,v])=>X(t)+' '+Y(v)).join('L')}" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="${X(jp[jp.length-1][0])}" cy="${Y(jp[jp.length-1][1])}" r="4" fill="#f59e0b"><title>Projeção do serviço: ${fmt(jp[jp.length-1][1])} pessoas</title></circle><text x="${X(jp[jp.length-1][0])-6}" y="${Y(jp[jp.length-1][1])-8}" text-anchor="end" style="fill:#b45309;font-weight:700">${fmt(jp[jp.length-1][1])}</text>`}
  const bw=iw/ivs.length*0.6;pts.forEach(p=>{const v=(p.real!=null?p.real:p.proj)/INT();s+=`<rect x="${X(p.ti+INT()/2)-bw/2}" y="${YB(v)}" width="${bw}" height="${pt+ih-YB(v)}" rx="3" fill="${p.real!=null?'#2563eb':'#cbd5e1'}" opacity="${p.real!=null?.55:.6}"><title>${m2h(p.ti)}: ${fmt(v,1)} pessoas/min ${p.real!=null?'(real)':'(projetado)'}</title></rect>`});
  s+=`<text x="${W-pr+6}" y="${pt+ih-bh+4}">${fmt(mxm,1)}/min</text>`;
  rows('anomalias').filter(a=>a.data===S.date&&a.tipo==='Parada de rampa'&&a.inicio&&unidadesServico().some(u=>u.id===a.unidade)).forEach(a=>{const t=h2m(a.inicio);if(t<t0||t>t1)return;s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${pt}" y2="${pt+ih-bh}" stroke="#ef4444" stroke-width="1.5"/><path d="M${X(t)-6} ${pt}L${X(t)+6} ${pt}L${X(t)} ${pt+9}Z" fill="#ef4444"><title>${esc(a.tipo)} — ${esc(nm('unidades',a.unidade))} ${a.inicio}</title></path><text x="${X(t)+8}" y="${pt+9}" style="fill:#dc2626;font-weight:700">Parada ${esc(nm('unidades',a.unidade).replace(/ — .*/,''))}</text>`});
  const n=nowMin();if(n>=t0&&n<=t1){const lr=rp[rp.length-1],pa=sum(pls,p=>p.prevAte),re=sum(pls,p=>p.real);const bx=Math.min(X(n)+8,W-pr-170);s+=`<line x1="${X(n)}" x2="${X(n)}" y1="${pt}" y2="${pt+ih}" stroke="#0f1e33" stroke-dasharray="3 3"/><rect x="${bx}" y="${pt+20}" width="164" height="46" rx="8" fill="#0f1e33" opacity=".9"/><text x="${bx+10}" y="${pt+37}" style="fill:#fff;font-weight:700">${m2h(n)} · real ${fmt(re)}</text><text x="${bx+10}" y="${pt+55}" style="fill:#cbd5e1">previsto ${fmt(pa)} (${pa?(re>=pa?'+':'')+fmt((re/pa-1)*100,1)+'%':'—'})</text>`}
  return s+`</svg><div class="legx"><span><i style="background:#2563eb"></i>Real acumulado (catraca)</span><span><i style="background:#94a3b8"></i>Previsto ± tolerância</span><span><i style="background:#f59e0b"></i>Projeção do serviço</span><span><i style="background:#93b4f5"></i>Pessoas por minuto</span><span><i style="background:#ef4444"></i>Parada de rampa</span></div>`}

/* ---------- linha do tempo genérica (gantt com grupos) ---------- */
const GC={ok:'#22c55e',at:'#f59e0b',cr:'#ef4444',in:'#3b82f6',ne:'#cbd5e1'};
function ganttX({groups,from,to,W=1000,lw=160}){const rh=24,gh=22;let H=26;groups.forEach(g=>{H+=gh+g.lanes.length*rh});const X=m=>lw+(W-lw-12)*(Math.max(from,Math.min(to,m))-from)/(to-from);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;for(let m=Math.ceil(from/60)*60;m<=to;m+=60){s+=`<line x1="${X(m)}" x2="${X(m)}" y1="18" y2="${H}" stroke="#eef2f7"/><text x="${X(m)}" y="12" text-anchor="middle">${m2h(m)}</text>`}
  let y=22;groups.forEach(g=>{s+=`<rect x="0" y="${y}" width="${W}" height="${gh-2}" fill="#f7f9fc"/><text x="6" y="${y+14}" style="fill:#0b2d63;font-weight:800;font-size:11px">${esc(g.name)}</text>`;y+=gh;
    g.lanes.forEach(l=>{s+=`<text x="12" y="${y+15}" style="fill:#334155;font-size:10.5px">${esc(String(l.label).slice(0,24))}</text><line x1="${lw}" x2="${W-12}" y1="${y+rh-1}" y2="${y+rh-1}" stroke="#f1f5f9"/>`;
      (l.items||[]).forEach(it=>{if(it.b<from||it.a>to||it.b<=it.a)return;const x1=X(it.a),x2=X(it.b),w=Math.max(3,x2-x1);
        s+=it.ghost?`<rect x="${x1}" y="${y+4}" width="${w}" height="${rh-8}" rx="5" fill="#eaf1ff" stroke="#93b4f5" stroke-dasharray="3 2"><title>${esc(it.label||'')}</title></rect>`:`<rect x="${x1}" y="${y+(it.thin?9:4)}" width="${w}" height="${it.thin?rh-18:rh-8}" rx="5" fill="${GC[it.cls]||GC.in}"><title>${esc(it.label||'')}</title></rect>${!it.thin&&w>60?`<text x="${x1+5}" y="${y+16}" style="fill:#fff;font-size:9.5px;font-weight:600">${esc((it.txt||'').slice(0,Math.floor(w/6)))}</text>`:''}`});
      (l.marks||[]).forEach(mk=>{if(mk.t<from||mk.t>to)return;const x=X(mk.t);s+=mk.shape==='d'?`<path d="M${x} ${y+4}L${x+6} ${y+12}L${x} ${y+20}L${x-6} ${y+12}Z" fill="${GC[mk.cls]||'#64748b'}" stroke="#fff"><title>${esc(mk.label||'')}</title></path>`:`<circle cx="${x}" cy="${y+12}" r="6" fill="${GC[mk.cls]||'#64748b'}" stroke="#fff" stroke-width="2"><title>${esc(mk.label||'')}</title></circle>`});
      y+=rh})});
  const n=nowMin();if(n>=from&&n<=to)s+=`<line x1="${X(n)}" x2="${X(n)}" y1="16" y2="${H}" stroke="#0f1e33" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="${X(n)-26}" y="0" width="52" height="16" rx="5" fill="#0f1e33"/><text x="${X(n)}" y="12" text-anchor="middle" style="fill:#fff;font-weight:700">${m2h(n)}</text>`;
  return s+'</svg>'}
const legGantt=`<div class="legx"><span><i style="background:#eaf1ff;border:1px dashed #93b4f5"></i>Planejado</span><span><i style="background:#22c55e"></i>No prazo / feito</span><span><i style="background:#f59e0b"></i>Em andamento</span><span><i style="background:#ef4444"></i>Atraso / ruptura</span><span><i style="background:#3b82f6"></i>Programado</span></div>`;
function lanesProducao(d){const n=nowMin();return rows('ordens').filter(o=>o.data===d).sort(by('inicio')).map(o=>{const st=ordemStatus(o);const a=h2m(o.inicio),fp=h2m(o.fim_prev),fr=o.fim_real?h2m(o.fim_real):null;const items=[{a,b:fp,ghost:true,label:`${o.id} planejado ${o.inicio}–${o.fim_prev}`}];
  if(fr!=null)items.push({a,b:fr,cls:fr>fp+5?'at':'ok',txt:nm('preparacoes',o.preparacao),label:`${o.id} real ${o.inicio}–${o.fim_real} · ${fmt(N(o.produzido))} porções`});
  else if(o.status==='Programada'&&a<=n)items.push({a,b:Math.max(a+5,n),cls:'cr',txt:'não iniciou',label:`${o.id} deveria ter iniciado às ${o.inicio}`});
  else if(o.status==='Em produção'||st==='Atrasada')items.push({a,b:Math.min(n,Math.max(a+1,n)),cls:st==='Atrasada'?'cr':'at',txt:st==='Atrasada'?'atrasada':'em produção',label:`${o.id} em produção desde ${o.inicio}`});
  else if(st==='Deveria ter iniciado')items.push({a,b:Math.max(a+5,n),cls:'cr',txt:'não iniciou',label:`${o.id} deveria ter iniciado às ${o.inicio}`});
  return {label:nm('preparacoes',o.preparacao),items,marks:[{t:fp,shape:'d',cls:fr!=null?(fr>fp+5?'at':'ok'):(st==='Atrasada'?'cr':'ne'),label:'Término previsto '+o.fim_prev}]}})}
function timelineDia(r){const d=S.date,us=unidadesServico(),j=janela(r)||[660,810];const from=Math.max(0,j[0]-8*60),to=j[1]+30,base=from;
  const dgs=rows('degelo').filter(x=>dtMin(x.liberacao_real||x.liberacao)>=from&&dtMin(x.inicio)<=to).sort(by('inicio'));
  const deg={name:'Degelo',lanes:dgs.map(x0=>({label:`${nm('camaras',x0.camara).replace(/^Câmara (de )?/,'').replace('Degelo ','')} · ${nm('insumos',x0.insumo).replace(' (filé)','')}`,items:[x0].map(x=>{const st=degeloStatus(x);return {a:dtMin(x.inicio),b:dtMin(x.liberacao_real||x.liberacao),cls:{Liberado:'ok','Em andamento':'at',Programado:'in',Atrasado:'cr',Bloqueado:'cr'}[st],txt:`${x.lote||''} ${nm('insumos',x.insumo)}`,label:`${x.lote||x.id} ${nm('insumos',x.insumo)} ${fmt(N(x.qtd))} kg · ${st} · liberação ${dtBR(x.liberacao)}`}}),marks:[{t:dtMin(x0.liberacao),shape:'d',cls:degeloStatus(x0)==='Atrasado'?'cr':'ne',label:'Liberação prevista '+dtBR(x0.liberacao)}]}))};
  const prod={name:'Produção (planejado × real)',lanes:lanesProducao(d)};
  const ex={name:'Expedição',lanes:us.map(u=>{const x=rows('expedicoes').find(e=>e.data===d&&e.destino===u.id&&(e.refeicao||r)===r);if(!x)return {label:u.nome,items:[]};const st=expStatus(x);const a=h2m(x.saida_real||x.saida_prev),b=x.chegada_real?h2m(x.chegada_real):Math.max(h2m(x.chegada_prev),nowMin());return {label:u.nome,items:[{a:h2m(x.saida_prev),b:h2m(x.chegada_prev),ghost:true,label:'Planejado '+x.saida_prev+'–'+x.chegada_prev},{a,b,cls:st==='Entregue'?'ok':st==='Atrasada'?'cr':st==='Entregue com atraso'?'at':'in',thin:true,label:`${x.id}: ${st}`}],marks:[{t:h2m(x.chegada_prev),shape:'d',cls:'ne',label:'Chegada prevista '+x.chegada_prev}]}})};
  const sv={name:`Serviço (${r.toLowerCase()})`,lanes:us.map(u=>({label:u.nome,items:[{a:j[0],b:j[1],ghost:true,label:'Janela do serviço'},...(j[0]<=nowMin()?[{a:j[0],b:Math.min(nowMin(),j[1]),cls:'ok',thin:true,label:'Atendendo'}]:[]),...rows('anomalias').filter(a=>a.data===d&&a.unidade===u.id&&a.inicio).map(a=>({a:h2m(a.inicio),b:h2m(a.fim||a.inicio)+1,cls:'cr',label:`${a.tipo} ${a.inicio}–${a.fim||''}`}))],marks:rows('reposicoes').filter(x=>x.data===d&&x.unidade===u.id&&x.chegada&&h2m(x.chegada)<=nowMin()&&h2m(x.chegada)-h2m(x.solicitacao)>P('sla_reposicao_min')*2).map(x=>({t:h2m(x.chegada),cls:'at',label:`Reposição lenta: ${nm('preparacoes',x.preparacao)} ${x.solicitacao}→${x.chegada}`}))}))};
  const bl=barreirasDia(d);const bs=[...new Set(bl.map(x=>x.b.id))].map(id=>{const xs=bl.filter(x=>x.b.id===id);const b=xs[0].b;return {t:h2m(b.limite),cls:xs.some(x=>x.cls==='cr')?'cr':xs.every(x=>x.st==='Feito')?'ok':'in',label:`${b.limite} ${b.nome}: ${xs.filter(x=>x.st==='Feito').length}/${xs.length} feitos`}});
  const br={name:'Barreiras',lanes:[{label:'Checks do dia',marks:bs}]};
  return ganttX({groups:[deg,prod,ex,sv,br],from,to})+legGantt}

/* ---------- funil do cru ao prato ---------- */
function funil(dias){const ini=addDays(S.date,-dias),so=rows('sobras').filter(x=>x.data>=ini&&x.data<S.date);const ps=prepsAtivas();
  const by_=ps.map(p=>{const x=so.filter(y=>y.preparacao===p.id);const env=sum(x,y=>N(y.produzido_kg)),sb=sum(x,y=>N(y.sobra_kg)),rs=sum(x,y=>N(y.resto_kg));const rd=(N(p.rend_coccao)||100)/100;return {p,cru:env/rd,env,serv:env-sb,cons:env-sb-rs,sb,rs}}).filter(x=>x.env>0);
  const T={cru:sum(by_,x=>x.cru),env:sum(by_,x=>x.env),serv:sum(by_,x=>x.serv),cons:sum(by_,x=>x.cons)};
  return {by_,T}}
function funilChart(f){const st=[['Pronto enviado às linhas',f.T.env,'#2563eb'],['Servido (sem sobra limpa)',f.T.serv,'#0891b2'],['Consumido (sem resto)',f.T.cons,'#16a34a']];const mx=Math.max(1,...st.map(x=>x[1]));
  return `<div class="mu" style="margin-bottom:8px">Insumo cru equivalente: <b style="color:var(--tx)">${fmt(f.T.cru,0)} kg</b> (o arroz e o feijão ganham peso na cocção; as proteínas perdem)</div>${st.map(([l,v,c],i)=>`<div style="display:grid;grid-template-columns:170px 1fr 120px;gap:10px;align-items:center;margin-bottom:8px"><span style="font-weight:600">${l}</span><div style="display:flex;justify-content:center"><div style="height:30px;width:${Math.max(4,v/mx*100)}%;background:${c};border-radius:8px;opacity:${1-i*0.12}"></div></div><b>${fmt(v,0)} kg ${i?`<span class="r" style="font-weight:600">(−${pct(1-v/st[i-1][1],1)})</span>`:''}</b></div>`).join('')}`}

/* ---------- saldo das cubas ao longo do serviço ---------- */
function saldoCubasChart(u,r){const ps=prepsAtivas();const j=janela(r)||[660,810];const n=nowMin();const ts=[];for(let t=j[0];t<=Math.min(n,j[1]);t+=10)ts.push(t);if(ts.length<2)return '<div class="empty">O serviço ainda não começou.</div>';
  const lt=rows('leituras').filter(x=>x.data===S.date&&x.unidade===u&&x.refeicao===r);
  const series=ps.map((p,i)=>{const kc=kgCuba(p);return {n:p.nome,c:COL[i%COL.length],v:ts.map(t=>{const l=lt.filter(x=>x.preparacao===p.id&&h2m(x.hora)<=t).sort((a,b)=>h2m(b.hora)-h2m(a.hora))[0];return l?N(l.saldo_kg)/kc:null})}});
  return legend(series)+chart({labels:ts.map(m2h),lines:series,ref:{v:0.5,l:'meia cuba'},yfmt:v=>fmt(v,1),h:230})+'<div class="hint">Cubas cheias na linha a cada leitura (saldo ÷ capacidade da cuba). Abaixo de meia cuba é hora de repor.</div>'}
function reposTimeline(u,r){const j=janela(r)||[660,810];const rp=rows('reposicoes').filter(x=>x.data===S.date&&x.unidade===u&&x.refeicao===r&&h2m(x.solicitacao)<=nowMin());const sla=P('sla_reposicao_min');
  const lanes=prepsAtivas().map(p=>({label:p.nome,items:rp.filter(x=>x.preparacao===p.id).map(x=>{const b=x.chegada&&h2m(x.chegada)<=nowMin()?h2m(x.chegada):nowMin();const dt=b-h2m(x.solicitacao);return {a:h2m(x.solicitacao),b:Math.max(b,h2m(x.solicitacao)+1),cls:x.chegada&&h2m(x.chegada)<=nowMin()?(dt<=sla?'ok':dt<=sla*2?'at':'cr'):'in',label:`${x.solicitacao} → ${x.chegada&&h2m(x.chegada)<=nowMin()?x.chegada:'a caminho'} (${fmt(dt)} min) · ${fmt(N(x.qtd_kg),1)} kg`}})}));
  return ganttX({groups:[{name:'Reposições (pedido → chegada na linha)',lanes}],from:j[0]-10,to:j[1],W:640,lw:120})+`<div class="legx"><span><i style="background:#22c55e"></i>≤ ${fmt(sla)} min</span><span><i style="background:#f59e0b"></i>até ${fmt(sla*2)} min</span><span><i style="background:#ef4444"></i>acima de ${fmt(sla*2)} min</span><span><i style="background:#3b82f6"></i>a caminho</span></div>`}

/* ---------- mapas de calor ---------- */
function heatCell(v,mx,fmtv){const a=mx?v/mx:0;return `<td style="background:rgba(37,99,235,${v?0.08+0.75*a:0});color:${a>0.6?'#fff':'#0f1e33'}">${v?fmtv(v):'—'}</td>`}
function heatDemanda(r){const cv=catVis().filter(x=>x.refeicao===r&&x.data<S.date);const ivs=curva(r).map(c=>c.inicio);const wd=[1,2,3,4,5,6,0],nm_=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const M=wd.map(w=>{const ds=[...new Set(cv.filter(x=>new Date(x.data+'T12:00').getDay()===w).map(x=>x.data))];return ivs.map(h=>ds.length?sum(cv.filter(x=>ds.includes(x.data)&&x.inicio===h),x=>N(x.entradas))/ds.length:0)});const mx=Math.max(1,...M.flat());
  return `<div class="tw"><table class="t heat"><thead><tr><th style="text-align:left">Dia</th>${ivs.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${M.map((row,i)=>`<tr><td style="text-align:left;font-weight:600">${nm_[i]}</td>${row.map(v=>heatCell(v,mx,x=>fmt(x))).join('')}</tr>`).join('')}</tbody></table></div><div class="hint">Média de pessoas por intervalo nos dias com catraca registrada.</div>`}
function barreirasHeat(n){const ds=diasAte(n);const bs=rows('barreiras').filter(b=>b.ativo!=='Não').sort(by('limite'));
  return `<div class="tw"><table class="t heat"><thead><tr><th style="text-align:left">Barreira</th>${ds.map(d=>`<th>${dBR(d).slice(0,2)}</th>`).join('')}</tr></thead><tbody>${bs.map(b=>`<tr><td style="text-align:left;font-weight:600;white-space:nowrap">${esc(b.nome.slice(0,30))}</td>${ds.map(d=>{const xs=barreirasDia(d).filter(x=>x.b.id===b.id&&x.st!=='Pendente');if(!xs.length)return '<td style="background:#f8fafc">·</td>';const c=xs.filter(x=>x.st==='Feito').length/xs.length;return `<td title="${dBR(d)}: ${pct(c,0)}" style="background:${c>=1?'#bbf7d0':c>=0.75?'#fde68a':'#fecaca'};color:#0f1e33;font-size:10px">${c>=1?'✓':Math.round(c*100)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="hint">Verde = feita em todas as unidades; amarelo = parcial; vermelho = maioria não feita.</div>`}
/* ---------- erro da previsão ---------- */
function erroPrevisao(n){const ds=diasAte(n).filter(d=>d<S.date);const us=unidadesServico();const cv=catVis();
  const s=us.map((u,i)=>({n:u.nome,c:COL[i%COL.length],v:ds.map(d=>{const c=cv.filter(x=>x.data===d&&x.unidade===u.id);if(!c.length)return null;const ks=new Set(c.map(x=>x.refeicao));const pv=sum(rows('previsoes').filter(x=>x.data===d&&x.unidade===u.id&&ks.has(x.refeicao)),x=>N(x.pessoas));return pv?(sum(c,x=>N(x.entradas))/pv-1)*100:null})}));

function headerMatch(h,fs){const n=norm(h);if(!n)return '';
  let f=fs.find(f=>norm(f.l)===n||norm(f.k)===n);if(f)return f.k;
  f=fs.find(f=>(SINON[f.k]||[]).some(s=>s===n));if(f)return f.k;
  f=fs.find(f=>norm(f.l).startsWith(n)&&n.length>3||n.startsWith(norm(f.l))&&norm(f.l).length>3);if(f)return f.k;
  f=fs.find(f=>(SINON[f.k]||[]).some(s=>n.includes(s)&&s.length>3));return f?f.k:''}
function readBook(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{try{
    if(typeof XLSX!=='undefined'&&!/\.csv$/i.test(file.name)){const wb=XLSX.read(rd.result,{type:'array',cellDates:false});cb(wb.SheetNames.map(n=>({n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})})))}
    else{const txt=new TextDecoder().decode(rd.result);const sep=txt.split('\n')[0].includes(';')?';':',';cb([{n:file.name.replace(/\.\w+$/,''),rows:txt.split(/\r?\n/).filter(Boolean).map(l=>l.split(sep).map(x=>x.replace(/^"|"$/g,'')))}])}
  }catch(err){toast('Não consegui ler o arquivo: '+err.message,true)}};
  rd.readAsArrayBuffer(file);
}

  <input type="file" id="impFile" accept=".xlsx,.xls,.csv" class="in" data-e="${e}"><div id="impBody" style="margin-top:12px"></div>`);

function readFile(file,e){if(typeof XLSX==='undefined'&&!/\.csv$/i.test(file.name)){toast('Leitor de planilhas não carregou; recarregue a página ou use CSV.',true);return}readBook(file,sh=>{IMP={e,sheets:sh,si:0,arquivo:file.name};impRender()})}
function impRender(){
  const {e,sheets,si}=IMP,sh=sheets[si];const hr=headerRow(sh.rows);
  IMP.hr=hr;const hd=(sh.rows[hr]||[]).map(String);const fs=fields(e);
  if(!(IMP.map&&IMP.mapSheet===si))IMP.map=hd.map(h=>headerMatch(h,fs));IMP.mapSheet=si;
  const body=sh.rows.slice(hr+1).filter(r=>r.some(x=>String(x).trim()));IMP.body=body;
  $('#impBody').innerHTML=`${sheets.length>1?`<label class="mu">Aba: <select class="in" id="impSheet">${sheets.map((s,i)=>`<option value="${i}" ${i===si?'selected':''}>${esc(s.n)}</option>`).join('')}</select></label>`:''}

  <p class="mu">${body.length} linha(s) · ${IMP.map.filter(Boolean).length} de ${hd.filter(Boolean).length} colunas reconhecidas.</p><div class="fg"><label>Modo<select class="in" id="impMode"><option value="upsert">Adicionar e atualizar pelo código</option><option value="replace">Substituir a tabela inteira</option></select></label><label>Origem dos dados<select class="in" id="impOrig"><option>Importado</option><option>Real</option><option>Simulado</option></select></label></div>
  <div class="mft"><button class="btn pr" data-a="impSave">Importar ${body.length} registro(s)</button><button class="btn" data-a="close">Cancelar</button></div>`;
}
function convVal(f,v){
  let s=String(v??'').trim();if(!f)return s;
  if(f.t==='n')return s===''?'':N(s.replace(/[^\d,.\-]/g,''));
  if(f.t==='d'){let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];if(/^\d{5}$/.test(s)){const d=new Date(Math.round((+s-25569)*864e5));return d.toISOString().slice(0,10)}return s}
  if(f.t==='h'){const m=s.match(/(\d{1,2}):(\d{2})/);if(m)return m[1].padStart(2,'0')+':'+m[2];if(/^0?\.\d+$/.test(s))return m2h(+s*1440);return s}
  if(f.t==='r'){const list=rows(f.e);const x=list.find(r=>r.id===s)||list.find(r=>norm(r.nome)===norm(s))||list.find(r=>norm(s).length>2&&(norm(r.nome).includes(norm(s))||norm(s).includes(norm(r.nome))));return x?x.id:s}
  if(f.t==='s'&&s){const op=opts(f);if(op.includes(s))return s;const n=norm(s);if(!n)return s;let o=op.find(x=>norm(x)===n);if(o)return o;const syn=Object.entries(VSIN).find(([k,v])=>n.includes(k)&&op.includes(v));if(syn)return syn[1];o=op.find(x=>norm(x).length>2&&(n.includes(norm(x))||norm(x).includes(n)));return o||s}
  return s}
function snapshot(es){const id='IMP-'+Date.now().toString(36).toUpperCase();UNDO[id]={};es.forEach(e=>UNDO[id][e]=JSON.parse(JSON.stringify(DATA[e]||{})));try{if(backend==='local'&&IDB.db)IDB.set('undo:'+id,UNDO[id])}catch(e){}return id}
async function logImport(id,arquivo,es,linhas,modo){await writeRow('importacoes',{id,quando:new Date().toISOString(),arquivo,tabelas:es.map(e=>SCHEMA[e].l).join(', '),linhas,modo,_origem:'Real'})}
function confirmImport(itens,id){modal(`<h2>✅ Dados salvos</h2><p>${itens.map(x=>`<b>${fmt(x.n)}</b> linha(s) em <b>${esc(SCHEMA[x.e].l)}</b>`).join('<br>')}</p><p class="mu">${backend==='local'?'Gravado neste navegador.':backend==='artifact'?'Gravado no banco do app.':'Gravado.'} Se algo entrou errado, desfaça em Gestão → Central de dados → Histórico.</p><div class="mft"><button class="btn pr" data-a="close">Ok</button><button class="btn dg" data-a="undoImp" data-v="${id}">Desfazer agora</button></div>`)}
async function impSave(){
  const {e,body,map}=IMP;const fs=fields(e);const mode=$('#impMode').value,orig=$('#impOrig').value;
  const out={};let n=0;const id=snapshot([e]);
  body.forEach(rw=>{const r={};map.forEach((k,i)=>{if(k)r[k]=convVal(fs.find(f=>f.k===k),rw[i])});if(!r.id)r.id=nextId(e)+'-'+(++n);r.id=String(r.id);r._origem=r._origem||orig;r._atualizado=new Date().toISOString();out[r.id]=r});
  DATA[e]=mode==='replace'?out:{...(DATA[e]||{}),...out};planCache.clear();if(dbEmpty){dbEmpty=false;for(const k of Object.keys(DATA))await persist(k)}else await writeTable(e);
  await logImport(id,IMP.arquivo,[e],Object.keys(out).length,mode==='replace'?'Substituir':'Adicionar');render();confirmImport([{e,n:Object.keys(out).length}],id);
}
function sheetEntity(n){const k=norm(n);return Object.keys(SCHEMA).find(e=>norm(e)===k||norm(SCHEMA[e].l)===k||(k.length>8&&(norm(SCHEMA[e].l).startsWith(k)||k.startsWith(norm(SCHEMA[e].l)))))}
function parseSheet(e,rowsX){const fs=fields(e);const hr=headerRow(rowsX);
  const hd=(rowsX[hr]||[]).map(String);const map=hd.map(h=>headerMatch(h,fs));
  const out={};rowsX.slice(hr+1).filter(r=>r.some(x=>String(x).trim())).forEach((rw,i)=>{const r={};map.forEach((k,j)=>{if(k)r[k]=convVal(fs.find(f=>f.k===k),rw[j])});if(!r.id)r.id=nextId(e)+'-'+(i+1);r.id=String(r.id);r._origem=r._origem||'Importado';r._atualizado=new Date().toISOString();out[r.id]=r});
  return {out,map,hd}}
function readAll(file){if(typeof XLSX==='undefined'){toast('Leitor de planilhas não carregou. Recarregue a página.',true);return}
  readBook(file,sh=>{IMPALL=sh.map(x=>({...x,e:sheetEntity(x.n)}));IMPALL.arquivo=file.name;
    $('#impAllBody').innerHTML=`<table class="t"><thead><tr><th>Aba</th><th>Tabela do app</th><th class="n">Linhas</th><th>Colunas reconhecidas</th></tr></thead><tbody>${IMPALL.map(x=>{if(!x.e)return `<tr><td>${esc(x.n)}</td><td class="mu">ignorada</td><td></td><td></td></tr>`;const p=parseSheet(x.e,x.rows);x.p=p;return `<tr><td>${esc(x.n)}</td><td><b>${esc(SCHEMA[x.e].l)}</b></td><td class="n">${Object.keys(p.out).length}</td><td class="${p.map.filter(Boolean).length<p.hd.filter(Boolean).length?'y':'g'}">${p.map.filter(Boolean).length}/${p.hd.filter(Boolean).length}</td></tr>`}).join('')}</tbody></table>
    <div class="fg" style="margin-top:10px"><label>Modo<select class="in" id="impAllMode"><option value="replace">Substituir as tabelas presentes na planilha</option><option value="upsert">Adicionar e atualizar pelo código</option></select></label></div><div class="mft"><button class="btn pr" data-a="impAllSave">Importar ${IMPALL.filter(x=>x.e).length} tabela(s)</button><button class="btn" data-a="close">Cancelar</button></div>`})}
async function impAllSave(){const mode=$('#impAllMode').value;const L=IMPALL.filter(x=>x.e&&x.p);const id=snapshot(L.map(x=>x.e));
  L.forEach(x=>{DATA[x.e]=mode==='replace'?x.p.out:{...(DATA[x.e]||{}),...x.p.out}});
  planCache.clear();closeModal();toast('Gravando '+L.length+' tabela(s)…');
  if(dbEmpty){dbEmpty=false;for(const k of Object.keys(DATA))await persist(k)}else for(const x of L)await writeTable(x.e);
  const ds=rows('catraca').map(r=>r.data).filter(Boolean).sort();if(ds.length&&!ds.includes(S.date)){S.date=ds[ds.length-1];syncHdr()}
  await logImport(id,IMPALL.arquivo,L.map(x=>x.e),sum(L,x=>Object.keys(x.p.out).length),mode==='replace'?'Substituir':'Adicionar');
  banner();render();confirmImport(L.map(x=>({e:x.e,n:Object.keys(x.p.out).length})),id)}
async function undoImport(id){let snap=UNDO[id];if(!snap&&backend==='local'&&IDB.db){try{snap=await IDB.get('undo:'+id)}catch(e){}}
  if(!snap){toast('Não há cópia para desfazer esta importação (feita em outra sessão).',true);return}
  for(const e of Object.keys(snap)){DATA[e]=snap[e];await writeTable(e)}const x=get('importacoes',id);if(x)await writeRow('importacoes',{...x,desfeita:'Sim'});planCache.clear();closeModal();render();toast('Importação desfeita')}
function readDataset(file){readBook(file,sh=>{const s=sh.find(x=>x.rows.length>1)||sh[0];const hr=headerRow(s.rows);const hd=(s.rows[hr]||[]).map((h,i)=>String(h).trim()||'Coluna '+(i+1));
  const linhas=s.rows.slice(hr+1).filter(r=>r.some(x=>String(x).trim())).map(r=>{const o={};hd.forEach((h,i)=>{let v=r[i];const dv=String(v??'').trim();const m=dv.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m)v=`${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;o[h]=v});if(o.Data&&!o.data)o.data=o.Data;return o});
  const id=norm(file.name).slice(0,20)+'-'+Date.now().toString(36).slice(-4);
  writeRow('datasets',{id,nome:file.name.replace(/\.\w+$/,''),colunas:hd,linhas,_origem:'Importado'});closeModal();toast(linhas.length+' linhas prontas para o Construtor de análises')})}

function presetFor(e){const r=S.ref||refAtual(),u=S.unit||S.unitOp||'';const p={};if(['previsoes','catraca','leituras','reposicoes','anomalias'].includes(e)){p.unidade=u;p.refeicao=r}

  if(e==='catraca'){const c=curva(r).find(c=>nowMin()>=h2m(c.inicio)&&nowMin()<h2m(c.inicio)+INT());if(c)p.inicio=c.inicio}
  if(e==='ordens'){p.unidade=(rows('unidades').find(x=>x.tipo==='Cozinha Central')||{}).id||'';p.refeicao=r;p.status='Programada'}
